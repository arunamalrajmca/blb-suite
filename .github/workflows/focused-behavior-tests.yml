name: Focused behavior tests

on:
  pull_request:
    paths:
      - 'tests/browser/webster-collector-behavior.spec.js'
      - 'tests/browser/case-sensitive-routing-behavior.spec.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/focused-behavior-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/browser/webster-collector-behavior.spec.js'
      - 'tests/browser/case-sensitive-routing-behavior.spec.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/focused-behavior-tests.yml'

permissions:
  contents: read

jobs:
  focused-behavior:
    name: Focused behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused behavior tests
        run: npm run test:focused-behavior
