name: Focused behavior tests

on:
  pull_request:
    paths:
      - 'tests/browser/webster-collector-behavior.spec.js'
      - 'tests/browser/blb-auto-hyperlinker.spec.js'
      - 'tests/browser/blb-draggable-button.spec.js'
      - 'tests/browser/study-reference-capture.spec.js'
      - 'tests/browser/case-sensitive-routing-behavior.spec.js'
      - '.github/workflows/focused-behavior-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/browser/webster-collector-behavior.spec.js'
      - 'tests/browser/case-sensitive-routing-behavior.spec.js'
      - '.github/workflows/focused-behavior-tests.yml'

permissions:
  contents: read

jobs:
  change-detection:
    name: Avoid duplicate focused browser runs
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.select.outputs.full_browser_suite }}
      focused_specs: ${{ steps.focused.outputs.focused_specs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify runtime changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Check whether the main browser suite covers this change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "full_browser_suite=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/select-browser-specs.mjs "$BASE"
          fi
      - name: Select only changed focused specs
        id: focused
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          FOCUSED=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/browser/webster-collector-behavior.spec.js|tests/browser/case-sensitive-routing-behavior.spec.js|tests/browser/blb-auto-hyperlinker.spec.js|tests/browser/blb-draggable-button.spec.js|tests/browser/study-reference-capture.spec.js)
                  if [[ -f "$path" ]]; then FOCUSED+=("$path"); fi
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACDMRT "$BASE...HEAD")
          fi
          FOCUSED_SPECS="$(IFS=,; printf '%s' "${FOCUSED[*]}")"
          echo "focused_specs=$FOCUSED_SPECS" >> "$GITHUB_OUTPUT"

  focused-behavior:
    name: Focused behavior tests
    needs: change-detection
    # Runtime changes are covered by the feature selector or full browser suite.
    # Keep this workflow for test-only edits, which intentionally do not trigger
    # feature E2E jobs on their own.
    if: ${{ needs.change-detection.outputs.runtime_changed == 'false' && needs.change-detection.outputs.full_browser_suite == 'false' && needs.change-detection.outputs.focused_specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium for extension browser tests
        run: npx playwright install --with-deps chromium
      - name: Run only changed focused behavior tests
        env:
          FOCUSED_SPECS: ${{ needs.change-detection.outputs.focused_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$FOCUSED_SPECS"
          npx playwright test "${specs[@]}"
