name: Normalize Chrome Web Store screenshot uploads

on:
  push:
    branches:
      - chore/chrome-web-store-screenshots-v5.2.51.100
    paths:
      - '.github/workflows/normalize-store-screenshot-uploads.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out screenshot-preparation branch
        uses: actions/checkout@v4
        with:
          ref: chore/chrome-web-store-screenshots-v5.2.51.100
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Convert uploaded screenshots to genuine PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path("docs/chrome-web-store-assets")
          mappings = {
              "Extension Popup.PNG": "extension-popup.png",
              "Omnibox Search.PNG": "tutorial-search.png",
              "Verse Lookup.PNG": "tutorial-references.png",
              "Study.PNG": "tutorial-study.png",
              "KJV-Scripture-Tools-Home-Page.PNG": "KJV-Scripture-Tools-Home-Page.png",
          }

          for source_name, target_name in mappings.items():
              source = assets / source_name
              if not source.is_file():
                  raise SystemExit(f"Required uploaded screenshot is missing: {source}")
              target = assets / target_name
              with Image.open(source) as im:
                  im.load()
                  rgb = im.convert("RGB")
                  rgb.save(target, format="PNG", optimize=True)
              with Image.open(target) as check:
                  check.verify()
              with Image.open(target) as check:
                  if check.format != "PNG":
                      raise SystemExit(f"Output is not PNG: {target}")
                  print(f"{target}: {check.format}, {check.width}x{check.height}, {target.stat().st_size} bytes")

          # Remove the redundant JPEG uploads and the misleading title-case .PNG
          # uploads only after all five genuine PNG outputs have been verified.
          for name in [
              "Extension Popup.JPG", "Omnibox Search.JPG", "Verse Lookup.JPG",
              "Study.JPG", "KJV-Scripture-Tools-Home-Page.JPG",
              *mappings.keys(),
          ]:
              path = assets / name
              if path.exists():
                  path.unlink()
                  print(f"Removed duplicate source: {path}")
          PY
      - name: Commit normalized screenshot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chrome-web-store-assets
          if git diff --cached --quiet; then
            echo "No screenshot asset changes to commit."
          else
            git commit -m "Normalize Chrome Web Store screenshots as PNG"
            git push origin HEAD:chore/chrome-web-store-screenshots-v5.2.51.100
          fi
