name: BLB Suite BROWSER E2E — REFERENCES & DOUBLE-CLICK
run-name: References & Double-click — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: Select requested CI suite
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.browser-select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.browser-select.outputs.changed_specs }}
      extension_spec_required: ${{ steps.browser-select.outputs.extension_spec_required }}
      browser_e2e_required: ${{ steps.browser-select.outputs.reference_required }}
    steps:
      - name: Checkout for change classification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: browser-select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"

  verse-context-regression:
    name: BROWSER E2E — generic verse-context gate
    needs: change-detection
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run generic verse-context regression first
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Generic article verse cues follow the latest explicit chapter context'
      - name: Run real Supply of Grace cross-site regression
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Article verse cues resolve context outside Facebook'
      - name: Upload generic verse-context diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-generic-verse-context-gate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: BROWSER E2E — References — ${{ matrix.group }}
    needs: [change-detection, verse-context-regression]
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.verse-context-regression.result == 'success' || needs.change-detection.outputs.extension_spec_required == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Cancel sibling reference-test jobs as soon as any group fails.
      fail-fast: true
      matrix:
        include:
          - group: positional
            grep: 'Double-click resolves any part|positional context|browser token|separate lines|standalone book numbers|ordinary heading words'
          - group: paired-timothy-post
            file: tests/browser/shared-regex-patterns.spec.js
            grep: 'paired 1 & 2 Timothy whole-book shorthand reaches the final MultiVerse POST with every chapter'
          - group: grammar-token-coverage-ot
            grep: 'generic reference grammar — exhaustive token coverage — OT'
          - group: grammar-token-coverage-nt
            grep: 'generic reference grammar — exhaustive token coverage — NT'
          - group: grammar-colon-ot-nt
            grep: 'generic reference syntax — colon forms'
          - group: grammar-dot-ot-nt
            grep: 'generic reference syntax — dot forms'
          - group: grammar-spaced-ot-nt
            grep: 'generic reference syntax — spaced forms'
          - group: grammar-chapter-ot-nt
            grep: 'generic reference syntax — chapter forms'
          - group: grammar-range-ot-nt
            grep: 'generic reference syntax — range forms'
          - group: aliases-and-roman
            grep: 'generic aliases|numbered aliases and Roman prefixes|standalone Roman prefixes'
          - group: resolver
            grep: 'All 66 canonical'
          - group: sagacity-nested-anchor
            file: tests/browser/rediscover-sagacity-button.spec.js
            grep: 'Sagacity browser collector captures Matt\\. 12:37 from malformed nested BLB anchors'
          - group: research-derived
            file: tests/browser/research-dom-smoke.spec.js
            grep: 'D14|D16|D18|D19|D20|D21|D22|D23|D25|D41|D42|D43|D44|D45|D46|D47|D48|D49|D50|D51|D52|D53|D54|D55|D56|D57|D58|D59|D60'
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        run: npm install --prefer-offline
      - name: Install Playwright Chromium
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        run: npx playwright install --with-deps chromium
      - name: Grant test-only generic host access
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — ${{ matrix.group }}
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js') }}
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test "${{ matrix.file || 'tests/browser/extension.spec.js' }}" --grep "${{ matrix.grep }}"
      - name: Upload Playwright diagnostics — ${{ matrix.group }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-references-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish


  browser-e2e-features:
    name: BROWSER E2E — FEATURES
    # Do not start feature tests until every reference group has passed.
    # A failed reference group skips this job instead of running more tests.
    needs:
      - change-detection
      - browser-e2e
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — FEATURES
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'MV3 service worker|popup loads|Show on BLB|Alt\+B toggle enforcement'
      - name: Upload Playwright diagnostics — FEATURES
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-features
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish

  browser-e2e-summary:
    name: browser-e2e
    needs:
      - change-detection
      - browser-e2e
      - browser-e2e-features
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Publish browser-e2e commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_STATE: ${{ needs.change-detection.result == 'success' && (needs.browser-e2e.result == 'success' || (needs.browser-e2e.result == 'skipped' && needs.change-detection.outputs.browser_e2e_required == 'false')) && (needs.browser-e2e-features.result == 'success' || (needs.browser-e2e-features.result == 'skipped' && needs.change-detection.outputs.extension_spec_required == 'false')) && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.change-detection.result == 'success' && (needs.browser-e2e.result == 'success' || (needs.browser-e2e.result == 'skipped' && needs.change-detection.outputs.browser_e2e_required == 'false')) && (needs.browser-e2e-features.result == 'success' || (needs.browser-e2e-features.result == 'skipped' && (needs.change-detection.outputs.full_browser_suite != 'true' && !contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js') || needs.change-detection.outputs.browser_e2e_required == 'false'))) && 'browser E2E passed or not applicable' || 'browser E2E failed' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$STATUS_DESCRIPTION\",\"context\":\"browser-e2e\"}"

      - name: Require all browser E2E suites to pass
        shell: bash
        run: |
          if [ "${{ needs.change-detection.result }}" != "success" ] || [ "${{ needs.browser-e2e.result }}" = "failure" ] || [ "${{ needs.browser-e2e.result }}" = "cancelled" ] || ( [ "${{ needs.browser-e2e.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.browser_e2e_required }}" != "false" ] ) || [ "${{ needs.browser-e2e-features.result }}" = "failure" ] || [ "${{ needs.browser-e2e-features.result }}" = "cancelled" ] || ( [ "${{ needs.browser-e2e-features.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.extension_spec_required }}" != "false" ] ); then
            echo "References matrix: ${{ needs.browser-e2e.result }}"
            echo "Features: ${{ needs.browser-e2e-features.result }}"
            exit 1
          fi
          echo "All applicable browser E2E suites passed."

      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish