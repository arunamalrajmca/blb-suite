name: BLB Suite BROWSER E2E — REFERENCES & DOUBLE-CLICK
run-name: References & Double-click — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  change-detection:
    name: Detect runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.runtime.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: runtime
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/is-runtime-change.sh

  browser-e2e:
    name: BROWSER E2E — References — ${{ matrix.group }}
    needs: change-detection
    if: ${{ needs.change-detection.outputs.runtime_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: positional
            grep: 'Double-click resolves any part|positional context|browser token|separate lines|standalone book numbers|ordinary heading words'
          - group: grammar-token-coverage-ot
            grep: 'generic reference grammar — exhaustive token coverage — OT'
          - group: grammar-token-coverage-nt
            grep: 'generic reference grammar — exhaustive token coverage — NT'
          - group: grammar-colon-ot-nt
            grep: 'generic reference syntax — colon forms'
          - group: grammar-dot-ot-nt
            grep: 'generic reference syntax — dot forms'
          - group: grammar-spaced-ot-nt
            grep: 'generic reference syntax — spaced forms'
          - group: grammar-chapter-ot-nt
            grep: 'generic reference syntax — chapter forms'
          - group: grammar-range-ot-nt
            grep: 'generic reference syntax — range forms'
          - group: aliases-and-roman
            grep: 'generic aliases|numbered aliases and Roman prefixes|standalone Roman prefixes'
          - group: resolver
            grep: 'All 66 canonical'
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — ${{ matrix.group }}
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep "${{ matrix.grep }}"
      - name: Upload Playwright diagnostics — ${{ matrix.group }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-references-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish


  browser-e2e-features:
    name: BROWSER E2E — FEATURES
    needs: change-detection
    if: ${{ needs.change-detection.outputs.runtime_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — FEATURES
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'MV3 service worker|popup loads|Show on BLB'
      - name: Upload Playwright diagnostics — FEATURES
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-features
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish

  browser-e2e-summary:
    name: browser-e2e
    needs:
      - change-detection
      - browser-e2e
      - browser-e2e-features
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Publish browser-e2e commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_STATE: ${{ needs.change-detection.result == 'success' && (needs.browser-e2e.result == 'success' || (needs.browser-e2e.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && (needs.browser-e2e-features.result == 'success' || (needs.browser-e2e-features.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.change-detection.result == 'success' && (needs.browser-e2e.result == 'success' || needs.browser-e2e.result == 'skipped') && (needs.browser-e2e-features.result == 'success' || needs.browser-e2e-features.result == 'skipped') && 'browser E2E passed or not applicable' || 'browser E2E failed' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$STATUS_DESCRIPTION\",\"context\":\"browser-e2e\"}"

      - name: Require all browser E2E suites to pass
        shell: bash
        run: |
          if [ "${{ needs.change-detection.result }}" != "success" ] || [ "${{ needs.browser-e2e.result }}" = "failure" ] || [ "${{ needs.browser-e2e.result }}" = "cancelled" ] || [ "${{ needs.browser-e2e-features.result }}" = "failure" ] || [ "${{ needs.browser-e2e-features.result }}" = "cancelled" ]; then
            echo "References matrix: ${{ needs.browser-e2e.result }}"
            echo "Features: ${{ needs.browser-e2e-features.result }}"
            exit 1
          fi
          echo "All applicable browser E2E suites passed."

      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish