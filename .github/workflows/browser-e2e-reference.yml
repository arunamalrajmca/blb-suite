name: BLB Suite BROWSER E2E — REFERENCES & DOUBLE-CLICK
run-name: References & Double-click — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - '!extension/icons/**'
      - '!extension/store-assets/**'
      - '!extension/THIRD-PARTY-NOTICES.txt'
      - 'tests/**'
      - '!tests/selector/**'
      - '!tests/test_verify_store_package.py'
      - '!tests/test_verify_store_submission_assets.py'
      - 'scripts/**'
      - '!scripts/classify-ci-changes.mjs'
      - '!scripts/select-browser-specs.mjs'
      - '!scripts/select-reference-matrix.mjs'
      - '!scripts/reference-e2e-matrix.json'
      - '!scripts/test-ci-routing-selector.js'
      - '!scripts/validate-build.js'
      - '!scripts/package-release.sh'
      - '!scripts/verify-store-assets.py'
      - '!scripts/verify-store-branding.py'
      - '!scripts/verify-store-package.py'
      - '!scripts/verify-store-submission-assets.py'
      - '!scripts/compare-performance.mjs'
      - '!scripts/test-*.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Give every workflow execution its own concurrency group.
# This prevents an older or stuck References run from holding a newer run pending.
# It also avoids cancelling sibling runs; each execution is allowed to finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  cancel-superseded-runs:
    name: Cancel older References runs for this PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Cancel older queued or running attempts for this PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          # This endpoint is scoped to this workflow file, then we additionally
          # match the PR number and only cancel runs older than this execution.
          stale_runs="$(gh api -X GET \
            -f branch="$GITHUB_HEAD_REF" \
            -f event=pull_request \
            -f per_page=100 \
            "repos/$GITHUB_REPOSITORY/actions/workflows/browser-e2e-reference.yml/runs" \
            --jq '.workflow_runs[]
              | select(.id != (env.CURRENT_RUN_ID | tonumber))
              | select(.run_number < (env.CURRENT_RUN_NUMBER | tonumber))
              | select([.pull_requests[].number] | index(env.PR_NUMBER | tonumber) != null)
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")
              | .id')"

          if [[ -z "$stale_runs" ]]; then
            echo "No older queued or running References runs found for PR #$PR_NUMBER."
            exit 0
          fi

          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Requesting cancellation of superseded References run $run_id for PR #$PR_NUMBER."
            cancel_error="$(gh api --silent --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" 2>&1)" || {
              if [[ "$cancel_error" == *"HTTP 409"* ]]; then
                echo "Run $run_id completed before cancellation; treating it as already stopped."
                continue
              fi
              printf '%s\\n' "$cancel_error" >&2
              exit 1
            }

            # A normal cancel can leave a stuck run alive. Give it a brief
            # chance to stop, then force-cancel only if this same-PR,
            # same-workflow run is still active.
            sleep 5
            run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [[ "$run_status" == "queued" || "$run_status" == "in_progress" ||
                  "$run_status" == "waiting" || "$run_status" == "requested" ]]; then
              echo "References run $run_id is still $run_status; force-cancelling it."
              force_cancel_error="$(gh api --silent --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" 2>&1)" || {
                if [[ "$force_cancel_error" == *"HTTP 409"* ]]; then
                  echo "Run $run_id completed before force-cancellation; treating it as stopped."
                else
                  printf '%s\\n' "$force_cancel_error" >&2
                  exit 1
                fi
              }
            else
              echo "References run $run_id stopped with status $run_status."
            fi
          done <<< "$stale_runs"

  change-detection:
    name: Select requested CI suite
    needs: cancel-superseded-runs
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.browser-select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.browser-select.outputs.changed_specs }}
      changed_browser_specs: ${{ steps.browser-select.outputs.changed_browser_specs }}
      group_a_changed_browser_specs: ${{ steps.browser-select.outputs.group_a_changed_browser_specs }}
      unmapped_specs: ${{ steps.browser-select.outputs.unmapped_specs }}
      group_a_required: ${{ steps.browser-select.outputs.group_a_required }}
      study_sessions_required: ${{ steps.browser-select.outputs.study_sessions_required }}
      group_b_required: ${{ steps.browser-select.outputs.group_b_required }}
      extension_spec_required: ${{ steps.browser-select.outputs.extension_spec_required }}
      browser_e2e_required: ${{ steps.browser-select.outputs.reference_required }}
      reference_matrix: ${{ steps.matrix-select.outputs.reference_matrix }}
      reference_matrix_required: ${{ steps.matrix-select.outputs.reference_matrix_required }}
      reference_matrix_count: ${{ steps.matrix-select.outputs.reference_matrix_count }}
      focused_specs: ${{ steps.focused.outputs.focused_specs }}
    steps:
      # Publish a pending commit status before classification or browser tests.
      # Configure this exact context ("browser-e2e") as a required check on main.
      - name: Publish browser-e2e pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Browser E2E validation is running","context":"browser-e2e"}'
      - name: Checkout for change classification
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: browser-select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          KNOWN_FAILURES_ONLY: ${{ github.event.pull_request.number == 633 }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"
      - name: Select reference matrix before allocating runners
        id: matrix-select
        env:
          FULL_BROWSER_SUITE: ${{ steps.browser-select.outputs.full_browser_suite }}
          CHANGED_SPECS: ${{ steps.browser-select.outputs.changed_specs }}
          CHANGED_BROWSER_SPECS: ${{ steps.browser-select.outputs.changed_browser_specs }}
        run: node scripts/select-reference-matrix.mjs
      - name: Select changed focused browser specs for test-only edits
        id: focused
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          FOCUSED=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/browser/*.spec.js)
                  if [[ -f "$path" ]]; then FOCUSED+=("$path"); fi
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACDMRT "$BASE...HEAD")
          fi
          FOCUSED_SPECS="$(IFS=,; printf '%s' "${FOCUSED[*]}")"
          echo "focused_specs=$FOCUSED_SPECS" >> "$GITHUB_OUTPUT"
  verse-context-regression:
    name: BROWSER E2E — generic verse-context gate
    needs: change-detection
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && needs.change-detection.outputs.extension_spec_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js')) && (matrix.file || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run both verse-context regressions in one Playwright invocation
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Generic article verse cues follow the latest explicit chapter context|Article verse cues resolve context outside Facebook'
      - name: Upload generic verse-context diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blb-suite-generic-verse-context-gate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: BROWSER E2E — References — ${{ matrix.group }}
    needs: [change-detection, verse-context-regression]
    if: ${{ always() && needs.change-detection.outputs.reference_matrix_required == 'true' && (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.verse-context-regression.result == 'success' || needs.change-detection.outputs.extension_spec_required == 'false' || contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Collect every reference-test group's result before failing the workflow.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.change-detection.outputs.reference_matrix) }}
    steps:
      - name: Checkout
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache Playwright browsers
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        if: ${{ matrix.group != 'source-page-button-redirect-refresh' && (matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); const hosts=['https://example.com/*','https://www.gotquestions.org/*','https://www.christianity.com/*','https://www.crosswalk.com/*','https://www.enduringword.com/*']; m.host_permissions=[...(m.host_permissions||[]),...hosts]; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),...hosts]; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — ${{ matrix.group }}
        if: ${{ matrix.file || matrix.files || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILES="${{ matrix.files && join(matrix.files, ' ') || matrix.file || 'tests/browser/extension.spec.js' }}"
          MATRIX_GREP="${{ matrix.grep }}"
          read -r -a specs <<< "$TEST_FILES"
          total="${#specs[@]}"
          if (( total == 0 )); then
            echo "::error::Reference matrix group selected no spec files."
            exit 1
          fi
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            if [[ ! -f "$spec" ]]; then
              echo "::error::Selected Playwright spec does not exist: $spec"
              exit 1
            fi
            printf '[%s/%s] Running %s\n' "$((index + 1))" "$total" "$spec"
            # Invoke Playwright once per exact file; never combine positional
            # filters, which Playwright treats as intersecting expressions.
            if [[ "$MATRIX_GREP" == ".*" ]]; then
              npx playwright test "$spec"
            else
              npx playwright test "$spec" --grep "$MATRIX_GREP"
            fi
          done
      - name: Upload Playwright diagnostics — ${{ matrix.group }}
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blb-suite-browser-e2e-references-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14


  browser-e2e-features:
    name: BROWSER E2E — FEATURES
    # Do not start feature tests until every reference group has passed.
    # A failed reference group skips this job instead of running more tests.
    needs:
      - change-detection
      - browser-e2e
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && needs.change-detection.outputs.extension_spec_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js')) && (matrix.file || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — FEATURES
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'MV3 service worker|popup loads|Show on BLB|Alt\+B toggle enforcement'
      - name: Upload Playwright diagnostics — FEATURES
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blb-suite-browser-e2e-features
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  grouped-browser-e2e:
    name: BROWSER E2E — FEATURE GROUPS
    needs: change-detection
    if: ${{ always() && needs.change-detection.result == 'success' }}
    uses: ./.github/workflows/browser-e2e-groups.yml
    with:
      full_browser_suite: ${{ needs.change-detection.outputs.full_browser_suite }}
      changed_specs: ${{ needs.change-detection.outputs.changed_specs }}
      changed_browser_specs: ${{ needs.change-detection.outputs.changed_browser_specs }}
      group_a_changed_browser_specs: ${{ needs.change-detection.outputs.group_a_changed_browser_specs }}
      unmapped_specs: ${{ needs.change-detection.outputs.unmapped_specs }}
      group_a_required: ${{ needs.change-detection.outputs.group_a_required }}
      study_sessions_required: ${{ needs.change-detection.outputs.study_sessions_required }}
      group_b_required: ${{ needs.change-detection.outputs.group_b_required }}
      browser_e2e_required: ${{ needs.change-detection.outputs.browser_e2e_required }}
    secrets: inherit

  browser-e2e-summary:
    name: browser-e2e
    needs:
      - change-detection
      - verse-context-regression
      - browser-e2e
      - browser-e2e-features
      - grouped-browser-e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # This job is scheduled only after all required browser suites complete.
    timeout-minutes: 10
    permissions:
      statuses: write
    steps:
      # One shell predicate determines both the published commit status and
      # the job result, preventing the status and required-check logic drifting.
      - name: Validate all applicable browser suites and publish final status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.change-detection.result }}
          REFERENCE_REQUIRED: ${{ needs.change-detection.outputs.browser_e2e_required }}
          EXTENSION_SPEC_REQUIRED: ${{ needs.change-detection.outputs.extension_spec_required }}
          FULL_BROWSER_SUITE: ${{ needs.change-detection.outputs.full_browser_suite }}
          CHANGED_SPECS: ${{ needs.change-detection.outputs.changed_specs }}
          CHANGED_BROWSER_SPECS: ${{ needs.change-detection.outputs.changed_browser_specs }}
          VERSE_CONTEXT_RESULT: ${{ needs.verse-context-regression.result }}
          REFERENCE_MATRIX_RESULT: ${{ needs.browser-e2e.result }}
          FEATURES_RESULT: ${{ needs.browser-e2e-features.result }}
          GROUPS_RESULT: ${{ needs.grouped-browser-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          reasons=()

          if [[ "$CHANGE_RESULT" != "success" ]]; then
            failed=1
            reasons+=("change detection: $CHANGE_RESULT")
          fi

          if [[ "$GROUPS_RESULT" != "success" && "$GROUPS_RESULT" != "not_required" ]]; then
            failed=1
            reasons+=("Group A/B browser E2E was required but was $GROUPS_RESULT")
          fi

          reference_expected=false
          if [[ "$REFERENCE_REQUIRED" == "true" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reference_expected=true
          fi

          verse_context_expected=false
          if [[ "$reference_expected" == true && "$EXTENSION_SPEC_REQUIRED" == "true" && ( "$FULL_BROWSER_SUITE" == "true" || ",$CHANGED_SPECS," == *",tests/browser/extension.spec.js,"* ) && ",$CHANGED_BROWSER_SPECS," != *",tests/browser/extension.spec.js,"* ]]; then
            verse_context_expected=true
          fi

          if [[ "$verse_context_expected" == true ]]; then
            if [[ "$VERSE_CONTEXT_RESULT" != "success" ]]; then
              failed=1
              reasons+=("verse-context regression was required but was $VERSE_CONTEXT_RESULT")
            fi
          elif [[ "$VERSE_CONTEXT_RESULT" == "failure" || "$VERSE_CONTEXT_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("verse-context regression: $VERSE_CONTEXT_RESULT")
          fi

          if [[ "$reference_expected" == true ]]; then
            if [[ "$REFERENCE_MATRIX_RESULT" != "success" && ! ( "$REFERENCE_MATRIX_RESULT" == "skipped" && ",$CHANGED_BROWSER_SPECS," == *",tests/browser/extension.spec.js,"* ) ]]; then
              failed=1
              reasons+=("reference matrix was required but was $REFERENCE_MATRIX_RESULT")
            fi
          elif [[ "$REFERENCE_MATRIX_RESULT" == "failure" || "$REFERENCE_MATRIX_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("reference matrix: $REFERENCE_MATRIX_RESULT")
          fi

          features_expected=false
          if [[ "$reference_expected" == true && "$EXTENSION_SPEC_REQUIRED" == "true" && ( "$FULL_BROWSER_SUITE" == "true" || ",$CHANGED_SPECS," == *",tests/browser/extension.spec.js,"* ) && ",$CHANGED_BROWSER_SPECS," != *",tests/browser/extension.spec.js,"* ]]; then
            features_expected=true
          fi

          if [[ "$features_expected" == true ]]; then
            if [[ "$FEATURES_RESULT" != "success" ]]; then
              failed=1
              reasons+=("feature suite was required but was $FEATURES_RESULT")
            fi
          elif [[ "$FEATURES_RESULT" == "failure" || "$FEATURES_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("feature suite: $FEATURES_RESULT")
          fi

          if [[ "$failed" == 0 ]]; then
            state=success
            description="All applicable browser E2E suites passed"
          else
            state=failure
            description="Browser E2E validation incomplete or failed"
            printf 'Browser E2E gate failed:\n'
            printf ' - %s\n' "${reasons[@]}"
          fi

          payload=$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"browser-e2e"}' "$state" "$TARGET_URL" "$description")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "$payload"

          if [[ "$failed" != 0 ]]; then
            exit 1
          fi

          echo "$description"


  focused-test-only-behavior:
    name: Focused behavior tests (test-only edits)
    needs: change-detection
    if: ${{ github.event_name == 'pull_request' && needs.change-detection.outputs.runtime_changed == 'false' && needs.change-detection.outputs.full_browser_suite == 'false' && needs.change-detection.outputs.changed_specs == '' && needs.change-detection.outputs.focused_specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium for extension browser tests
        run: npx playwright install --with-deps chromium
      - name: Run only changed focused behavior tests
        env:
          FOCUSED_SPECS: ${{ needs.change-detection.outputs.focused_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$FOCUSED_SPECS"
          total="${#specs[@]}"
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            [[ -f "$spec" ]] || { echo "::error::Selected Playwright spec does not exist: $spec"; exit 1; }
            printf '[%s/%s] Running %s\n' "$((index + 1))" "$total" "$spec"
            npx playwright test "$spec"
          done
      - name: Upload focused behavior diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blb-suite-focused-behavior-diagnostics
          path: |
            test-results/selection-action-timing.json
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
