name: BLB Suite BROWSER E2E — REFERENCES & DOUBLE-CLICK
run-name: References & Double-click — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'tests/**'
      - '!tests/selector/**'
      - '!tests/test_verify_store_package.py'
      - '!tests/test_verify_store_submission_assets.py'
      - 'scripts/**'
      - '!scripts/classify-ci-changes.mjs'
      - '!scripts/select-browser-specs.mjs'
      - '!scripts/select-reference-matrix.mjs'
      - '!scripts/reference-e2e-matrix.json'
      - '!scripts/test-ci-routing-selector.js'
      - '!scripts/package-release.sh'
      - '!scripts/verify-store-assets.py'
      - '!scripts/verify-store-branding.py'
      - '!scripts/verify-store-package.py'
      - '!scripts/verify-store-submission-assets.py'
      - '!scripts/compare-performance.mjs'
      - '!scripts/test-*.js'
      - 'regression-suite/**'
      - '!regression-suite/Verify-BLB-Zip.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Keep one active run per PR: newer commits supersede outdated PR runs.
# Pushes to main and manual runs keep their own ref-based group and are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-detection:
    name: Select requested CI suite
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.browser-select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.browser-select.outputs.changed_specs }}
      changed_browser_specs: ${{ steps.browser-select.outputs.changed_browser_specs }}
      extension_spec_required: ${{ steps.browser-select.outputs.extension_spec_required }}
      browser_e2e_required: ${{ steps.browser-select.outputs.reference_required }}
      reference_matrix: ${{ steps.matrix-select.outputs.reference_matrix }}
      reference_matrix_required: ${{ steps.matrix-select.outputs.reference_matrix_required }}
      reference_matrix_count: ${{ steps.matrix-select.outputs.reference_matrix_count }}
      focused_specs: ${{ steps.focused.outputs.focused_specs }}
    steps:
      # Publish a pending commit status before classification or browser tests.
      # Configure this exact context ("browser-e2e") as a required check on main.
      - name: Publish browser-e2e pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Browser E2E validation is running","context":"browser-e2e"}'
      - name: Checkout for change classification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: browser-select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"
      - name: Select reference matrix before allocating runners
        id: matrix-select
        env:
          FULL_BROWSER_SUITE: ${{ steps.browser-select.outputs.full_browser_suite }}
          CHANGED_SPECS: ${{ steps.browser-select.outputs.changed_specs }}
          CHANGED_BROWSER_SPECS: ${{ steps.browser-select.outputs.changed_browser_specs }}
        run: node scripts/select-reference-matrix.mjs
      - name: Select changed focused browser specs for test-only edits
        id: focused
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          FOCUSED=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/browser/*.spec.js)
                  if [[ -f "$path" ]]; then FOCUSED+=("$path"); fi
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACDMRT "$BASE...HEAD")
          fi
          FOCUSED_SPECS="$(IFS=,; printf '%s' "${FOCUSED[*]}")"
          echo "focused_specs=$FOCUSED_SPECS" >> "$GITHUB_OUTPUT"

  verse-context-regression:
    name: BROWSER E2E — generic verse-context gate
    needs: change-detection
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js')) && (matrix.file || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run generic verse-context regression first
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Generic article verse cues follow the latest explicit chapter context'
      - name: Run real Supply of Grace cross-site regression
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Article verse cues resolve context outside Facebook'
      - name: Upload generic verse-context diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-generic-verse-context-gate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: BROWSER E2E — References — ${{ matrix.group }}
    needs: [change-detection, verse-context-regression]
    if: ${{ always() && needs.change-detection.outputs.reference_matrix_required == 'true' && (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.verse-context-regression.result == 'success' || needs.change-detection.outputs.extension_spec_required == 'false' || contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Cancel sibling reference-test jobs as soon as any group fails.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.change-detection.outputs.reference_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); const hosts=['https://example.com/*','https://www.gotquestions.org/*','https://www.christianity.com/*','https://www.crosswalk.com/*','https://www.enduringword.com/*']; m.host_permissions=[...(m.host_permissions||[]),...hosts]; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),...hosts]; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — ${{ matrix.group }}
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test ${{ matrix.files && join(matrix.files, ' ') || matrix.file || 'tests/browser/extension.spec.js' }} --grep "${{ matrix.grep }}"
      - name: Upload Playwright diagnostics — ${{ matrix.group }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-references-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14


  browser-e2e-features:
    name: BROWSER E2E — FEATURES
    # Do not start feature tests until every reference group has passed.
    # A failed reference group skips this job instead of running more tests.
    needs:
      - change-detection
      - browser-e2e
    if: ${{ (needs.change-detection.outputs.browser_e2e_required == 'true' || github.event_name == 'workflow_dispatch') && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, matrix.file || 'tests/browser/extension.spec.js')) && (matrix.file || !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js')) }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — FEATURES
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'MV3 service worker|popup loads|Show on BLB|Alt\+B toggle enforcement'
      - name: Upload Playwright diagnostics — FEATURES
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-features
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e-summary:
    name: browser-e2e
    needs:
      - change-detection
      - verse-context-regression
      - browser-e2e
      - browser-e2e-features
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:

      # One shell predicate determines both the published commit status and
      # the job result, preventing the status and required-check logic drifting.
      - name: Validate all applicable browser suites and publish final status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.change-detection.result }}
          REFERENCE_REQUIRED: ${{ needs.change-detection.outputs.browser_e2e_required }}
          EXTENSION_SPEC_REQUIRED: ${{ needs.change-detection.outputs.extension_spec_required }}
          FULL_BROWSER_SUITE: ${{ needs.change-detection.outputs.full_browser_suite }}
          CHANGED_SPECS: ${{ needs.change-detection.outputs.changed_specs }}
          CHANGED_BROWSER_SPECS: ${{ needs.change-detection.outputs.changed_browser_specs }}
          VERSE_CONTEXT_RESULT: ${{ needs.verse-context-regression.result }}
          REFERENCE_MATRIX_RESULT: ${{ needs.browser-e2e.result }}
          FEATURES_RESULT: ${{ needs.browser-e2e-features.result }}
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          reasons=()

          if [[ "$CHANGE_RESULT" != "success" ]]; then
            failed=1
            reasons+=("change detection: $CHANGE_RESULT")
          fi

          reference_expected=false
          if [[ "$REFERENCE_REQUIRED" == "true" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reference_expected=true
          fi

          verse_context_expected=false
          if [[ "$reference_expected" == true && ( "$FULL_BROWSER_SUITE" == "true" || ",$CHANGED_SPECS," == *",tests/browser/extension.spec.js,"* ) && ",$CHANGED_BROWSER_SPECS," != *",tests/browser/extension.spec.js,"* ]]; then
            verse_context_expected=true
          fi

          if [[ "$verse_context_expected" == true ]]; then
            if [[ "$VERSE_CONTEXT_RESULT" != "success" ]]; then
              failed=1
              reasons+=("verse-context regression was required but was $VERSE_CONTEXT_RESULT")
            fi
          elif [[ "$VERSE_CONTEXT_RESULT" == "failure" || "$VERSE_CONTEXT_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("verse-context regression: $VERSE_CONTEXT_RESULT")
          fi

          if [[ "$reference_expected" == true ]]; then
            if [[ "$REFERENCE_MATRIX_RESULT" != "success" && ! ( "$REFERENCE_MATRIX_RESULT" == "skipped" && ",$CHANGED_BROWSER_SPECS," == *",tests/browser/extension.spec.js,"* ) ]]; then
              failed=1
              reasons+=("reference matrix was required but was $REFERENCE_MATRIX_RESULT")
            fi
          elif [[ "$REFERENCE_MATRIX_RESULT" == "failure" || "$REFERENCE_MATRIX_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("reference matrix: $REFERENCE_MATRIX_RESULT")
          fi

          features_expected=false
          if [[ "$reference_expected" == true && ( "$FULL_BROWSER_SUITE" == "true" || ",$CHANGED_SPECS," == *",tests/browser/extension.spec.js,"* ) && ",$CHANGED_BROWSER_SPECS," != *",tests/browser/extension.spec.js,"* ]]; then
            features_expected=true
          fi

          if [[ "$features_expected" == true ]]; then
            if [[ "$FEATURES_RESULT" != "success" ]]; then
              failed=1
              reasons+=("feature suite was required but was $FEATURES_RESULT")
            fi
          elif [[ "$FEATURES_RESULT" == "failure" || "$FEATURES_RESULT" == "cancelled" ]]; then
            failed=1
            reasons+=("feature suite: $FEATURES_RESULT")
          fi

          if [[ "$failed" == 0 ]]; then
            state=success
            description="All applicable browser E2E suites passed"
          else
            state=failure
            description="Browser E2E validation incomplete or failed"
            printf 'Browser E2E gate failed:\n'
            printf ' - %s\n' "${reasons[@]}"
          fi

          payload=$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"browser-e2e"}' "$state" "$TARGET_URL" "$description")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "$payload"

          if [[ "$failed" != 0 ]]; then
            exit 1
          fi

          echo "$description"

  cancel-sibling-runs:
    name: Cancel sibling runs after failure
    if: ${{ failure() && github.event_name == 'pull_request' }}
    needs: [change-detection, verse-context-regression, browser-e2e, browser-e2e-features, browser-e2e-summary]
    permissions:
      actions: write
    uses: ./.github/workflows/cancel-sibling-runs-on-failure.yml

  focused-test-only-behavior:
    name: Focused behavior tests (test-only edits)
    needs: change-detection
    if: ${{ github.event_name == 'pull_request' && needs.change-detection.outputs.runtime_changed == 'false' && needs.change-detection.outputs.full_browser_suite == 'false' && needs.change-detection.outputs.changed_specs == '' && needs.change-detection.outputs.focused_specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium for extension browser tests
        run: npx playwright install --with-deps chromium
      - name: Run only changed focused behavior tests
        env:
          FOCUSED_SPECS: ${{ needs.change-detection.outputs.focused_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$FOCUSED_SPECS"
          npx playwright test "${specs[@]}"
