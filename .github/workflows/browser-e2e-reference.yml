name: BLB Suite BROWSER E2E — REFERENCES & DOUBLE-CLICK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-e2e:
    name: BROWSER E2E — REFERENCES & DOUBLE-CLICK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Double-click|All 66 canonical'
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-references-double-click
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
