name: BLB Suite BROWSER E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  focused-doubleclick-e2e:
    name: Focused double-click E2E (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: Acts-17-11-Acts
            grep: "Double-click isolated token — Acts 17:11 — Acts"
          - case: Acts-17-11-17
            grep: "Double-click isolated token — Acts 17:11 — 17"
          - case: Acts-17-11-11
            grep: "Double-click isolated token — Acts 17:11 — 11"
          - case: Jn-3-16-Jn
            grep: "Double-click isolated token — Jn 3:16 — Jn"
          - case: Jn-3-16-3
            grep: "Double-click isolated token — Jn 3:16 — 3"
          - case: Jn-3-16-16
            grep: "Double-click isolated token — Jn 3:16 — 16"
          - case: 1-Jn-3-16-Jn
            grep: "Double-click isolated token — 1 Jn 3:16 — Jn"
          - case: 1-Jn-3-16-16
            grep: "Double-click isolated token — 1 Jn 3:16 — 16"
          - case: 1-Thess-2-13-Thess
            grep: "Double-click isolated token — 1 Thess 2:13 — Thess"
          - case: 1-Thess-2-13-13
            grep: "Double-click isolated token — 1 Thess 2:13 — 13"
          - case: Roman-I-Samuel-I
            grep: "Double-click isolated token — I Samuel 17:11 — I"
          - case: Roman-I-Samuel-Samuel
            grep: "Double-click isolated token — I Samuel 17:11 — Samuel"
          - case: Roman-II-Samuel-II
            grep: "Double-click isolated token — II Samuel 7:1 — II"
          - case: Roman-II-Samuel-Samuel
            grep: "Double-click isolated token — II Samuel 7:1 — Samuel"
          - case: Roman-I-Kings-I
            grep: "Double-click isolated token — I Kings 18:21 — I"
          - case: Roman-I-Kings-Kings
            grep: "Double-click isolated token — I Kings 18:21 — Kings"
          - case: Roman-II-Kings-II
            grep: "Double-click isolated token — II Kings 2:2 — II"
          - case: Roman-II-Kings-Kings
            grep: "Double-click isolated token — II Kings 2:2 — Kings"
          - case: Roman-I-Chronicles-I
            grep: "Double-click isolated token — I Chronicles 4:10 — I"
          - case: Roman-I-Chronicles-Chronicles
            grep: "Double-click isolated token — I Chronicles 4:10 — Chronicles"
          - case: Roman-II-Chronicles-II
            grep: "Double-click isolated token — II Chronicles 7:14 — II"
          - case: Roman-II-Chronicles-Chronicles
            grep: "Double-click isolated token — II Chronicles 7:14 — Chronicles"
          - case: Roman-I-Corinthians-I
            grep: "Double-click isolated token — I Corinthians 13:4 — I"
          - case: Roman-I-Corinthians-Corinthians
            grep: "Double-click isolated token — I Corinthians 13:4 — Corinthians"
          - case: Roman-II-Corinthians-II
            grep: "Double-click isolated token — II Corinthians 5:17 — II"
          - case: Roman-II-Corinthians-Corinthians
            grep: "Double-click isolated token — II Corinthians 5:17 — Corinthians"
          - case: Roman-I-Thessalonians-I
            grep: "Double-click isolated token — I Thessalonians 2:13 — I"
          - case: Roman-I-Thessalonians-Thessalonians
            grep: "Double-click isolated token — I Thessalonians 2:13 — Thessalonians"
          - case: Roman-II-Thessalonians-II
            grep: "Double-click isolated token — II Thessalonians 2:13 — II"
          - case: Roman-II-Thessalonians-Thessalonians
            grep: "Double-click isolated token — II Thessalonians 2:13 — Thessalonians"
          - case: Roman-I-Timothy-I
            grep: "Double-click isolated token — I Timothy 6:15 — I"
          - case: Roman-I-Timothy-Timothy
            grep: "Double-click isolated token — I Timothy 6:15 — Timothy"
          - case: Roman-II-Timothy-II
            grep: "Double-click isolated token — II Timothy 2:15 — II"
          - case: Roman-II-Timothy-Timothy
            grep: "Double-click isolated token — II Timothy 2:15 — Timothy"
          - case: Roman-I-Peter-I
            grep: "Double-click isolated token — I Peter 2:9 — I"
          - case: Roman-I-Peter-Peter
            grep: "Double-click isolated token — I Peter 2:9 — Peter"
          - case: Roman-II-Peter-II
            grep: "Double-click isolated token — II Peter 3:9 — II"
          - case: Roman-II-Peter-Peter
            grep: "Double-click isolated token — II Peter 3:9 — Peter"
          - case: Roman-I-John-I
            grep: "Double-click isolated token — I John 4:8 — I"
          - case: Roman-I-John-John
            grep: "Double-click isolated token — I John 4:8 — John"
          - case: Roman-II-John-II
            grep: "Double-click isolated token — II John 1:9 — II"
          - case: Roman-II-John-John
            grep: "Double-click isolated token — II John 1:9 — John"
          - case: Roman-III-John-III
            grep: "Double-click isolated token — III John 1:4 — III"
          - case: Roman-III-John-John
            grep: "Double-click isolated token — III John 1:4 — John"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused test
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
        run: >-
          npx playwright test tests/browser/extension.spec.js
          --grep "${{ matrix.grep }}"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Performance qualification is required for performance PRs. Correctness-only
      # PRs still run the deterministic hard gate and full Browser E2E, but must not
      # be forced to prove an unrelated performance improvement.
      - name: Prepare approved 5.2.51.43 baseline
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')
        run: git worktree add "$RUNNER_TEMP/blb-baseline" "${{ github.event.pull_request.base.sha }}"

      - name: Benchmark approved baseline and PR candidate (interleaved)
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
          BLB_BASELINE_EXTENSION_PATH: ${{ runner.temp }}/blb-baseline/extension
          BLB_CANDIDATE_EXTENSION_PATH: ${{ github.workspace }}/extension
          BLB_BASELINE_OUTPUT: ${{ runner.temp }}/baseline-performance.jsonl
          BLB_CANDIDATE_OUTPUT: ${{ runner.temp }}/candidate-performance.jsonl
          BLB_PERF_SAMPLES: 7
        run: |
          : > "$BLB_BASELINE_OUTPUT"
          : > "$BLB_CANDIDATE_OUTPUT"
          for scenario in paragraph-classify paragraph-two-tab selection fresh reuse; do
            for iteration in 1 2 3 4 5 6 7; do
              BLB_EXTENSION_PATH="$BLB_BASELINE_EXTENSION_PATH" \
              BLB_PERF_OUTPUT="$BLB_BASELINE_OUTPUT" \
              BLB_PERF_SCENARIO="$scenario" \
              npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each=1

              BLB_EXTENSION_PATH="$BLB_CANDIDATE_EXTENSION_PATH" \
              BLB_PERF_OUTPUT="$BLB_CANDIDATE_OUTPUT" \
              BLB_PERF_SCENARIO="$scenario" \
              npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each=1
            done
          done
      - name: Require measured performance improvement
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')
        env:
          BLB_PERF_MIN_TARGETED_IMPROVEMENT: 0.03
          BLB_PERF_MAX_SELECTION_REGRESSION: 0.10
          BLB_PERF_MIN_PARAGRAPH_TWO_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_FIRST_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_SECOND_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MAX_FRESH_REGRESSION: 0.10
        run: set -o pipefail; node scripts/compare-performance.mjs "$RUNNER_TEMP/baseline-performance.jsonl" "$RUNNER_TEMP/candidate-performance.jsonl" | tee "$RUNNER_TEMP/performance-report.md"

      - name: Run full extension browser E2E
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
        run: npx playwright test tests/browser/extension.spec.js

      - name: Publish performance report
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')
        run: |
          if [ -f "$RUNNER_TEMP/performance-report.md" ]; then
            cat "$RUNNER_TEMP/performance-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright diagnostics and performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-browser-e2e-results
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/baseline-performance.jsonl
            ${{ runner.temp }}/candidate-performance.jsonl
            ${{ runner.temp }}/performance-report.md
          if-no-files-found: ignore
          retention-days: 14

# Performance gate compares a Performance PR with approved 5.2.51.43 commit 4442d131.
# Correctness-only PRs are gated by deterministic regression + full Browser E2E.