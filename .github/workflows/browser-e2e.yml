name: BLB Suite BROWSER E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run extension browser E2E
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-browser-e2e-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
