name: BLB Suite BROWSER E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare approved 5.2.51.43 baseline
        if: github.event_name == 'pull_request'
        run: git worktree add "$RUNNER_TEMP/blb-baseline" "${{ github.event.pull_request.base.sha }}"

      - name: Benchmark approved baseline and PR candidate (interleaved)
        if: github.event_name == 'pull_request'
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
          BLB_BASELINE_EXTENSION_PATH: ${{ runner.temp }}/blb-baseline/extension
          BLB_CANDIDATE_EXTENSION_PATH: ${{ github.workspace }}/extension
          BLB_BASELINE_OUTPUT: ${{ runner.temp }}/baseline-performance.jsonl
          BLB_CANDIDATE_OUTPUT: ${{ runner.temp }}/candidate-performance.jsonl
          BLB_PERF_SAMPLES: 7
        run: |
          : > "$BLB_BASELINE_OUTPUT"
          : > "$BLB_CANDIDATE_OUTPUT"
          for scenario in paragraph-classify paragraph-two-tab selection fresh reuse; do
            for iteration in 1 2 3 4 5 6 7; do
              BLB_EXTENSION_PATH="$BLB_BASELINE_EXTENSION_PATH" \
              BLB_PERF_OUTPUT="$BLB_BASELINE_OUTPUT" \
              BLB_PERF_SCENARIO="$scenario" \
              npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each=1

              BLB_EXTENSION_PATH="$BLB_CANDIDATE_EXTENSION_PATH" \
              BLB_PERF_OUTPUT="$BLB_CANDIDATE_OUTPUT" \
              BLB_PERF_SCENARIO="$scenario" \
              npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each=1
            done
          done
      - name: Require measured performance improvement
        if: github.event_name == 'pull_request'
        env:
          BLB_PERF_MIN_TARGETED_IMPROVEMENT: 0.03
          BLB_PERF_MIN_PARAGRAPH_TWO_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_FIRST_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_SECOND_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MAX_FRESH_REGRESSION: 0.10
        run: set -o pipefail; node scripts/compare-performance.mjs "$RUNNER_TEMP/baseline-performance.jsonl" "$RUNNER_TEMP/candidate-performance.jsonl" | tee "$RUNNER_TEMP/performance-report.md"

      - name: Run extension browser E2E
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
        run: npx playwright test tests/browser/extension.spec.js

      - name: Publish performance report
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/performance-report.md" ]; then
            cat "$RUNNER_TEMP/performance-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright diagnostics and performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-browser-e2e-results
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/baseline-performance.jsonl
            ${{ runner.temp }}/candidate-performance.jsonl
            ${{ runner.temp }}/performance-report.md
          if-no-files-found: ignore
          retention-days: 14

