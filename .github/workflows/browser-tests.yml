name: BLB Suite HARD-GATE
run-name: HARD-GATE — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'regression-suite/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') }}
    name: Select requested CI suite
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      behavioral_validation_required: ${{ steps.classify.outputs.behavioral_validation_required }}
      package_validation_required: ${{ steps.classify.outputs.package_validation_required }}
    steps:
      - name: Checkout for change classification
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            echo "behavioral_validation_required=true" >> "$GITHUB_OUTPUT"
            echo "package_validation_required=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi

  regression-package:
    name: Regression — package
    needs: change-detection
    if: ${{ needs.change-detection.outputs.package_validation_required == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Classify repository-wide AST audit scope
        id: audit-scope
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/classify-ast-audit-scope.mjs "$BASE_SHA"
      - name: Select all repository-wide AST audits for manual full run
        id: audit-scope-manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          for name in symbol repository owner cross_module runtime unified computed executable_source metaprogramming; do
            echo "run_$name=true" >> "$GITHUB_OUTPUT"
          done
          echo "run_any=true" >> "$GITHUB_OUTPUT"
      - name: Install pinned AST audit dependencies
        if: ${{ steps.audit-scope.outputs.run_any == 'true' || steps.audit-scope-manual.outputs.run_any == 'true' }}
        run: npm install --no-save --package-lock=false --ignore-scripts acorn@8.15.0 eslint-scope@8.4.0
      - name: Test reusable CI section checkpoint helper
        run: node --test scripts/ci-section-checkpoint.test.mjs
      - name: Test AST audit scope selector
        run: node --test scripts/classify-ast-audit-scope.test.mjs
      - name: Test test-file inventory filename classification
        run: node --test scripts/test-file-inventory-helpers.test.mjs
      - name: Verify repository-wide test inventory and production-module coverage
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: test-inventory
          cache_prefix: blb-ci-v1-hard-gate-test-inventory-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/test-suite-inventory.mjs
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — package
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: package-regression
          # Reuse a passed package checkpoint across audit-only commits. The
          # package runner consumes extension + regression-suite inputs, not AST
          # audit scripts or CI workflow sources; those are validated separately.
          cache_prefix: blb-ci-v1-hard-gate-package-regression-${{ hashFiles('extension/**', 'regression-suite/**', 'package.json', 'package-lock.json') }}
          fingerprint: ${{ hashFiles('extension/**', 'regression-suite/**', 'package.json', 'package-lock.json') }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=package
      - name: Verify KJV corpus and search-index integrity
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: kjv-corpus-integrity
          cache_prefix: blb-ci-v1-hard-gate-kjv-corpus-integrity-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node regression-suite/tests/kjv-corpus-integrity.mjs extension
      - name: Test and run conservative AST symbol audit
        if: ${{ steps.audit-scope.outputs.run_symbol == 'true' || steps.audit-scope-manual.outputs.run_symbol == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-symbol-audit
          cache_prefix: blb-ci-v1-hard-gate-ast-symbol-audit-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-symbol-reference-audit.test.js
            node scripts/ast-symbol-reference-audit.js
      - name: Test and run context-aware repository reachability audit
        if: ${{ steps.audit-scope.outputs.run_repository == 'true' || steps.audit-scope-manual.outputs.run_repository == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-repository-reachability
          cache_prefix: blb-ci-v1-hard-gate-ast-repository-reachability-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-repository-reachability-audit.test.js
            node scripts/ast-repository-reachability-audit.js
      - name: Test and run owner-aware AST and Node module reachability audit
        if: ${{ steps.audit-scope.outputs.run_owner == 'true' || steps.audit-scope-manual.outputs.run_owner == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-owner-aware-node
          cache_prefix: blb-ci-v1-hard-gate-ast-owner-aware-node-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-owner-aware-node-reachability-audit.test.js
            node scripts/ast-owner-aware-node-reachability-audit.js
      - name: Test and run cross-module and dynamic execution reachability audit
        if: ${{ steps.audit-scope.outputs.run_cross_module == 'true' || steps.audit-scope-manual.outputs.run_cross_module == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-cross-module-dynamic
          cache_prefix: blb-ci-v1-hard-gate-ast-cross-module-dynamic-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-cross-module-dynamic-reachability-audit.test.js
            node scripts/ast-cross-module-dynamic-reachability-audit.js
      - name: Test and run conservative runtime-flow reachability audit
        if: ${{ steps.audit-scope.outputs.run_runtime == 'true' || steps.audit-scope-manual.outputs.run_runtime == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-runtime-flow
          cache_prefix: blb-ci-v1-hard-gate-ast-runtime-flow-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-runtime-flow-reachability-audit.test.js
            node scripts/ast-runtime-flow-reachability-audit.js
      - name: Test and run unified dynamic/runtime reachability audit
        if: ${{ steps.audit-scope.outputs.run_unified == 'true' || steps.audit-scope-manual.outputs.run_unified == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-unified-dynamic-runtime
          cache_prefix: blb-ci-v1-hard-gate-ast-unified-dynamic-runtime-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-unified-dynamic-runtime-reachability-audit.test.js
            node scripts/ast-unified-dynamic-runtime-reachability-audit.js
      - name: Test and run computed-property candidate audit
        if: ${{ steps.audit-scope.outputs.run_computed == 'true' || steps.audit-scope-manual.outputs.run_computed == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-computed-property
          cache_prefix: blb-ci-v1-hard-gate-ast-computed-property-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-computed-property-reachability-audit.test.js
            node scripts/ast-computed-property-reachability-audit.js
      - name: Test and run executable-source coverage audit
        if: ${{ steps.audit-scope.outputs.run_executable_source == 'true' || steps.audit-scope-manual.outputs.run_executable_source == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-executable-source-coverage
          cache_prefix: blb-ci-v1-hard-gate-ast-executable-source-coverage-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-executable-source-coverage-audit.test.js
            node scripts/ast-executable-source-coverage-audit.js
      - name: Test and run runtime-metaprogramming uncertainty audit
        if: ${{ steps.audit-scope.outputs.run_metaprogramming == 'true' || steps.audit-scope-manual.outputs.run_metaprogramming == 'true' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ast-runtime-metaprogramming-uncertainty
          cache_prefix: blb-ci-v1-hard-gate-ast-runtime-metaprogramming-uncertainty-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            node --test scripts/ast-runtime-metaprogramming-uncertainty-audit.test.js
            node scripts/ast-runtime-metaprogramming-uncertainty-audit.js
      - name: Validate extension build and module contracts
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: build-validation
          cache_prefix: blb-ci-v1-hard-gate-build-validation-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/validate-build.js
      - name: Run browser selector decision tests
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: selector-tests
          cache_prefix: blb-ci-v1-hard-gate-selector-tests-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node --test tests/selector/*.test.mjs
      - name: Run CI browser-routing inventory contract
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: ci-routing
          cache_prefix: blb-ci-v1-hard-gate-ci-routing-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/test-ci-routing-selector.js
  regression-behavioral:
    name: Regression — ${{ matrix.group }}
    needs: change-detection
    # Run deterministic behavioral groups for runtime changes and edits to the
    # regression-suite tests/runner. Package-only and CI/test-tooling changes keep
    # unrelated behavioral groups skipped without bypassing package validation.
    if: ${{ needs.change-detection.result == 'success' && (needs.change-detection.outputs.behavioral_validation_required == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - resolver
          - selection
          - features
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — ${{ matrix.group }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          recovery: false
          section: behavioral-${{ matrix.group }}
          cache_prefix: blb-ci-v1-hard-gate-behavioral-${{ matrix.group }}-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'regression-suite/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-tests.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group='${{ matrix.group }}'
  regression-gate-summary:
    name: regression-gate
    needs:
      - change-detection
      - regression-package
      - regression-behavioral
    if: ${{ always() && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit')) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish regression-gate commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_STATE: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.package_validation_required == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.behavioral_validation_required == 'false')) && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.package_validation_required == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.behavioral_validation_required == 'false')) && 'success' || 'failure' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$STATUS_DESCRIPTION\",\"context\":\"regression-gate\"}"

      - name: Require all regression groups to pass
        shell: bash
        run: |
          if [ "${{ needs.change-detection.result }}" != "success" ] || ( [ "${{ needs.regression-package.result }}" != "success" ] && ! ( [ "${{ needs.regression-package.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.package_validation_required }}" = "false" ] ) ) || [ "${{ needs.regression-behavioral.result }}" = "failure" ] || ( [ "${{ needs.regression-behavioral.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.behavioral_validation_required }}" != "false" ] ) || [ "${{ needs.regression-behavioral.result }}" = "cancelled" ]; then
            echo "Package: ${{ needs.regression-package.result }}"
            echo "Behavioral: ${{ needs.regression-behavioral.result }}"
            exit 1
          fi
          echo "All applicable regression groups passed."
