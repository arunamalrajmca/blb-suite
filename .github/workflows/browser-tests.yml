name: BLB Suite HARD-GATE
run-name: HARD-GATE — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  change-detection:
    name: Select requested CI suite
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.select.outputs.runtime_changed }}
    steps:
      - name: Read explicit CI selection
        id: select
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || jq -e 'any(.[]; .name == "ci-run-all" or .name == "ci-run-hard-gate")' <<< "$LABELS" >/dev/null; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_changed=false" >> "$GITHUB_OUTPUT"
          fi

  regression-package:
    name: Regression — package
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate') }}
    needs: change-detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — package
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=package
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish

  regression-behavioral:
    name: Regression — ${{ matrix.group }}
    needs: change-detection
    # The hard gate always runs behavioral groups on PRs/main. Runtime-change
    # detection remains useful to other workflows, but a hard gate must never
    # report green while behavioral coverage was silently skipped.
    if: ${{ needs.change-detection.result == 'success' && (needs.change-detection.outputs.runtime_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - resolver
          - selection
          - features
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — ${{ matrix.group }}
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=${{ matrix.group }}
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish

  regression-gate-summary:
    name: regression-gate
    needs:
      - change-detection
      - regression-package
      - regression-behavioral
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Publish regression-gate commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_STATE: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.runtime_changed == 'false')) && 'success' || 'failure' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$STATUS_DESCRIPTION\",\"context\":\"regression-gate\"}"

      - name: Require all regression groups to pass
        shell: bash
        run: |
          if [ "${{ needs.change-detection.result }}" != "success" ] || ( [ "${{ needs.regression-package.result }}" != "success" ] && ! ( [ "${{ needs.regression-package.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.runtime_changed }}" = "false" ] ) ) || [ "${{ needs.regression-behavioral.result }}" = "failure" ] || ( [ "${{ needs.regression-behavioral.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.runtime_changed }}" != "false" ] ) || [ "${{ needs.regression-behavioral.result }}" = "cancelled" ]; then
            echo "Package: ${{ needs.regression-package.result }}"
            echo "Behavioral: ${{ needs.regression-behavioral.result }}"
            exit 1
          fi
          echo "All applicable regression groups passed."

      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish