name: BLB Suite HARD-GATE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read manifest version
        id: version
        run: echo "version=$(node -p \"require('./extension/manifest.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Run deterministic regression gate
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension
