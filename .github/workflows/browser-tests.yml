name: BLB Suite HARD-GATE
run-name: HARD-GATE — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'regression-suite/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') }}
    name: Select requested CI suite
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      behavioral_validation_required: ${{ steps.classify.outputs.behavioral_validation_required }}
      package_validation_required: ${{ steps.classify.outputs.package_validation_required }}
      package_regression_required: ${{ steps.classify.outputs.package_regression_required }}
    steps:
      - name: Checkout for change classification
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            echo "behavioral_validation_required=true" >> "$GITHUB_OUTPUT"
            echo "package_validation_required=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi

  repository-ast-audits:
    name: Repository AST audits
    needs: change-detection
    if: ${{ needs.change-detection.result == 'success' && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Classify repository-wide AST audit scope
        id: audit-scope
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/classify-ast-audit-scope.mjs "$BASE_SHA"
      - name: Select all repository-wide AST audits for manual full run
        id: audit-scope-manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          for name in symbol repository owner cross_module runtime unified computed executable_source metaprogramming; do
            echo "run_$name=true" >> "$GITHUB_OUTPUT"
          done
          echo "run_any=true" >> "$GITHUB_OUTPUT"
      - name: Install pinned AST audit dependencies
        if: ${{ steps.audit-scope.outputs.run_any == 'true' || steps.audit-scope-manual.outputs.run_any == 'true' }}
        run: npm install --no-save --package-lock=false --ignore-scripts acorn@8.15.0 eslint-scope@8.4.0
      - name: Test AST audit scope selector
        run: node --test scripts/classify-ast-audit-scope.test.mjs
      - name: Run selected repository-wide AST audits concurrently
        if: ${{ steps.audit-scope.outputs.run_any == 'true' || steps.audit-scope-manual.outputs.run_any == 'true' }}
        env:
          RUN_SYMBOL: ${{ steps.audit-scope.outputs.run_symbol || steps.audit-scope-manual.outputs.run_symbol }}
          RUN_REPOSITORY: ${{ steps.audit-scope.outputs.run_repository || steps.audit-scope-manual.outputs.run_repository }}
          RUN_OWNER: ${{ steps.audit-scope.outputs.run_owner || steps.audit-scope-manual.outputs.run_owner }}
          RUN_CROSS_MODULE: ${{ steps.audit-scope.outputs.run_cross_module || steps.audit-scope-manual.outputs.run_cross_module }}
          RUN_RUNTIME: ${{ steps.audit-scope.outputs.run_runtime || steps.audit-scope-manual.outputs.run_runtime }}
          RUN_UNIFIED: ${{ steps.audit-scope.outputs.run_unified || steps.audit-scope-manual.outputs.run_unified }}
          RUN_COMPUTED: ${{ steps.audit-scope.outputs.run_computed || steps.audit-scope-manual.outputs.run_computed }}
          RUN_EXECUTABLE_SOURCE: ${{ steps.audit-scope.outputs.run_executable_source || steps.audit-scope-manual.outputs.run_executable_source }}
          RUN_METAPROGRAMMING: ${{ steps.audit-scope.outputs.run_metaprogramming || steps.audit-scope-manual.outputs.run_metaprogramming }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$(mktemp -d)"
          active=0
          failed=0

          start_audit() {
            local name="$1" test_file="$2" audit_file="$3"
            local log_file="$log_dir/$name.log"
            (
              set -euo pipefail
              {
                echo "regression tests"
                node --test "$test_file"
                echo "repository audit"
                node "$audit_file"
              } 2>&1 | tee "$log_file" | sed -u "s/^/[$name] /"
            ) &
            active=$((active + 1))
            if (( active >= 4 )); then
              reap_one
            fi
          }

          reap_one() {
            if wait -n; then
              :
            else
              failed=1
            fi
            active=$((active - 1))
          }

          [[ "$RUN_SYMBOL" != "true" ]] || start_audit symbol scripts/ast-symbol-reference-audit.test.js scripts/ast-symbol-reference-audit.js
          [[ "$RUN_REPOSITORY" != "true" ]] || start_audit repository scripts/ast-repository-reachability-audit.test.js scripts/ast-repository-reachability-audit.js
          [[ "$RUN_OWNER" != "true" ]] || start_audit owner scripts/ast-owner-aware-node-reachability-audit.test.js scripts/ast-owner-aware-node-reachability-audit.js
          [[ "$RUN_CROSS_MODULE" != "true" ]] || start_audit cross-module scripts/ast-cross-module-dynamic-reachability-audit.test.js scripts/ast-cross-module-dynamic-reachability-audit.js
          [[ "$RUN_RUNTIME" != "true" ]] || start_audit runtime scripts/ast-runtime-flow-reachability-audit.test.js scripts/ast-runtime-flow-reachability-audit.js
          [[ "$RUN_UNIFIED" != "true" ]] || start_audit unified scripts/ast-unified-dynamic-runtime-reachability-audit.test.js scripts/ast-unified-dynamic-runtime-reachability-audit.js
          [[ "$RUN_COMPUTED" != "true" ]] || start_audit computed scripts/ast-computed-property-reachability-audit.test.js scripts/ast-computed-property-reachability-audit.js
          [[ "$RUN_EXECUTABLE_SOURCE" != "true" ]] || start_audit executable-source scripts/ast-executable-source-coverage-audit.test.js scripts/ast-executable-source-coverage-audit.js
          [[ "$RUN_METAPROGRAMMING" != "true" ]] || start_audit metaprogramming scripts/ast-runtime-metaprogramming-uncertainty-audit.test.js scripts/ast-runtime-metaprogramming-uncertainty-audit.js

          while (( active > 0 )); do
            reap_one
          done

          if (( failed != 0 )); then
            echo "One or more selected AST audits failed."
            exit 1
          fi
          echo "All selected AST audits passed."

  regression-package:
    name: Package validation
    needs: change-detection
    if: ${{ needs.change-detection.outputs.package_validation_required == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test reusable CI section checkpoint helper
        run: node --test scripts/ci-section-checkpoint.test.mjs
      - name: Test test-file inventory filename classification
        run: node --test scripts/test-file-inventory-helpers.test.mjs
      - name: Verify repository-wide test inventory and production-module coverage
        run: node scripts/test-suite-inventory.mjs
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — package
        if: ${{ needs.change-detection.outputs.package_regression_required == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate') }}
        run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=package
      - name: Verify KJV corpus and search-index integrity
        run: node regression-suite/tests/kjv-corpus-integrity.mjs extension
      - name: Validate extension build and module contracts
        run: node scripts/validate-build.js
      - name: Run browser selector decision tests
        run: node --test tests/selector/*.test.mjs
      - name: Run CI browser-routing inventory contract
        run: node scripts/test-ci-routing-selector.js
  regression-behavioral:
    name: Regression — ${{ matrix.group }}
    needs: change-detection
    # Run deterministic behavioral groups for runtime changes and edits to the
    # regression-suite tests/runner. Package-only and CI/test-tooling changes keep
    # unrelated behavioral groups skipped without bypassing package validation.
    if: ${{ needs.change-detection.result == 'success' && (needs.change-detection.outputs.behavioral_validation_required == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-hard-gate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - resolver
          - selection
          - features
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run deterministic regression gate — ${{ matrix.group }}
        run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group='${{ matrix.group }}'
  regression-gate-summary:
    name: regression-gate
    needs:
      - change-detection
      - regression-package
      - regression-behavioral
      - repository-ast-audits
    if: ${{ always() && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit')) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish regression-gate commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_STATE: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.package_validation_required == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.behavioral_validation_required == 'false')) && needs.repository-ast-audits.result == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.change-detection.result == 'success' && (needs.regression-package.result == 'success' || (needs.regression-package.result == 'skipped' && needs.change-detection.outputs.package_validation_required == 'false')) && (needs.regression-behavioral.result == 'success' || (needs.regression-behavioral.result == 'skipped' && needs.change-detection.outputs.behavioral_validation_required == 'false')) && needs.repository-ast-audits.result == 'success' && 'success' || 'failure' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$STATUS_DESCRIPTION\",\"context\":\"regression-gate\"}"

      - name: Require all regression groups to pass
        shell: bash
        run: |
          if [ "${{ needs.change-detection.result }}" != "success" ] || ( [ "${{ needs.regression-package.result }}" != "success" ] && ! ( [ "${{ needs.regression-package.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.package_validation_required }}" = "false" ] ) ) || [ "${{ needs.regression-behavioral.result }}" = "failure" ] || ( [ "${{ needs.regression-behavioral.result }}" = "skipped" ] && [ "${{ needs.change-detection.outputs.behavioral_validation_required }}" != "false" ] ) || [ "${{ needs.regression-behavioral.result }}" = "cancelled" ] || [ "${{ needs.repository-ast-audits.result }}" != "success" ]; then
            echo "Package: ${{ needs.regression-package.result }}"
            echo "Behavioral: ${{ needs.regression-behavioral.result }}"
            exit 1
          fi
          echo "All applicable regression groups passed."
