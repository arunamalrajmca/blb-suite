name: BLB Suite 5.2.51.43 HARD-GATE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run 5.2.51.43 deterministic regression gate
        env:
          BLB_EXPECTED_VERSION: 5.2.51.43
        run: node regression-suite/tests/run-regression.mjs extension
