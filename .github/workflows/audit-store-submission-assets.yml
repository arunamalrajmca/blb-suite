name: Audit Chrome Web Store submission assets

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/chrome-web-store-assets/**'
      - 'scripts/verify-store-submission-assets.py'
      - 'tests/test_verify_store_submission_assets.py'
  push:
    branches:
      - main
      - 'docs/chrome-store-candidate-*'
    paths:
      - 'docs/chrome-web-store-assets/**'
      - 'scripts/verify-store-submission-assets.py'
      - 'tests/test_verify_store_submission_assets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-submission-asset-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Run asset verifier regression tests
        run: python -m unittest discover -s tests -p 'test_verify_store_submission_assets.py' -v
      - name: Resolve latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            --output /tmp/latest-release.json

          TAG_NAME="$(jq -er '.tag_name' /tmp/latest-release.json)"
          VERSION="${TAG_NAME#v}"
          ZIP_ASSET="$(jq -er '[.assets[] | select(.name | test("^Blue-Letter-Bible-Suite-.*\\.zip$"))] | first' /tmp/latest-release.json)"
          ZIP_NAME="$(jq -er '.name' <<< "$ZIP_ASSET")"
          ZIP_URL="$(jq -er '.browser_download_url' <<< "$ZIP_ASSET")"
          DIGEST="$(jq -er '.digest // empty' <<< "$ZIP_ASSET")"

          if [[ -z "$VERSION" || "$VERSION" == "$TAG_NAME" ]]; then
            echo "Latest release tag must start with v: $TAG_NAME" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Latest release ZIP does not publish a SHA-256 digest." >&2
            exit 1
          fi

          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_SHA256=${DIGEST#sha256:}" >> "$GITHUB_ENV"
          echo "Resolved latest published release: $TAG_NAME ($ZIP_NAME)"
      - name: Download latest published release ZIP
        run: |
          curl --fail --location --retry 3 \
            --output "/tmp/$RELEASE_ZIP_NAME" \
            "$RELEASE_ZIP_URL"
      - name: Verify published release ZIP checksum
        run: |
          echo "$RELEASE_ZIP_SHA256  /tmp/$RELEASE_ZIP_NAME" | sha256sum --check -
      - name: Run strict listing asset and release package audit
        run: |
          python scripts/verify-store-submission-assets.py \
            --asset-dir docs/chrome-web-store-assets \
            --release-zip "/tmp/$RELEASE_ZIP_NAME" \
            --release-version "$RELEASE_VERSION"
