name: Audit Chrome Web Store submission assets

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/chrome-web-store-assets/**'
      - 'scripts/verify-store-submission-assets.py'
      - 'tests/test_verify_store_submission_assets.py'
      - '.github/workflows/audit-store-submission-assets.yml'
  push:
    branches:
      - chore/chrome-web-store-screenshots-v5.2.51.100
    paths:
      - 'docs/chrome-web-store-assets/**'
      - 'scripts/verify-store-submission-assets.py'
      - 'tests/test_verify_store_submission_assets.py'
      - '.github/workflows/audit-store-submission-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-submission-asset-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Run asset verifier regression tests
        run: python -m unittest discover -s tests -p 'test_verify_store_submission_assets.py' -v
      - name: Download exact v5.2.51.100 release ZIP
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/Blue-Letter-Bible-Suite-5.2.51.100.zip \
            https://github.com/arunamalrajmca/blb-suite/releases/download/v5.2.51.100/Blue-Letter-Bible-Suite-5.2.51.100.zip
      - name: Verify published release ZIP checksum
        run: |
          echo 'f13e50f74f23189cd63c78a0bd113e4512be57250ab685731c57641c4c013f01  /tmp/Blue-Letter-Bible-Suite-5.2.51.100.zip' | sha256sum --check -
      - name: Run strict listing asset and release package audit
        run: |
          python scripts/verify-store-submission-assets.py \
            --asset-dir docs/chrome-web-store-assets \
            --release-zip /tmp/Blue-Letter-Bible-Suite-5.2.51.100.zip \
            --release-version 5.2.51.100
