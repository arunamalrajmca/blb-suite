name: Reference action and cleanup profiling

on:
  push:
    branches: [audit/reference-action-cleanup-profiling]
    paths:
      - '.github/workflows/reference-action-cleanup-profile.yml'
      - 'tests/browser/extension.spec.js'

permissions:
  contents: read

concurrency:
  group: reference-action-cleanup-profile
  cancel-in-progress: true

jobs:
  profile:
    name: Profile reference action handoff and tab cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLB_PROFILE_BROWSER_FIXTURES: '1'
      BLB_REFERENCE_POLL_INTERVALS: '20,40,80,160'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the complete 528-case reference matrix
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/reference-profile/reference-test-results.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference-profile"
          START_MS="$(node -p 'Date.now()')"
          npx playwright test tests/browser/extension.spec.js \
            --grep 'all 66 canonical book suffixes' \
            --workers=1 --reporter=line,json 2>&1 | tee "$RUNNER_TEMP/reference-profile/profile.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Profile process wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/reference-profile/profile.log"
          node <<'NODE' | tee -a "$RUNNER_TEMP/reference-profile/profile.log"
          const fs = require('fs');
          const reportPath = process.env.PLAYWRIGHT_JSON_OUTPUT_NAME;
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const tests = [];
          function visit(suite, ancestry = []) {
            const next = suite.title ? [...ancestry, suite.title] : ancestry;
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                for (const result of test.results || []) {
                  tests.push({ title: [...next, spec.title].filter(Boolean).join(' › '), status: result.status, durationMs: result.duration });
                }
              }
            }
            for (const child of suite.suites || []) visit(child, next);
          }
          for (const suite of report.suites || []) visit(suite);
          tests.sort((a, b) => b.durationMs - a.durationMs);
          console.log('REFERENCE_TEST_DURATION_SUMMARY');
          tests.forEach((item, index) => console.log(
            '[' + (index + 1) + '/' + tests.length + '] ' + item.durationMs + 'ms ' + item.status + ' — ' + item.title
          ));
          const phases = new Map();
          for (const line of fs.readFileSync(process.env.RUNNER_TEMP + '/reference-profile/profile.log', 'utf8').split(/\\r?\\n/)) {
            const match = line.match(/BLB_MATRIX_PROFILE (\\{.*\\})/);
            if (!match) continue;
            try {
              const entry = JSON.parse(match[1]);
              if (!Number.isFinite(entry.durationMs)) continue;
              const key = entry.phase || 'unknown';
              const values = phases.get(key) || [];
              values.push(entry.durationMs);
              phases.set(key, values);
            } catch (_) {}
          }
          console.log('REFERENCE_ACTION_CLEANUP_PHASE_SUMMARY');
          for (const [phase, values] of [...phases].sort((a, b) => b[1].reduce((x,y)=>x+y,0) - a[1].reduce((x,y)=>x+y,0))) {
            const sorted = [...values].sort((a,b)=>a-b);
            const sum = values.reduce((a,b)=>a+b,0);
            console.log(phase + ': count=' + values.length + ' total=' + Math.round(sum) + 'ms median=' + Math.round(sorted[Math.floor(sorted.length/2)]) + 'ms p95=' + Math.round(sorted[Math.min(sorted.length-1, Math.ceil(sorted.length*.95)-1)]) + 'ms');
          }
          NODE
      - name: Upload action and cleanup profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reference-action-cleanup-profile
          path: |
            ${{ runner.temp }}/reference-profile/profile.log
            ${{ runner.temp }}/reference-profile/reference-test-results.json
          if-no-files-found: warn
          retention-days: 14
