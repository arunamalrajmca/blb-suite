name: BLB Suite BROWSER E2E — FEATURES
run-name: Features — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-e2e:
    name: BROWSER E2E — FEATURES
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'MV3 service worker|popup loads|Show on BLB'
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-features
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e-core-actions:
    name: BROWSER E2E — CORE USER ACTIONS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Run Browser E2E — core user actions
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'Alt\+B command path opens an exact selected Bible reference'
      - name: Upload Playwright diagnostics — core user actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-browser-e2e-core-actions
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e-summary:
    name: browser-e2e
    needs:
      - browser-e2e
      - browser-e2e-core-actions
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all browser E2E feature suites to pass
        shell: bash
        run: |
          if [ "${{ needs.browser-e2e.result }}" != "success" ] || [ "${{ needs.browser-e2e-core-actions.result }}" != "success" ]; then
            echo "Features: ${{ needs.browser-e2e.result }}"
            echo "Core actions: ${{ needs.browser-e2e-core-actions.result }}"
            exit 1
          fi
          echo "All browser E2E feature suites passed."
