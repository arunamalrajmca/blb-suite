name: Browser fixture and reference polling profile

on:
  push:
    branches: [audit/exhaustive-reference-grammar-paired-profile]
    paths:
      - '.github/workflows/browser-fixture-profile.yml'
      - 'tests/browser/fixtures.js'
      - 'tests/browser/extension.spec.js'

permissions:
  contents: read

concurrency:
  group: browser-fixture-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile browser fixture and reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLB_PROFILE_BROWSER_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run paired 100ms baseline and 20ms candidate profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-profile"
          TEST_GREP='Double-click generic reference grammar — exhaustive token coverage'

          START_MS="$(node -p 'Date.now()')"
          BLB_GRAMMAR_POLL_INTERVAL_MS=100 npx playwright test tests/browser/extension.spec.js \
            --grep "$TEST_GREP" --workers=1 --repeat-each=5 --reporter=line 2>&1 | tee "$RUNNER_TEMP/browser-profile/baseline-100ms.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Baseline 100ms wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/browser-profile/baseline-100ms.log"

          START_MS="$(node -p 'Date.now()')"
          BLB_GRAMMAR_POLL_INTERVAL_MS=20 npx playwright test tests/browser/extension.spec.js \
            --grep "$TEST_GREP" --workers=1 --repeat-each=5 --reporter=line 2>&1 | tee "$RUNNER_TEMP/browser-profile/candidate-20ms.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Candidate 20ms wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/browser-profile/candidate-20ms.log"
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exhaustive-reference-grammar-paired-profile
          path: ${{ runner.temp }}/browser-profile/
          if-no-files-found: warn
          retention-days: 14
