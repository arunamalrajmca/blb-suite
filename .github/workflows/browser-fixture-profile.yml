name: Browser fixture and reference polling profile

on:
  push:
    branches: [audit/single-token-action-profile-repeatable]
    paths:
      - '.github/workflows/browser-fixture-profile.yml'
      - 'tests/browser/fixtures.js'
      - 'tests/browser/extension.spec.js'
      - 'tests/browser/e2e-core-user-actions.spec.js'

permissions:
  contents: read

concurrency:
  group: browser-fixture-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile single-token selection action waits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLB_PROFILE_BROWSER_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Repeat single-token action matrix three times
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/browser-profile"
          START_MS="$(node -p 'Date.now()')"
          npx playwright test tests/browser/e2e-core-user-actions.spec.js \
            --grep 'single-token selection actions share positional resolution across books and separators' \
            --workers=1 --repeat-each=3 --reporter=line 2>&1 | tee "$RUNNER_TEMP/browser-profile/profile.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Profile process wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/browser-profile/profile.log"
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: single-token-action-wait-profile
          path: ${{ runner.temp }}/browser-profile/profile.log
          if-no-files-found: warn
          retention-days: 14
