name: Temporary validated main build

on:
  push:
    branches:
      - build/main-2c56467

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension
        run: |
          mkdir -p dist
          bash scripts/package-release.sh "$(node -p "require('./extension/manifest.json').version")" dist
          unzip -t dist/Blue-Letter-Bible-Suite-*.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-main-build-2c56467
          path: |
            dist/Blue-Letter-Bible-Suite-*.zip
            dist/Blue-Letter-Bible-Suite-*.zip.sha256
