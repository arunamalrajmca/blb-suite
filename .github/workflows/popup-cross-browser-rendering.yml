name: Popup Chrome-Brave Rendering

on:
  pull_request:
    paths:
      - 'extension/popup.html'
      - 'scripts/test-popup-cross-browser-rendering.js'
      - '.github/workflows/popup-cross-browser-rendering.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: popup-cross-browser-rendering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare-popup-rendering:
    name: Compare Chrome and Brave popup rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Google Chrome and Brave
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y curl
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Compare computed popup styles
        run: node scripts/test-popup-cross-browser-rendering.js

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-chrome-brave-rendering
          path: popup-*.png
          if-no-files-found: ignore
