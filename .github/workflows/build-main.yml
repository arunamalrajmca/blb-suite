name: Build Main

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⏱ Workflow ETA — start
        uses: ./.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout Main
        uses: actions/checkout@v4
      - name: Build Main ZIP
        run: |
          mkdir -p dist
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ZIP="dist/Blue-Letter-Bible-Suite-main-${VERSION}.zip"
          cd extension
          zip -r "../$ZIP" .
          cd ..
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
      - name: Upload Main ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blb-main-build
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: ./.github/actions/workflow-eta
        with:
          phase: finish