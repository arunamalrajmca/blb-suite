name: Generate Chrome Web Store screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - chore/chrome-web-store-screenshots
    paths:
      - '.github/workflows/generate-store-screenshots.yml'
      - 'extension/Tutorial.html'
      - 'extension/Tutorial.js'
      - 'extension/Tutorial.pdf'
      - 'extension/popup.html'

permissions:
  contents: write

concurrency:
  group: chrome-web-store-screenshots
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v4
        with:
          ref: chore/chrome-web-store-screenshots
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python and Chromium
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render focused, source-based listing screenshots
        run: |
          mkdir -p docs/chrome-web-store-assets
          cat > /tmp/render_store_screenshots.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from playwright.sync_api import sync_playwright

          root = Path.cwd()
          out = root / "docs/chrome-web-store-assets"
          W, H = 1280, 800
          bg, navy, blue, muted, white = "#f3f6fa", "#153a5b", "#246da5", "#536579", "#ffffff"
          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def font(size, is_bold=False):
              return ImageFont.truetype(bold if is_bold else regular, size)
          def base(kicker, headline, subtitle):
              im = Image.new("RGB", (W, H), bg)
              d = ImageDraw.Draw(im)
              d.rounded_rectangle((48, 42, 1232, 758), radius=28, fill=white, outline="#d8e2ec", width=2)
              d.text((92, 82), kicker.upper(), font=font(18, True), fill=blue)
              d.text((92, 126), headline, font=font(38, True), fill=navy)
              d.text((94, 184), subtitle, font=font(19), fill=muted)
              return im
          def browser_frame(im, label):
              d = ImageDraw.Draw(im)
              d.rounded_rectangle((92, 244, 1188, 704), radius=18, fill="#20252b")
              d.rounded_rectangle((92, 244, 1188, 292), radius=18, fill="#e8edf2")
              d.rectangle((92, 270, 1188, 292), fill="#e8edf2")
              for x, c in [(116, "#e06c63"), (140, "#e8bd4a"), (164, "#57ad78")]:
                  d.ellipse((x, 260, x+12, 272), fill=c)
              d.rounded_rectangle((208, 253, 1090, 283), radius=12, fill="#ffffff")
              d.text((226, 258), label, font=font(14), fill="#34495e")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1000, "height": 1400}, device_scale_factor=1)
              page.goto((root / "extension/popup.html").resolve().as_uri(), wait_until="networkidle")
              page.screenshot(path="/tmp/popup.png", full_page=True)
              browser.close()
          popup = Image.open("/tmp/popup.png").convert("RGB")
          # Keep the real popup UI; enlarge it proportionally so controls remain legible.
          popup.thumbnail((680, 650))
          im = base("KJV Scripture Tools", "Study tools, right in your browser", "Quick access to Bible study controls, topics, and notes.")
          d = ImageDraw.Draw(im)
          x, y = 300, 244
          scale = min(680 / popup.width, 650 / popup.height)
          popup = popup.resize((int(popup.width*scale), int(popup.height*scale)), Image.Resampling.LANCZOS)
          im.paste(popup, (x, y))
          im.save(out / "extension-popup.png", optimize=True)

          # Create focused guide-derived screens: real tutorial content in Chromium,
          # framed consistently and focused on one task rather than the table of contents.
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1080, "height": 640}, device_scale_factor=1)
              page.goto((root / "extension/Tutorial.html").resolve().as_uri(), wait_until="networkidle")
              tasks = [
                ("tutorial-search.png", "SEARCH FROM THE ADDRESS BAR", "Start Bible searches without leaving your current tab.", "Search from the Address Bar"),
                ("tutorial-references.png", "OPEN BIBLE REFERENCES", "Select reference text and open it in Blue Letter Bible.", "Select Text and Open It in BLB"),
                ("tutorial-study.png", "STUDY AND QUICK LOOKUPS", "Use study sessions and quick word lookups as you read.", "Study Sessions and History"),
              ]
              for filename, title, subtitle, section in tasks:
                  # Capture the actual source guide, scrolled to the matching section where possible.
                  target = page.get_by_text(section, exact=False).first
                  try:
                      target.scroll_into_view_if_needed(timeout=2500)
                  except Exception:
                      pass
                  page.screenshot(path=f"/tmp/{filename}", full_page=False)
                  content = Image.open(f"/tmp/{filename}").convert("RGB")
                  content.thumbnail((1040, 420))
                  im = base("KJV Scripture Tools", title, subtitle)
                  browser_frame(im, "KJV Scripture Tools — User Guide")
                  im.paste(content, ((W-content.width)//2, 280))
                  im.save(out / filename, optimize=True)
              browser.close()

          # Only the four focused PNGs are listing candidates; remove old PDF-page captures
          # so outdated, low-legibility documentation screenshots are not mistaken for final assets.
          for old in out.glob("tutorial-pdf-page-*.png"):
              old.unlink()
          for image_path in sorted(out.glob("*.png")):
              with Image.open(image_path) as image:
                  if image.size != (W, H) or image.format != "PNG":
                      raise SystemExit(f"Invalid screenshot: {image_path} {image.size} {image.format}")
              print(f"Verified {image_path}: 1280x800 PNG")
          PY
          python /tmp/render_store_screenshots.py
          python scripts/verify-store-assets.py

      - name: Commit screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/chrome-web-store-assets/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Improve Chrome Web Store screenshot composition"
            git push origin HEAD:chore/chrome-web-store-screenshots
          fi
