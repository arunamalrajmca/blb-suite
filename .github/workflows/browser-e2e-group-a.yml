name: BLB Suite BROWSER E2E — GROUP A
run-name: E2E-A Reference — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }}

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'tests/**'
      - 'scripts/**'
      - 'regression-suite/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e-group-a.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: Classify runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.select.outputs.changed_specs }}
      changed_browser_specs: ${{ steps.select.outputs.changed_browser_specs }}
      unmapped_specs: ${{ steps.select.outputs.unmapped_specs }}
      group_a_required: ${{ steps.select.outputs.group_a_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"

  core-group-a:
    needs: change-detection
    name: BROWSER E2E — GROUP A — REFERENCE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
      - name: Grant test-only generic host access
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Run source URL parser regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-patterns.spec.js') }}
        run: npx playwright test tests/browser/redirect-source-url-patterns.spec.js

      - name: Run omnibox reference boundary regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/omnibox-boolean-operators.spec.js') }}
        run: npx playwright test tests/browser/omnibox-boolean-operators.spec.js --grep 'omnibox reference boundaries'
      - name: Run source URL browser redirect regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-browser.spec.js') }}
        run: npx playwright test tests/browser/redirect-source-url-browser.spec.js
      - name: Run Group A
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/e2e-core-user-actions.spec.js') }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'Alt.B command path opens an exact selected Bible reference'
      - name: Run King's Bible collector behavior regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/kings-bible-collector-behavior.spec.js') }}
        run: npx playwright test tests/browser/kings-bible-collector-behavior.spec.js

      - name: Run popup site-feature defaults regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/site-feature-defaults.spec.js') }}
        run: npx playwright test tests/browser/site-feature-defaults.spec.js

      - name: Run Study Sessions popup UI regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-session-popup-ui-regression.spec.js') }}
        run: npx playwright test tests/browser/study-session-popup-ui-regression.spec.js

      - name: Run Study Sessions lifecycle regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/feature-lifecycle-regressions.spec.js') }}
        run: npx playwright test tests/browser/feature-lifecycle-regressions.spec.js

      - name: Run Study Sessions backup and restore regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-backup-restore.spec.js') }}
        run: npx playwright test tests/browser/study-backup-restore.spec.js

      # Keep the Facebook-style DOM regression in this targeted suite so range-context fixes are exercised on branch pushes.
      - name: Run Facebook nested reference token regression
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Facebook nested dir-auto reference resolves from book, chapter, and verse-range gestures'

      - name: Run Supply of Grace Ephesians chapter-context regression
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Supply of Grace Substack Ephesians chapter context does not fall back to Ephesians 1:1'

      - name: Run every test in changed browser spec files
        if: ${{ needs.change-detection.outputs.changed_browser_specs != '' }}
        env:
          CHANGED_BROWSER_SPECS: ${{ needs.change-detection.outputs.changed_browser_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$CHANGED_BROWSER_SPECS"
          npx playwright test "${specs[@]}"

      - name: Run changed browser specs without a dedicated workflow step
        if: ${{ needs.change-detection.outputs.unmapped_specs != '' }}
        env:
          UNMAPPED_SPECS: ${{ needs.change-detection.outputs.unmapped_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$UNMAPPED_SPECS"
          npx playwright test "${specs[@]}"

      - name: Run Facebook Revelation directional-format range regression
        if: ${{ always() && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Facebook directional-format Revelation 20:1-10 resolves the whole range from book-name double-click'
