name: BLB Suite BROWSER E2E — GROUP A
run-name: E2E-A Reference — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }}

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-group-a:
    name: BROWSER E2E — GROUP A — REFERENCE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Group A
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'Alt.B command path opens an exact selected Bible reference'
