name: Extension Fresh-Install Startup Diagnostics
# Dedicated workflow: never runs the full browser suite.
run-name: Fresh-install startup diagnostics — PR ${{ github.event.pull_request.number || github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [ synchronize ]
    paths:
      - 'tests/browser/startup-diagnostics.spec.js'
      - 'tests/browser/fixtures.js'
      - 'extension/**'
      - '.github/workflows/extension-startup-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: extension-startup-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install-startup:
    name: Fresh install and first worker startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Initialize diagnostics artifact path
        run: |
          mkdir -p test-results
          : > test-results/extension-startup-diagnostics.log

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run only the fresh-install startup diagnostic
        env:
          BLB_STARTUP_DIAGNOSTICS_LOG_PATH: ${{ github.workspace }}/test-results/extension-startup-diagnostics.log
        run: |
          mkdir -p test-results
          npx playwright test tests/browser/startup-diagnostics.spec.js --max-failures=1

      - name: Verify diagnostics were written
        if: always()
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/test-results/extension-startup-diagnostics.log"
          test -s "$log"
          grep -q '"event":"browser-version"' "$log"
          grep -q '"event":"fresh-install-worker-ready"' "$log"
          grep -q '"event":"first-runtime-message-response"' "$log"
          grep -q '"event":"diagnostics-finished"' "$log"

      - name: Upload fresh-install startup diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-fresh-install-startup-diagnostics
          path: ${{ github.workspace }}/test-results/extension-startup-diagnostics.log
          if-no-files-found: error
          retention-days: 14

  brave-startup-and-reload:
    name: Brave fresh install and 10 worker cold starts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Initialize diagnostics artifact
        run: |
          mkdir -p test-results
          : > test-results/brave-startup-reload.log

      - name: Install Brave stable from the official repository
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install -y brave-browser
          brave-browser --version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install browser runtime dependencies
        run: npx playwright install-deps chromium

      - name: Run fresh-install and repeated worker cold-start diagnostics in Brave
        env:
          BLB_BROWSER_EXECUTABLE_PATH: ${{ env.BLB_BRAVE_EXECUTABLE }}
          BLB_HEADFUL_EXTENSION_TESTS: '1'
          BLB_TEST_FULL_EXTENSION_RELOADS: '1'
          BLB_STARTUP_DIAGNOSTICS_LOG_PATH: ${{ github.workspace }}/test-results/brave-startup-reload.log
        run: |
          xvfb-run -a npx playwright test tests/browser/startup-diagnostics.spec.js --max-failures=1

      - name: Verify Brave diagnostics and all reload cycles
        if: always()
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/test-results/brave-startup-reload.log"
          test -s "$log"
          grep -q '"event":"browser-version"' "$log"
          grep -q '"event":"fresh-install-worker-ready"' "$log"
          grep -q '"event":"first-runtime-message-response"' "$log"
          grep -q '"event":"diagnostics-finished"' "$log"
          passed="$(grep -c '"event":"worker-reload-cycle-passed"' "$log" || true)"
          test "$passed" -eq 10
          full_reloads="$(grep -c '"event":"extension-reload-cycle-passed"' "$log" || true)"
          test "$full_reloads" -eq 100
          selection_messages="$(grep -c '"event":"active-tab-selection-runtime-message"' "$log" || true)"
          test "$selection_messages" -eq 200
          facebook_messages="$(grep -c '"event":"active-tab-selection-runtime-message".*"sourceHost":"www.facebook.com".*"result":{.*"ok":true' "$log" || true)"
          test "$facebook_messages" -eq 100
          blb_messages="$(grep -c '"event":"active-tab-selection-runtime-message".*"sourceHost":"www.blueletterbible.org".*"result":{"ok":true' "$log" || true)"
          test "$blb_messages" -eq 100
          recovery_checks="$(grep -c '"event":"facebook-and-blb-content-script-recovery-after-reload"' "$log" || true)"
          test "$recovery_checks" -eq 100
          destination_checks="$(grep -c '"event":"selection-request-destination-state".*"destinationCount":1' "$log" || true)"
          test "$destination_checks" -eq 200
          grep -q '"event":"combined-stress-tabs-ready"' "$log"
          grep -q '"event":"facebook-optional-host-permission-granted".*"granted":true.*"contains":true' "$log"
          grep -q '"facebookResponse":{"ok":true}' "$log"
          grep -q '"blbResponse":{"ok":true}' "$log"
          grep -q '"facebookSelectionMessageOk":true' "$log"
          grep -q '"blbSelectionMessageOk":true' "$log"

      - name: Upload Brave startup and reload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-brave-startup-reload-diagnostics
          path: ${{ github.workspace }}/test-results/brave-startup-reload.log
          if-no-files-found: error
          retention-days: 14

  windows-brave-startup-and-reload:
    name: Windows Brave fresh install and 100 full reloads
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install Brave stable
        shell: pwsh
        run: |
          choco install brave -y --no-progress
          $braveCandidates = @(
            (Join-Path $env:LOCALAPPDATA 'BraveSoftware\Brave-Browser\Application\brave.exe'),
            (Join-Path $env:ProgramFiles 'BraveSoftware\Brave-Browser\Application\brave.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'BraveSoftware\Brave-Browser\Application\brave.exe')
          )
          $brave = $braveCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$brave) { throw "Brave executable not found. Checked: $($braveCandidates -join '; ')" }
          "BLB_BRAVE_EXECUTABLE=$brave" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $brave --version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium runtime
        run: npx playwright install chromium

      - name: Run Windows Brave startup and 100-reload diagnostics
        shell: pwsh
        env:
          BLB_BROWSER_EXECUTABLE_PATH: C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe
          BLB_HEADFUL_EXTENSION_TESTS: '0'
          BLB_TEST_FULL_EXTENSION_RELOADS: '1'
          BLB_STARTUP_DIAGNOSTICS_LOG_PATH: ${{ github.workspace }}\test-results\windows-brave-startup-reload.log
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npx playwright test tests/browser/startup-diagnostics.spec.js --max-failures=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows Brave diagnostics and reload cycles
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'test-results\windows-brave-startup-reload.log'
          if (!(Test-Path $log)) { throw 'Windows Brave diagnostic log was not created' }
          $records = Get-Content $log | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } | Where-Object { $_ }
          foreach ($event in @('browser-version','fresh-install-worker-ready','first-runtime-message-response','diagnostics-finished')) {
            if (!($records | Where-Object event -eq $event)) { throw "Missing diagnostic event: $event" }
          }
          $passed = @($records | Where-Object event -eq 'worker-reload-cycle-passed').Count
          if ($passed -ne 10) { throw "Expected 10 worker reload cycles, got $passed" }
          $fullReloads = @($records | Where-Object event -eq 'extension-reload-cycle-passed').Count
          if ($fullReloads -ne 100) { throw "Expected 100 full extension reloads, got $fullReloads" }
          $scriptFailures = @($records | Where-Object { $_.event -eq 'diagnostics-finished' } | Select-Object -Last 1).scriptFailureCount
          if ($scriptFailures -ne 0) { throw "Detected $scriptFailures extension script/network failures" }

      - name: Upload Windows Brave startup diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-windows-brave-startup-reload-diagnostics
          path: ${{ github.workspace }}\test-results\windows-brave-startup-reload.log
          if-no-files-found: error
          retention-days: 14
