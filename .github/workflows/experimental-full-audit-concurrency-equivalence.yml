name: Experimental Full-Audit Concurrency Equivalence
run-name: Full Browser Concurrency Equivalence — ${{ github.ref_name }} — Run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional prior run ID; artifacts are reused only when commit and inventory fingerprints match.'
        required: false
        type: string
  pull_request:
    branches: [ main ]
    # PR updates run only the focused lifecycle-race regression. Full audits are manual dispatches only.
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: full-audit-concurrency-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen-complete-browser-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_run_id == '' }}
    name: Fail-fast complete-inventory browser screening
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs
      - name: Run fail-fast four-worker screening over the complete browser inventory
        id: comparison
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency
          BLB_CONCURRENCY_MODE: screen
          BLB_CONCURRENCY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload complete-inventory screening evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-concurrency-equivalence-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screening result
        if: always()
        env:
          OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          {
            echo "## Complete-inventory concurrency screening"
            echo
            echo "Execution: one complete four-worker screening pass with fail-fast enabled."
            echo "Screening result: **$OUTCOME**"
            echo
            echo "This preliminary screen is not a serial-versus-parallel equivalence proof."
          } >> "$GITHUB_STEP_SUMMARY"

  deep-serial-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Deep stage 1 — isolated serial baseline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep" "${{ runner.temp }}/blb-full-audit-concurrency-deep/serial-recovery"
      - name: Configure serial checkpoint recovery directory
        run: echo "BLB_CONCURRENCY_SERIAL_RECOVERY_DIR=${{ runner.temp }}/blb-full-audit-concurrency-deep/serial-recovery" >> "$GITHUB_ENV"
      - name: Restore a prior complete serial baseline when requested
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: full-audit-deep-serial-${{ github.event.inputs.reuse_run_id }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
      - name: Check whether a complete serial baseline was restored
        id: complete_serial_restore
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if node -e "const fs=require('fs'),crypto=require('crypto'); const p=process.argv[1]; const s=JSON.parse(fs.readFileSync(p+'/serial-stage-summary.json','utf8')); const i=JSON.parse(fs.readFileSync(p+'/inventory.json','utf8')); const r=JSON.parse(fs.readFileSync(p+'/serial-results.json','utf8')); const e=JSON.parse(fs.readFileSync(p+'/serial-errors.json','utf8')); const list=i.scheduledTests; const digest=Array.isArray(list)?crypto.createHash('sha256').update(JSON.stringify(list)).digest('hex'):''; const seen=new Set(); const records=Array.isArray(r)&&Array.isArray(list)&&r.length===list.length&&r.every((x,n)=>{const t=x.tests?.[0]; if(x.inventoryEntry!==list[n]||x.exitCode!==0||x.parseError||x.tests?.length!==1||!t?.key||!t.status||seen.has(t.key)) return false; seen.add(t.key); return true;}); process.exit(s.complete===true&&i.sourceCommit===process.env.SOURCE_SHA&&Array.isArray(list)&&i.scheduled===list.length&&i.scheduledDigest===digest&&s.scheduledTestCount===list.length&&s.serialProcessCount===list.length&&records&&Array.isArray(e)&&e.length===0?0:1)" "$REPORT_DIR" 2>/dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore prior serial checkpoint batch 1 when requested
        if: ${{ github.event.inputs.reuse_run_id != '' && steps.complete_serial_restore.outputs.complete != 'true' }}
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: full-audit-deep-serial-batch-1-${{ github.event.inputs.reuse_run_id }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep/serial-recovery/batch-01
      - name: Restore prior serial checkpoint batch 2 when requested
        if: ${{ github.event.inputs.reuse_run_id != '' && steps.complete_serial_restore.outputs.complete != 'true' }}
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: full-audit-deep-serial-batch-2-${{ github.event.inputs.reuse_run_id }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep/serial-recovery/batch-02
      - name: Restore prior serial checkpoint batch 3 when requested
