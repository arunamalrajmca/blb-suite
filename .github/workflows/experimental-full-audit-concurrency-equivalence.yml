name: Experimental Full-Audit Concurrency Equivalence
run-name: Full Browser Concurrency Equivalence — ${{ github.ref_name }} — Run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional prior run ID; artifacts are reused only when commit and inventory fingerprints match.'
        required: false
        type: string
  pull_request:
    branches: [ main ]
    # Run on opt-in label and every subsequent PR-head update while the label remains.
    types: [labeled, synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: full-audit-concurrency-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen-complete-browser-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence') && (github.event.action != 'labeled' || github.event.label.name == 'ci-full-audit-concurrency-equivalence')) }}
    name: Fail-fast complete-inventory browser screening
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs
      - name: Run fail-fast four-worker screening over the complete browser inventory
        id: comparison
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency
          BLB_CONCURRENCY_MODE: screen
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload complete-inventory screening evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-concurrency-equivalence-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screening result
        if: always()
        env:
          OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          {
            echo "## Complete-inventory concurrency screening"
            echo
            echo "Execution: one complete four-worker screening pass with fail-fast enabled."
            echo "Screening result: **$OUTCOME**"
            echo
            echo "This preliminary screen is not a serial-versus-parallel equivalence proof."
          } >> "$GITHUB_STEP_SUMMARY"

  deep-serial-baseline:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence-deep') }}
    name: Deep stage 1 — isolated serial baseline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep"
      - name: Restore a prior complete serial baseline when requested
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: full-audit-deep-serial-${{ github.event.inputs.reuse_run_id }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs
      - name: Serial baseline batch 1 — next 100 isolated tests
        id: serial_batch_1
        if: success()
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          BLB_CONCURRENCY_MODE: stage-serial
          BLB_CONCURRENCY_SERIAL_BATCH_SIZE: '100'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Preserve serial checkpoint batch 1
        if: always() && steps.serial_batch_1.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-deep-serial-batch-1-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          if-no-files-found: warn
          retention-days: 30
      - name: Serial baseline batch 2 — next 100 isolated tests
