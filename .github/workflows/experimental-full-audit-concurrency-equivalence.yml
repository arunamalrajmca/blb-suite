name: Experimental Full-Audit Concurrency Equivalence
run-name: Full Browser Concurrency Equivalence — ${{ github.ref_name }} — Run ${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # Run on opt-in label and every subsequent PR-head update while the label remains.
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: full-audit-concurrency-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen-complete-browser-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence') && (github.event.action != 'labeled' || github.event.label.name == 'ci-full-audit-concurrency-equivalence')) }}
    name: Fail-fast complete-inventory browser screening
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs
      - name: Run fail-fast four-worker screening over the complete browser inventory
        id: comparison
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency
          BLB_CONCURRENCY_MODE: screen
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload complete-inventory screening evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-concurrency-equivalence-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screening result
        if: always()
        env:
          OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          {
            echo "## Complete-inventory concurrency screening"
            echo
            echo "Execution: one complete four-worker screening pass with fail-fast enabled."
            echo "Screening result: **$OUTCOME**"
            echo
            echo "This preliminary screen is not a serial-versus-parallel equivalence proof."
          } >> "$GITHUB_STEP_SUMMARY"

  deep-serial-baseline:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence-deep') }}
    name: Deep stage 1 — isolated serial baseline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs
      - name: Stage 1 — run isolated serial baseline with per-test checkpoints
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          BLB_CONCURRENCY_MODE: stage-serial
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload serial baseline and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-deep-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          if-no-files-found: warn
          retention-days: 30

  deep-parallel-repetition-1:
    needs: [deep-serial-baseline]
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence-deep') }}
    name: Deep stage 2 — parallel repetition 1 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep"
      - name: Download passing serial baseline
        uses: actions/download-artifact@v6
        with:
          name: full-audit-deep-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Stage 2 — run and compare parallel repetition 1 (fail fast)
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          BLB_CONCURRENCY_MODE: stage-parallel
          BLB_CONCURRENCY_REPETITION: '1'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload repetition 1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-deep-repetition-1-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          if-no-files-found: warn
          retention-days: 30

  deep-parallel-repetition-2:
    needs: [deep-parallel-repetition-1]
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence-deep') }}
    name: Deep stage 3 — parallel repetition 2 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep"
      - name: Download passing serial baseline
        uses: actions/download-artifact@v6
        with:
          name: full-audit-deep-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Stage 3 — run and compare parallel repetition 2 (fail fast)
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          BLB_CONCURRENCY_MODE: stage-parallel
          BLB_CONCURRENCY_REPETITION: '2'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload repetition 2 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-deep-repetition-2-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          if-no-files-found: warn
          retention-days: 30

  deep-parallel-repetition-3:
    needs: [deep-parallel-repetition-2]
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence-deep') }}
    name: Deep stage 4 — parallel repetition 3 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency-deep"
      - name: Download passing serial baseline
        uses: actions/download-artifact@v6
        with:
          name: full-audit-deep-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check concurrency audit script syntax
        run: node --check scripts/compare-full-audit-concurrency.mjs
      - name: Stage 4 — run and compare parallel repetition 3 (fail fast)
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          BLB_CONCURRENCY_MODE: stage-parallel
          BLB_CONCURRENCY_REPETITION: '3'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs
      - name: Upload repetition 3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-deep-repetition-3-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency-deep
          if-no-files-found: warn
          retention-days: 30
