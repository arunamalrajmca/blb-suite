name: Experimental Full-Audit Concurrency Equivalence
run-name: Browser Concurrency Sample — ${{ github.ref_name }} — Run ${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # This representative serial-versus-parallel comparison is an explicit
    # qualification step, not a per-commit prerequisite. It inventories every
    # spec file but executes only risk-weighted representatives from each.
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: full-audit-concurrency-equivalence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.action || 'dispatch' }}
  cancel-in-progress: true

jobs:
  compare-representative-browser-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full-audit-concurrency-equivalence') }}
    name: Compare representative one-worker and four-worker browser audits
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prepare evidence directory
        run: mkdir -p "${{ runner.temp }}/blb-full-audit-concurrency"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify repository test ownership inventory
        run: node scripts/test-suite-inventory.mjs

      - name: Compare representative tests from every spec under both execution models
        id: comparison
        env:
          BLB_CONCURRENCY_REPORT_DIR: ${{ runner.temp }}/blb-full-audit-concurrency
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: node scripts/compare-full-audit-concurrency.mjs

      - name: Upload serial and parallel comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-audit-concurrency-equivalence-${{ github.run_id }}
          path: ${{ runner.temp }}/blb-full-audit-concurrency
          if-no-files-found: warn
          retention-days: 30

      - name: Publish comparison result
        if: always()
        env:
          OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          {
            echo "## Full-audit concurrency equivalence"
            echo
            echo "Execution: one-worker serial baseline versus one four-worker run over the same risk-weighted sample; the complete inventory is still discovered and accounted for."
            echo
            echo "Result: **$OUTCOME**"
            echo
            echo "The uploaded artifact contains the complete discovered inventory, per-spec sample rationale, serial and parallel test records, logs, and exact identity/status/retry comparisons."
          } >> "$GITHUB_STEP_SUMMARY"
