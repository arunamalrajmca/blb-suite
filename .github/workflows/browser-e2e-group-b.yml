name: BLB Suite BROWSER E2E — GROUP B
run-name: E2E-B Clipboard/Links — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: Classify runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.select.outputs.changed_specs }}
      group_b_required: ${{ steps.select.outputs.group_b_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"

  core-group-b:
    needs: change-detection
    name: BROWSER E2E — GROUP B — CLIPBOARD/LINKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
      - run: npx playwright install chromium
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
      - name: Run native redirect hostname regression tests
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-hostnames.spec.js') }}
        run: npx playwright test tests/browser/redirect-hostnames.spec.js
      - name: Run non-KJV BLB redirect regression tests
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-non-kjv-redirect.spec.js') }}
        run: npx playwright test tests/browser/blb-non-kjv-redirect.spec.js
      - name: Run ScriptTagger injection and toggle regression tests
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/scripttagger-global-injection.spec.js') }}
        run: npx playwright test tests/browser/scripttagger-global-injection.spec.js
      - name: Run MultiVerse tab reuse regressions
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/multiverse-tab-reuse.spec.js') }}
        run: npx playwright test tests/browser/multiverse-tab-reuse.spec.js

      - name: Run Group B
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/e2e-core-user-actions.spec.js') }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'MultiVerse Copy button adds a BLB hyperlink to HTML clipboard data|copying typed MultiVerse references preserves the exact input text|copying selected Bible text|BLB verse links inside parse popups'
