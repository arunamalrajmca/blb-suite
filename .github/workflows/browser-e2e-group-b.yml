name: BLB Suite BROWSER E2E — GROUP B
run-name: E2E-B Clipboard/Links — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }}

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-group-b:
    name: BROWSER E2E — GROUP B — CLIPBOARD/LINKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: runtime
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/is-runtime-change.sh
      - uses: actions/setup-node@v4
        if: ${{ github.event_name != 'pull_request' || steps.runtime.outputs.runtime_changed == 'true' }}
        with:
          node-version: 22
      - run: npm install
        if: ${{ github.event_name != 'pull_request' || steps.runtime.outputs.runtime_changed == 'true' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ github.event_name != 'pull_request' || steps.runtime.outputs.runtime_changed == 'true' }}
      - name: Run Group B
        if: ${{ github.event_name != 'pull_request' || steps.runtime.outputs.runtime_changed == 'true' }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'copying selected Bible text|BLB verse links inside parse popups'
