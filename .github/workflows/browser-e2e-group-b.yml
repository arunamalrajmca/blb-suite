name: BLB Suite BROWSER E2E — GROUP B
run-name: E2E-B Clipboard/Links — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }}

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  core-group-b:
    name: BROWSER E2E — GROUP B — CLIPBOARD/LINKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-e2e-b') }}
        with:
          node-version: 22
      - run: npm install
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-e2e-b') }}
      - run: npx playwright install --with-deps chromium
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-e2e-b') }}
      - name: Run Group B
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-e2e-b') }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep 'copying selected Bible text|BLB verse links inside parse popups'
