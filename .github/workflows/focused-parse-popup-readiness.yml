name: Focused parse-popup readiness regression

on:
  push:
    branches:
      - fix/parse-popup-test-readiness

permissions:
  contents: read

jobs:
  focused-parse-popup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Run the focused regression
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep "BLB verse links inside parse popups bind dynamically appended anchors" --max-failures=1
