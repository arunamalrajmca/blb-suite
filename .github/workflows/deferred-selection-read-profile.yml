name: Duplicate tab-query profile

on:
  push:
    branches: [audit/tab-query-profile]
    paths:
      - '.github/workflows/tab-query-profile.yml'
      - 'tests/browser/extension.spec.js'

permissions:
  contents: read

concurrency:
  group: deferred-selection-read-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile exhaustive grammar tab-query cost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exhaustive OT and NT generic reference grammar three times
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tab-query-profile"
          START_MS="$(node -p 'Date.now()')"
          npx playwright test tests/browser/extension.spec.js \
            --grep 'Double-click generic reference grammar — exhaustive token coverage' \
            --workers=1 --repeat-each=3 --reporter=line 2>&1 | tee "$RUNNER_TEMP/deferred-selection-profile/profile.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Profile process wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/deferred-selection-profile/profile.log"
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deferred-selection-read-profile
          path: ${{ runner.temp }}/deferred-selection-profile/profile.log
          if-no-files-found: warn
          retention-days: 14
