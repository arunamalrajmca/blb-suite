name: MultiVerse 4,201-reference phase profile

on:
  push:
    branches: [audit/multiverse-4201-phase-profiling]
    paths:
      - '.github/workflows/multiverse-4201-phase-profile.yml'
      - 'tests/browser/multiverse-tab-reuse.spec.js'
      - 'tests/browser/fixtures.js'
      - 'extension/background.js'
      - 'extension/multiverse-post.js'

permissions:
  contents: read

concurrency:
  group: multiverse-4201-phase-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile 4,201-reference MultiVerse batches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 4,201-reference MultiVerse test with phase profiling
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/multiverse-profile"
          START_MS="$(node -p 'Date.now()')"
          npx playwright test tests/browser/multiverse-tab-reuse.spec.js \
            --grep 'MultiVerse opens every batch for requests exceeding 20 tabs' \
            --workers=1 --reporter=line 2>&1 | tee "$RUNNER_TEMP/multiverse-profile/profile.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Profile process wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/multiverse-profile/profile.log"
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiverse-4201-phase-profile
          path: ${{ runner.temp }}/multiverse-profile/profile.log
          if-no-files-found: warn
          retention-days: 14
