name: BLB Suite RELEASE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag and source
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Release tags must use vMAJOR.MINOR.PATCH.BUILD"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./extension/manifest.json').version")"
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Tag $VERSION does not match manifest $MANIFEST_VERSION"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tag must point to a commit contained in main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release source: $GITHUB_SHA"
          echo "Manifest version: $MANIFEST_VERSION"

  package-and-release:
    name: Package and publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Build reproducible extension package
        run: |
          mkdir -p dist
          bash scripts/package-release.sh "${{ needs.validate.outputs.version }}" dist
          unzip -t "dist/Blue-Letter-Bible-Suite-${{ needs.validate.outputs.version }}.zip"
      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: blb-suite-release-${{ needs.validate.outputs.version }}
          path: |
            dist/Blue-Letter-Bible-Suite-${{ needs.validate.outputs.version }}.zip
            dist/Blue-Letter-Bible-Suite-${{ needs.validate.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > dist/RELEASE-CHECKSUMS.txt <<EOF
          Blue Letter Bible Suite $VERSION
          Git commit: $GITHUB_SHA
          SHA-256:
          $(cat "dist/Blue-Letter-Bible-Suite-$VERSION.zip.sha256")
          EOF
          gh release create "$TAG" "dist/Blue-Letter-Bible-Suite-$VERSION.zip" "dist/Blue-Letter-Bible-Suite-$VERSION.zip.sha256" "dist/RELEASE-CHECKSUMS.txt" --title "Blue Letter Bible Suite $VERSION" --generate-notes
      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish
