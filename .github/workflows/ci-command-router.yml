name: BLB Suite CI Command Router
run-name: CI command router — PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  apply-command:
    if: >-
      ${{ github.event.issue.pull_request &&
          (startsWith(github.event.comment.body, '/ci ') ||
           startsWith(github.event.comment.body, '/ci\n')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply CI selection command
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          command="${COMMAND%%$'\n'*}"
          case "$command" in
            "/ci run-all")
              selected="ci-run-all"
              ;;
            "/ci run-none")
              selected=""
              ;;
            "/ci e2e-a")
              selected="ci-run-e2e-a"
              ;;
            "/ci e2e-b")
              selected="ci-run-e2e-b"
              ;;
            "/ci references")
              selected="ci-run-references"
              ;;
            "/ci performance")
              selected="ci-run-performance"
              ;;
            "/ci hard-gate")
              selected="ci-run-hard-gate"
              ;;
            *)
              echo "Unsupported CI command: $command"
              exit 0
              ;;
          esac

          labels=(
            ci-run-all
            ci-run-e2e-a
            ci-run-e2e-b
            ci-run-references
            ci-run-performance
            ci-run-hard-gate
          )

          for label in "${labels[@]}"; do
            encoded="${label// /%20}"
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/$encoded" || true
          done

          if [[ -n "$selected" ]]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
              -d "{\"labels\":[\"$selected\"]}"
          fi

          echo "CI selection: ${selected:-none}"
