name: BLB Suite CI Command Router
run-name: CI command router — PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  apply-command:
    if: >-
      ${{ github.event.issue.pull_request &&
          (startsWith(github.event.comment.body, '/ci ') ||
           startsWith(github.event.comment.body, '/ci\n')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply CI selection command
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          command="${COMMAND%%$'\\n'*}"
          read -r action argument <<< "$command"
          selected=""
          build=false
          release_tag=""

          case "$action" in
            "/ci")
              case "$argument" in
                "run-all")
                  selected="ci-run-all"
                  build=true
                  ;;
                "run-none")
                  selected=""
                  ;;
                "e2e-a")
                  selected="ci-run-e2e-a"
                  ;;
                "e2e-b")
                  selected="ci-run-e2e-b"
                  ;;
                "references")
                  selected="ci-run-references"
                  ;;
                "performance")
                  selected="ci-run-performance"
                  ;;
                "hard-gate")
                  selected="ci-run-hard-gate"
                  ;;
                "build")
                  selected="ci-run-build"
                  build=true
                  ;;
                "release")
                  if [[ "$command" != "/ci release v"* ]]; then
                    echo "Release requires a tag: /ci release vMAJOR.MINOR.PATCH.BUILD"
                    exit 1
                  fi
                  release_tag="${command#"/ci release "}"
                  if ! printf '%s\\n' "$release_tag" | grep -Eq '^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$'; then
                    echo "Invalid release tag: $release_tag"
                    exit 1
                  fi
                  selected="ci-run-release"
                  ;;
                *)
                  echo "Unsupported CI command: $command"
                  exit 0
                  ;;
              esac
              ;;
            *)
              echo "Unsupported CI command: $command"
              exit 0
              ;;
          esac

          labels=(
            ci-run-all
            ci-run-e2e-a
            ci-run-e2e-b
            ci-run-references
            ci-run-performance
            ci-run-hard-gate
            ci-run-build
            ci-run-release
          )

          for label in "${labels[@]}"; do
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/$label" || true
          done

          if [[ -n "$selected" ]]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
              -d "{\"labels\":[\"$selected\"]}"
          fi

          PR_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          PR_REF="$(jq -r '.head.ref' <<< "$PR_JSON")"
          PR_MERGED_AT="$(jq -r '.merged_at // empty' <<< "$PR_JSON")"
          BUILD_REF="$PR_REF"

          if [[ -n "$PR_MERGED_AT" ]]; then
            BUILD_REF="main"
          fi

          if [[ "$build" == "true" ]]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/actions/workflows/build-main.yml/dispatches" \
              -d "{\"ref\":\"$BUILD_REF\"}"
          fi

          if [[ -n "$release_tag" ]]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/actions/workflows/release.yml/dispatches" \
              -d "{\"ref\":\"$release_tag\"}"
          fi

          echo "CI selection: ${selected:-none}"
