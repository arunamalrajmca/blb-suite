name: Temporary Main Build Package

on:
  push:
    branches:
      - 'temp/main-build-5.2.51.46'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
      - name: Build extension ZIP
        run: |
          mkdir -p dist
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ZIP="dist/Blue-Letter-Bible-Suite-main-${VERSION}.zip"
          cd extension
          zip -r "../$ZIP" .
          cd ..
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
      - name: Upload main build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blb-main-build-5.2.51.46
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
