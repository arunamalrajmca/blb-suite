name: BLB Suite BROWSER E2E — GROUP A + GROUP B
on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'tests/browser/fixtures.js'
      - 'scripts/**'
      - '!scripts/package-release.sh'
      - '!scripts/classify-ci-changes.mjs'
      - '!scripts/select-browser-specs.mjs'
      - '!scripts/select-reference-matrix.mjs'
      - '!scripts/reference-e2e-matrix.json'
      - '!scripts/test-ci-routing-selector.js'
      - '!scripts/compare-performance.mjs'
      - '!scripts/verify-store-assets.py'
      - '!scripts/verify-store-branding.py'
      - '!scripts/verify-store-package.py'
      - '!scripts/verify-store-submission-assets.py'
      - '!scripts/test-*.js'
      - 'regression-suite/**'
      - '!regression-suite/Verify-BLB-Zip.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'extension/**'
      - 'tests/browser/fixtures.js'
      - 'scripts/**'
      - '!scripts/package-release.sh'
      - '!scripts/classify-ci-changes.mjs'
      - '!scripts/select-browser-specs.mjs'
      - '!scripts/select-reference-matrix.mjs'
      - '!scripts/reference-e2e-matrix.json'
      - '!scripts/test-ci-routing-selector.js'
      - '!scripts/compare-performance.mjs'
      - '!scripts/verify-store-assets.py'
      - '!scripts/verify-store-branding.py'
      - '!scripts/verify-store-package.py'
      - '!scripts/verify-store-submission-assets.py'
      - '!scripts/test-*.js'
      - 'regression-suite/**'
      - '!regression-suite/Verify-BLB-Zip.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: Classify runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      full_browser_suite: ${{ steps.select.outputs.full_browser_suite }}
      changed_specs: ${{ steps.select.outputs.changed_specs }}
      changed_browser_specs: ${{ steps.select.outputs.changed_browser_specs }}
      unmapped_specs: ${{ steps.select.outputs.unmapped_specs }}
      group_a_required: ${{ steps.select.outputs.group_a_required }}
      group_b_required: ${{ steps.select.outputs.group_b_required }}
      browser_e2e_required: ${{ steps.select.outputs.reference_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$BASE"
          fi
      - name: Select browser specs for this change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-browser-specs.mjs "$BASE_SHA"

  core-group-a:
    needs: change-detection
    # Skip the runner entirely when the selector says this group is irrelevant.
    if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
    name: BROWSER E2E — GROUP A — REFERENCE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Test execution does not need history; the selector job handles the base diff.
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
      - name: Grant test-only generic host access
        if: ${{ needs.change-detection.outputs.group_a_required == 'true' }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

      # Run the dedicated MultiVerse tab-reuse regression in this existing runner.
      # Shared/unknown runtime changes retain this coverage via full_browser_suite.
      - name: Run MultiVerse tab reuse and 22-batch persistence regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/multiverse-tab-reuse.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/multiverse-tab-reuse.spec.js') }}
        run: npx playwright test tests/browser/multiverse-tab-reuse.spec.js --workers=1

      - name: Run every test in changed browser spec files
        if: ${{ needs.change-detection.outputs.changed_browser_specs != '' }}
        env:
          CHANGED_BROWSER_SPECS: ${{ needs.change-detection.outputs.changed_browser_specs }}
          REFERENCE_GATE_REQUIRED: ${{ needs.change-detection.outputs.browser_e2e_required }}
          FULL_BROWSER_SUITE: ${{ needs.change-detection.outputs.full_browser_suite }}
          SELECTED_SPECS: ${{ needs.change-detection.outputs.changed_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a changed_specs <<< "$CHANGED_BROWSER_SPECS"
          specs=()
          for spec in "${changed_specs[@]}"; do
            case "$spec" in
              tests/browser/redirect-source-url-patterns.spec.js|tests/browser/redirect-source-url-browser.spec.js|tests/browser/redirect-hostnames.spec.js|tests/browser/blb-non-kjv-redirect.spec.js|tests/browser/redirect-toggle-isolation.spec.js|tests/browser/multiverse-clipboard-reference-pattern.spec.js|tests/browser/popup-master-toggle-regression.spec.js|tests/browser/facebook-selection-parser.spec.js|tests/browser/substack-selection-parser.spec.js|tests/browser/omnibox-command-routing.spec.js|tests/browser/pdf-selection-regressions.spec.js|tests/browser/shared-regex-patterns.spec.js|tests/browser/rediscover-sagacity-button.spec.js|tests/browser/research-dom-smoke.spec.js)
                if [[ "$REFERENCE_GATE_REQUIRED" == "true" && ( "$FULL_BROWSER_SUITE" == "true" || ",$SELECTED_SPECS," == *",$spec,"* ) ]]; then
                  echo "Delegating $spec to the required browser-e2e gate."
                  continue
                fi
                ;;
            esac
            specs+=("$spec")
          done
          if (("${#specs[@]}" > 0)); then
            npx playwright test "${specs[@]}"
          else
            echo "All changed browser specs are covered by the required browser-e2e gate."
          fi

      - name: Run source URL parser regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-patterns.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/redirect-source-url-patterns.spec.js') && !(needs.change-detection.outputs.browser_e2e_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-patterns.spec.js'))) }}
        run: npx playwright test tests/browser/redirect-source-url-patterns.spec.js

      - name: Run omnibox behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/omnibox-boolean-operators.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/omnibox-boolean-operators.spec.js') }}
        run: npx playwright test tests/browser/omnibox-boolean-operators.spec.js
      - name: Run source URL browser redirect regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-browser.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/redirect-source-url-browser.spec.js') && !(needs.change-detection.outputs.browser_e2e_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-source-url-browser.spec.js'))) }}
        run: npx playwright test tests/browser/redirect-source-url-browser.spec.js


      # Repeat the previously intermittent two-tab selection test in fresh browser contexts.
      # Preserve each attempt's result but continue so we can compare reproducibility.
      - name: Diagnose reference-plus-prose selection in three isolated runs
        if: ${{ needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/e2e-core-user-actions.spec.js') }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "===== isolated reference-plus-prose attempt $attempt/3 ====="
            npx playwright test tests/browser/e2e-core-user-actions.spec.js --grep "selection containing a reference and authored prose opens MultiVerse and Criteria Search"
            result=$?
            echo "===== isolated attempt $attempt exit code: $result ====="
          done
          exit 0
      # Disable fail-fast for this core file so one intermittent failure does not hide later test results.
      - name: Run complete core user-action regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/e2e-core-user-actions.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/e2e-core-user-actions.spec.js') }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js
      - name: Run King's Bible collector behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/kings-bible-collector-behavior.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/kings-bible-collector-behavior.spec.js') }}
        run: npx playwright test tests/browser/kings-bible-collector-behavior.spec.js

      - name: Run BLB rich clipboard hyperlink regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-auto-hyperlinker.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/blb-auto-hyperlinker.spec.js') }}
        run: npx playwright test tests/browser/blb-auto-hyperlinker.spec.js

      - name: Run draggable button behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-draggable-button.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/blb-draggable-button.spec.js') }}
        run: npx playwright test tests/browser/blb-draggable-button.spec.js

      - name: Run Webster collector behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/webster-collector-behavior.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/webster-collector-behavior.spec.js') }}
        run: npx playwright test tests/browser/webster-collector-behavior.spec.js

      - name: Run KJV case-sensitive routing behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/case-sensitive-routing-behavior.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/case-sensitive-routing-behavior.spec.js') }}
        run: npx playwright test tests/browser/case-sensitive-routing-behavior.spec.js

      - name: Run popup site-feature defaults regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/site-feature-defaults.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/site-feature-defaults.spec.js') }}
        run: npx playwright test tests/browser/site-feature-defaults.spec.js

      - name: Run Study Sessions popup UI regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-session-popup-ui-regression.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/study-session-popup-ui-regression.spec.js') }}
        run: npx playwright test tests/browser/study-session-popup-ui-regression.spec.js

      - name: Run Study Sessions lifecycle regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/feature-lifecycle-regressions.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/feature-lifecycle-regressions.spec.js') }}
        run: npx playwright test tests/browser/feature-lifecycle-regressions.spec.js

      - name: Run Study Sessions backup and restore regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-backup-restore.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/study-backup-restore.spec.js') }}
        run: npx playwright test tests/browser/study-backup-restore.spec.js

      - name: Run Study reference capture behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-reference-capture.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/study-reference-capture.spec.js') }}
        run: npx playwright test tests/browser/study-reference-capture.spec.js

      - name: Run Study PDF export behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/study-session-export.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/study-session-export.spec.js') }}
        run: npx playwright test tests/browser/study-session-export.spec.js

      - name: Run MultiVerse tool-view behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/multiverse-tool-view.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/multiverse-tool-view.spec.js') }}
        run: npx playwright test tests/browser/multiverse-tool-view.spec.js

      - name: Run MultiVerse handoff behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/multiverse-handoff.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/multiverse-handoff.spec.js') }}
        run: npx playwright test tests/browser/multiverse-handoff.spec.js

      - name: Run passive new-tab target behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-passive-new-tab-targets.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/blb-passive-new-tab-targets.spec.js') }}
        run: npx playwright test tests/browser/blb-passive-new-tab-targets.spec.js

      - name: Run source-page collector behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/source-page-collector-behavior.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/source-page-collector-behavior.spec.js') }}
        run: npx playwright test tests/browser/source-page-collector-behavior.spec.js

      - name: Run BLB verse-link navigation behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-verse-link-navigation.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/blb-verse-link-navigation.spec.js') }}
        run: npx playwright test tests/browser/blb-verse-link-navigation.spec.js

      - name: Run Criteria Search navigation behavior regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/criteria-search-navigation.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/criteria-search-navigation.spec.js') }}
        run: npx playwright test tests/browser/criteria-search-navigation.spec.js

      # Keep both reference-context regressions in this targeted suite so range/context fixes are exercised on branch pushes.
      - name: Run extension source-page and reference-context regressions
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'source-page collector initializes on|Facebook nested dir-auto reference resolves from book, chapter, and verse-range gestures|Supply of Grace Substack Ephesians chapter context does not fall back to Ephesians 1:1'

      - name: Run changed browser specs without a dedicated workflow step
        if: ${{ needs.change-detection.outputs.unmapped_specs != '' }}
        env:
          UNMAPPED_SPECS: ${{ needs.change-detection.outputs.unmapped_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$UNMAPPED_SPECS"
          npx playwright test "${specs[@]}"

      - name: Run Facebook Revelation directional-format range regression
        if: ${{ always() && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/extension.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/extension.spec.js') }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'Facebook directional-format Revelation 20:1-10 resolves the whole range from book-name double-click'

  core-group-b:
    needs: change-detection
    # Test execution does not need history; the selector job handles the base diff.
    if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
    name: BROWSER E2E — GROUP B — CLIPBOARD/LINKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
      - run: npx playwright install chromium
        if: ${{ needs.change-detection.outputs.group_b_required == 'true' }}
      - name: Run native redirect hostname regression tests
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-hostnames.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/redirect-hostnames.spec.js') && !(needs.change-detection.outputs.browser_e2e_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/redirect-hostnames.spec.js'))) }}
        run: npx playwright test tests/browser/redirect-hostnames.spec.js
      - name: Run non-KJV BLB redirect regression tests
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-non-kjv-redirect.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/blb-non-kjv-redirect.spec.js') && !(needs.change-detection.outputs.browser_e2e_required == 'true' && (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/blb-non-kjv-redirect.spec.js'))) }}
        run: npx playwright test tests/browser/blb-non-kjv-redirect.spec.js
      - name: Run ScriptTagger injection and toggle regression tests
        if: ${{ (needs.change-detection.outputs.full_browser_suite == 'true' || contains(needs.change-detection.outputs.changed_specs, 'tests/browser/scripttagger-global-injection.spec.js')) && !contains(needs.change-detection.outputs.changed_browser_specs, 'tests/browser/scripttagger-global-injection.spec.js') }}
        run: npx playwright test tests/browser/scripttagger-global-injection.spec.js

  cancel-sibling-runs:
    name: Cancel sibling runs after failure
    if: ${{ failure() && github.event_name == 'pull_request' }}
    needs: [change-detection, core-group-a, core-group-b]
    permissions:
      actions: write
    uses: ./.github/workflows/cancel-sibling-runs-on-failure.yml
