name: BLB Suite BROWSER E2E — GROUP A + GROUP B

on:
  workflow_call:
    inputs:
      full_browser_suite:
        required: true
        type: string
      changed_specs:
        required: true
        type: string
      changed_browser_specs:
        required: true
        type: string
      unmapped_specs:
        required: true
        type: string
      group_a_required:
        required: true
        type: string
      study_sessions_required:
        required: true
        type: string
      group_b_required:
        required: true
        type: string
      browser_e2e_required:
        required: true
        type: string

jobs:
  core-group-a:
    # Skip the runner entirely when the selector says this group is irrelevant.
    if: ${{ inputs.group_a_required == 'true' }}
    name: BROWSER E2E — GROUP A — FEATURES
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # Test execution does not need history; the selector job handles the base diff.
          fetch-depth: 1
      - uses: actions/setup-node@v5
        if: ${{ inputs.group_a_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.group_a_required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ inputs.group_a_required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ inputs.group_a_required == 'true' }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        if: ${{ inputs.group_a_required == 'true' }}
      - name: Grant test-only generic host access
        if: ${{ inputs.group_a_required == 'true' }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

      # Run the dedicated MultiVerse tab-reuse regression in this existing runner.
      # Shared/unknown runtime changes retain this coverage via full_browser_suite.
      - name: Run MultiVerse tab reuse and 22-batch persistence regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/multiverse-tab-reuse.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/multiverse-tab-reuse.spec.js')) }}
        run: npx playwright test tests/browser/multiverse-tab-reuse.spec.js --workers=1

      - name: Run every test in changed browser spec files
        if: ${{ !cancelled() && (inputs.changed_browser_specs != '') }}
        env:
          CHANGED_BROWSER_SPECS: ${{ inputs.changed_browser_specs }}
          REFERENCE_GATE_REQUIRED: ${{ inputs.browser_e2e_required }}
          FULL_BROWSER_SUITE: ${{ inputs.full_browser_suite }}
          SELECTED_SPECS: ${{ inputs.changed_specs }}
          STUDY_SESSIONS_REQUIRED: ${{ inputs.study_sessions_required }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a changed_specs <<< "$CHANGED_BROWSER_SPECS"
          specs=()
          for spec in "${changed_specs[@]}"; do
            case "$spec" in
              tests/browser/feature-lifecycle-regressions.spec.js|tests/browser/study-backup-restore.spec.js|tests/browser/study-reference-capture.spec.js|tests/browser/study-session-export.spec.js|tests/browser/study-session-popup-ui-regression.spec.js)
                if [[ "$STUDY_SESSIONS_REQUIRED" == "true" ]]; then
                  echo "Delegating $spec to the dedicated Study Sessions job."
                  continue
                fi
                ;;
              tests/browser/redirect-source-url-patterns.spec.js|tests/browser/redirect-hostnames.spec.js|tests/browser/blb-non-kjv-redirect.spec.js|tests/browser/redirect-toggle-isolation.spec.js|tests/browser/multiverse-clipboard-reference-pattern.spec.js|tests/browser/popup-master-toggle-regression.spec.js|tests/browser/facebook-selection-parser.spec.js|tests/browser/substack-selection-parser.spec.js|tests/browser/omnibox-command-routing.spec.js|tests/browser/pdf-selection-regressions.spec.js|tests/browser/shared-regex-patterns.spec.js|tests/browser/rediscover-sagacity-button.spec.js|tests/browser/research-dom-smoke.spec.js|tests/browser/right-panel-default-expanded.spec.js)
                if [[ "$REFERENCE_GATE_REQUIRED" == "true" && ( "$FULL_BROWSER_SUITE" == "true" || ",$SELECTED_SPECS," == *",$spec,"* ) ]]; then
                  echo "Delegating $spec to the required browser-e2e gate."
                  continue
                fi
                ;;
            esac
            specs+=("$spec")
          done
          if (("${#specs[@]}" > 0)); then
            total="${#specs[@]}"
            for index in "${!specs[@]}"; do
              spec="${specs[$index]}"
              [[ -f "$spec" ]] || { echo "::error::Selected Playwright spec does not exist: $spec"; exit 1; }
              printf '[%s/%s] Running %s\n' "$((index + 1))" "$total" "$spec"
              npx playwright test "$spec"
            done
          else
            echo "All changed browser specs are covered by the required browser-e2e gate."
          fi

      - name: Run source URL parser regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/redirect-source-url-patterns.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/redirect-source-url-patterns.spec.js') && !(inputs.browser_e2e_required == 'true' && (inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/redirect-source-url-patterns.spec.js')))) }}
        run: npx playwright test tests/browser/redirect-source-url-patterns.spec.js

      - name: Run omnibox behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/omnibox-boolean-operators.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/omnibox-boolean-operators.spec.js')) }}
        run: npx playwright test tests/browser/omnibox-boolean-operators.spec.js
      # Disable fail-fast for this core file so one intermittent failure does not hide later test results.
      - name: Run complete core user-action regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/e2e-core-user-actions.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/e2e-core-user-actions.spec.js')) }}
        run: npx playwright test tests/browser/e2e-core-user-actions.spec.js
      - name: Run King's Bible collector behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/kings-bible-collector-behavior.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/kings-bible-collector-behavior.spec.js')) }}
        run: npx playwright test tests/browser/kings-bible-collector-behavior.spec.js

      - name: Run BLB rich clipboard hyperlink regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-auto-hyperlinker.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/blb-auto-hyperlinker.spec.js')) }}
        run: npx playwright test tests/browser/blb-auto-hyperlinker.spec.js

      - name: Run draggable button behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-draggable-button.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/blb-draggable-button.spec.js')) }}
        run: npx playwright test tests/browser/blb-draggable-button.spec.js

      - name: Run Webster collector behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/webster-collector-behavior.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/webster-collector-behavior.spec.js')) }}
        run: npx playwright test tests/browser/webster-collector-behavior.spec.js

      - name: Run confirmed audit defect regressions
        if: ${{ !cancelled() && (inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/audit-defect-regressions.spec.js')) }}
        run: npx playwright test tests/browser/audit-defect-regressions.spec.js --workers=1

      - name: Run KJV case-sensitive routing behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/case-sensitive-routing-behavior.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/case-sensitive-routing-behavior.spec.js')) }}
        run: npx playwright test tests/browser/case-sensitive-routing-behavior.spec.js

      - name: Run popup site-feature defaults regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/site-feature-defaults.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/site-feature-defaults.spec.js')) }}
        run: npx playwright test tests/browser/site-feature-defaults.spec.js

      - name: Run MultiVerse tool-view behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/multiverse-tool-view.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/multiverse-tool-view.spec.js')) }}
        run: npx playwright test tests/browser/multiverse-tool-view.spec.js

      - name: Run MultiVerse handoff behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/multiverse-handoff.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/multiverse-handoff.spec.js')) }}
        run: npx playwright test tests/browser/multiverse-handoff.spec.js

      - name: Run passive new-tab target behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-passive-new-tab-targets.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/blb-passive-new-tab-targets.spec.js')) }}
        run: npx playwright test tests/browser/blb-passive-new-tab-targets.spec.js

      - name: Run source-page collector behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/source-page-collector-behavior.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/source-page-collector-behavior.spec.js')) }}
        run: npx playwright test tests/browser/source-page-collector-behavior.spec.js

      - name: Run BLB verse-link navigation behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-verse-link-navigation.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/blb-verse-link-navigation.spec.js')) }}
        run: npx playwright test tests/browser/blb-verse-link-navigation.spec.js

      - name: Run Criteria Search navigation behavior regressions
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/criteria-search-navigation.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/criteria-search-navigation.spec.js')) }}
        run: npx playwright test tests/browser/criteria-search-navigation.spec.js

      # Keep both reference-context regressions in this targeted suite so range/context fixes are exercised on branch pushes.
      - name: Run extension source-page and reference-context regressions
        if: ${{ !cancelled() && inputs.full_browser_suite == 'true' }}
        run: npx playwright test tests/browser/extension.spec.js --grep 'source-page collector initializes on|Facebook nested dir-auto reference resolves from book, chapter, and verse-range gestures|Supply of Grace Substack Ephesians chapter context does not fall back to Ephesians 1:1'

      - name: Run changed browser specs without a dedicated workflow step
        if: ${{ !cancelled() && (inputs.unmapped_specs != '') }}
        env:
          UNMAPPED_SPECS: ${{ inputs.unmapped_specs }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a specs <<< "$UNMAPPED_SPECS"
          total="${#specs[@]}"
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            [[ -f "$spec" ]] || { echo "::error::Selected Playwright spec does not exist: $spec"; exit 1; }
            printf '[%s/%s] Running %s\n' "$((index + 1))" "$total" "$spec"
            npx playwright test "$spec"
          done


  core-study-sessions:
    if: ${{ inputs.study_sessions_required == 'true' }}
    name: BROWSER E2E — STUDY SESSIONS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
      - name: Run Study Sessions popup UI regressions
        if: ${{ inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/study-session-popup-ui-regression.spec.js') || contains(inputs.changed_browser_specs, 'tests/browser/study-session-popup-ui-regression.spec.js') }}
        run: npx playwright test tests/browser/study-session-popup-ui-regression.spec.js
      - name: Run Study Sessions lifecycle regressions
        if: ${{ inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/feature-lifecycle-regressions.spec.js') || contains(inputs.changed_browser_specs, 'tests/browser/feature-lifecycle-regressions.spec.js') }}
        run: npx playwright test tests/browser/feature-lifecycle-regressions.spec.js
      - name: Run Study Sessions backup and restore regressions
        if: ${{ inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/study-backup-restore.spec.js') || contains(inputs.changed_browser_specs, 'tests/browser/study-backup-restore.spec.js') }}
        run: npx playwright test tests/browser/study-backup-restore.spec.js
      - name: Run Study reference capture behavior regressions
        if: ${{ inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/study-reference-capture.spec.js') || contains(inputs.changed_browser_specs, 'tests/browser/study-reference-capture.spec.js') }}
        run: npx playwright test tests/browser/study-reference-capture.spec.js
      - name: Run Study PDF export behavior regressions
        if: ${{ inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/study-session-export.spec.js') || contains(inputs.changed_browser_specs, 'tests/browser/study-session-export.spec.js') }}
        run: npx playwright test tests/browser/study-session-export.spec.js

  core-group-b:
    # Test execution does not need history; the selector job handles the base diff.
    if: ${{ inputs.group_b_required == 'true' }}
    name: BROWSER E2E — GROUP B — CLIPBOARD/LINKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        if: ${{ inputs.group_b_required == 'true' }}
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.group_b_required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache npm download data
        if: ${{ inputs.group_b_required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
        if: ${{ inputs.group_b_required == 'true' }}
      - run: npx playwright install chromium
        if: ${{ inputs.group_b_required == 'true' }}
      - name: Run native redirect hostname regression tests
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/redirect-hostnames.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/redirect-hostnames.spec.js') && !(inputs.browser_e2e_required == 'true' && (inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/redirect-hostnames.spec.js')))) }}
        run: npx playwright test tests/browser/redirect-hostnames.spec.js
      - name: Run non-KJV BLB redirect regression tests
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-non-kjv-redirect.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/blb-non-kjv-redirect.spec.js') && !(inputs.browser_e2e_required == 'true' && (inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/blb-non-kjv-redirect.spec.js')))) }}
        run: npx playwright test tests/browser/blb-non-kjv-redirect.spec.js
      - name: Run ScriptTagger injection and toggle regression tests
        if: ${{ !cancelled() && ((inputs.full_browser_suite == 'true' || contains(inputs.changed_specs, 'tests/browser/scripttagger-global-injection.spec.js')) && !contains(inputs.changed_browser_specs, 'tests/browser/scripttagger-global-injection.spec.js')) }}
        run: npx playwright test tests/browser/scripttagger-global-injection.spec.js
  feature-groups-summary:
    name: Validate selected feature groups
    needs:
      - core-group-a
      - core-study-sessions
      - core-group-b
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected group to finish successfully
        env:
          GROUP_A_REQUIRED: ${{ inputs.group_a_required }}
          GROUP_A_RESULT: ${{ needs.core-group-a.result }}
          STUDY_REQUIRED: ${{ inputs.study_sessions_required }}
          STUDY_RESULT: ${{ needs.core-study-sessions.result }}
          GROUP_B_REQUIRED: ${{ inputs.group_b_required }}
          GROUP_B_RESULT: ${{ needs.core-group-b.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check_group() {
            local label="$1" required="$2" result="$3"
            if [[ "$required" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "::error::$label was required but finished as $result"
                failed=1
              fi
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "::error::$label was not selected but finished as $result"
              failed=1
            fi
          }
          check_group "Group A features" "$GROUP_A_REQUIRED" "$GROUP_A_RESULT"
          check_group "Study Sessions" "$STUDY_REQUIRED" "$STUDY_RESULT"
          check_group "Group B links" "$GROUP_B_REQUIRED" "$GROUP_B_RESULT"
          if [[ "$failed" -ne 0 ]]; then exit 1; fi
          echo "Every selected feature group passed; unselected groups were skipped."
