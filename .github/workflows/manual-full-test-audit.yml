name: BLB Suite — Manual Full Test Audit
run-name: Full Test Audit — ${{ github.ref_name }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: full-test-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') }}
    name: Run every repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read manifest version
        id: version
        shell: bash
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Preserve production manifest for package checks
        run: cp extension/manifest.json "$RUNNER_TEMP/blb-manifest-original.json"

      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"

      - name: Validate extension build and module contracts
        id: build
        continue-on-error: true
        run: node scripts/validate-build.js

      - name: Run browser selector decision tests
        id: selector
        continue-on-error: true
        run: node --test tests/selector/*.test.mjs

      - name: Run standalone JavaScript test scripts
        id: scripts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # validate-build.js already executes the scripts in this manifest.
          node -e "for (const test of require('./scripts/validation-test-manifest.json')) console.log('scripts/' + test.script)" > "$RUNNER_TEMP/blb-build-validation-tests.txt"
          for test_file in scripts/test-*.js; do
            if grep -Fxq "$test_file" "$RUNNER_TEMP/blb-build-validation-tests.txt"; then
              echo "Already executed by build validation: $test_file"
              continue
            fi
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Set up Python and install test dependency
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python test dependency
        run: python -m pip install Pillow

      - name: Run every Python unittest
        id: python
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Deliberately bypass select-browser-specs.mjs, changed-file routing,
      # group routing, and workflow-level spec filters. Collect Playwright's
      # complete test list, then run each individual test in its own invocation.
      # This preserves maxFailures: 1 while ensuring one failing test cannot
      # prevent any later test case from executing.
      - name: Run every browser test case independently without CI selector filtering
        id: browser
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          BLB_PERF_OUTPUT: ${{ runner.temp }}/blb-performance.jsonl
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        shell: bash
        run: |
          : > "$BLB_PERF_OUTPUT"
          list_output="$RUNNER_TEMP/blb-playwright-list.txt"
          test_list="$RUNNER_TEMP/blb-playwright-test-list.txt"
          if ! npx playwright test --list --reporter=list > "$list_output" 2>&1; then
            cat "$list_output"
            exit 1
          fi
          cat "$list_output"
          # --test-list expects the complete entry emitted by --list, including
          # project, spec location, suite path, and test title. A bare file:line:column
          # is not a test-list entry and silently selects zero tests.
          sed -nE 's/^[[:space:]]*(\[[^]]+\] › [^[:space:]]+\.spec\.js:[0-9]+:[0-9]+ › .*)$/\1/p' "$list_output" > "$test_list"
          total=$(wc -l < "$test_list" | tr -d ' ')
          expected_specs=$(find tests/browser -maxdepth 1 -type f -name '*.spec.js' | wc -l | tr -d ' ')
          listed_specs=$(sed -nE 's/^[[:space:]]*\[[^]]+\] › ([^[:space:]]+\.spec\.js):[0-9]+:[0-9]+ › .*/\1/p' "$test_list" | sort -u | wc -l | tr -d ' ')
          echo "Browser test cases discovered: $total"
          echo "Browser spec files expected: $expected_specs"
          echo "Browser spec files represented: $listed_specs"
          if [[ "$total" -eq 0 || "$listed_specs" -ne "$expected_specs" ]]; then
            echo "Playwright's test list does not cover every browser spec file."
            exit 1
          fi

          # Put failures from the preceding exhaustive run first. If either
          # fails again, stop this audit immediately instead of spending time
          # running the remaining browser matrix.
          priority_list="$RUNNER_TEMP/blb-playwright-priority-list.txt"
          : > "$priority_list"
          for failed_title in \
            "shared sensitive-site classifier covers known providers without keyword false positives" \
            "payments URLs suppress selection injection and context-menu eligibility despite saved opt-ins"; do
            grep -F "› $failed_title" "$test_list" >> "$priority_list" || true
          done
          cat "$test_list" >> "$priority_list"
          awk '!seen[$0]++' "$priority_list" > "$test_list.ordered"
          mv "$test_list.ordered" "$test_list"
          priority_count=$(wc -l < "$priority_list" | tr -d ' ')
          echo "Prior-run failures prioritized: $priority_count"

          failures=0
          skipped=0
          passed=0
          executed=0
          current_test="$RUNNER_TEMP/blb-current-test.txt"
          current_log="$RUNNER_TEMP/blb-current-test.log"
          while IFS= read -r test_id; do
            executed=$((executed + 1))
            printf '[%s/%s] %s\n' "$executed" "$total" "$test_id"
            printf '%s\n' "$test_id" > "$current_test"
            command_status=0
            npx playwright test --test-list "$current_test" --max-failures=1 > "$current_log" 2>&1 || command_status=$?
            cat "$current_log"
            summary=$(grep 'Test summary:' "$current_log" | tail -n 1 || true)
            if [[ "$command_status" -eq 0 && "$summary" == *"1/1 completed"* && "$summary" == *"1 passed, 0 failed, 0 skipped"* ]]; then
              passed=$((passed + 1))
            else
              if [[ "$summary" == *"skipped"* && "$summary" != *"0 skipped"* ]]; then
                skipped=$((skipped + 1))
              fi
              failures=$((failures + 1))
              echo "FAILED OR NOT EXECUTED: $test_id"
              echo "SUMMARY: $summary"
              echo "Stopping browser audit immediately after the first failed or incomplete test."
              break
            fi
          done < "$test_list"

          echo "Browser test cases executed: $executed/$total"
          echo "Browser test cases passed: $passed"
          echo "Browser test cases failed or incomplete: $failures"
          echo "Browser test cases skipped: $skipped"
          if [[ "$executed" -ne "$total" || "$failures" -gt 0 || "$skipped" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload corpus A/B measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-corpus-ab-full-audit
          path: ${{ runner.temp }}/blb-performance.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Restore production manifest before package checks
        if: always()
        run: cp "$RUNNER_TEMP/blb-manifest-original.json" extension/manifest.json

      - name: Run KJV corpus and search-index integrity tests
        id: corpus
        continue-on-error: true
        run: node regression-suite/tests/kjv-corpus-integrity.mjs extension

      - name: Run package regression group
        id: package
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=package

      - name: Run resolver regression group
        id: resolver
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=resolver

      - name: Run selection regression group
        id: selection
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=selection

      - name: Run features regression group
        id: features
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=features

      - name: Report every audit result
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          SELECTOR: ${{ steps.selector.outcome }}
          SCRIPTS: ${{ steps.scripts.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          CORPUS: ${{ steps.corpus.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          RESOLVER: ${{ steps.resolver.outcome }}
          SELECTION: ${{ steps.selection.outcome }}
          FEATURES: ${{ steps.features.outcome }}
        run: |
          {
            echo "## Manual full-test audit"
            echo
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Build validation | $BUILD |"
            echo "| Selector contract tests | $SELECTOR |"
            echo "| Standalone JavaScript test scripts | $SCRIPTS |"
            echo "| Python unittest suite | $PYTHON |"
            echo "| KJV corpus integrity | $CORPUS |"
            echo "| All Playwright browser specs | $BROWSER |"
            echo "| Regression package | $PACKAGE |"
            echo "| Regression resolver | $RESOLVER |"
            echo "| Regression selection | $SELECTION |"
            echo "| Regression features | $FEATURES |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$BUILD" "$SELECTOR" "$SCRIPTS" "$PYTHON" "$CORPUS" "$BROWSER" "$PACKAGE" "$RESOLVER" "$SELECTION" "$FEATURES"; do
            if [[ "$result" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more audit suites failed; see the individual step logs above."
            exit 1
          fi