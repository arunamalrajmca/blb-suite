name: BLB Suite — Manual Full Test Audit
run-name: Full Test Audit — ${{ github.ref_name }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: full-test-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') }}
    name: Run every repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read manifest version
        id: version
        shell: bash
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Preserve production manifest for package checks
        run: cp extension/manifest.json "$RUNNER_TEMP/blb-manifest-original.json"

      - name: Grant test-only generic host access
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; for (const cs of (m.content_scripts||[])) cs.matches=[...(cs.matches||[]),'https://example.com/*','https://www.supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

      - name: Validate extension build and module contracts
        id: build
        continue-on-error: true
        run: node scripts/validate-build.js

      - name: Run browser selector decision tests
        id: selector
        continue-on-error: true
        run: node --test tests/selector/*.test.mjs

      - name: Run standalone JavaScript test scripts
        id: scripts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/test-*.js; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Set up Python and install test dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python test dependency
        run: python -m pip install Pillow

      - name: Run every Python unittest
        id: python
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Deliberately bypass select-browser-specs.mjs, changed-file routing,
      # group routing, and workflow-level spec filters. Invoke every browser
      # spec file separately so one failed spec cannot prevent later spec files
      # from running. Keep the repository's configured maxFailures: 1 intact;
      # explicit test.skip() conditions remain visible in each spec report.
      - name: Run every browser spec without CI selector filtering
        id: browser
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          BLB_PERF_OUTPUT: ${{ runner.temp }}/blb-performance.jsonl
        run: |
          : > "$BLB_PERF_OUTPUT"
          failures=0
          specs_run=0
          for spec in tests/browser/*.spec.js; do
            specs_run=$((specs_run + 1))
            echo "=== [$specs_run] Running complete spec file: $spec ==="
            if npx playwright test "$spec"; then
              echo "PASS: $spec"
            else
              echo "FAIL: $spec"
              failures=$((failures + 1))
            fi
          done
          echo "Browser spec files executed: $specs_run"
          echo "Browser spec files with failures: $failures"
          if [[ "$specs_run" -eq 0 || "$failures" -gt 0 ]]; then exit 1; fi

      - name: Restore production manifest before package checks
        if: always()
        run: cp "$RUNNER_TEMP/blb-manifest-original.json" extension/manifest.json

      - name: Run KJV corpus and search-index integrity tests
        id: corpus
        continue-on-error: true
        run: node regression-suite/tests/kjv-corpus-integrity.mjs extension

      - name: Run package regression group
        id: package
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=package

      - name: Run resolver regression group
        id: resolver
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=resolver

      - name: Run selection regression group
        id: selection
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=selection

      - name: Run features regression group
        id: features
        continue-on-error: true
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node regression-suite/tests/run-regression.mjs extension --group=features

      - name: Report every audit result
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          SELECTOR: ${{ steps.selector.outcome }}
          SCRIPTS: ${{ steps.scripts.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          CORPUS: ${{ steps.corpus.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          RESOLVER: ${{ steps.resolver.outcome }}
          SELECTION: ${{ steps.selection.outcome }}
          FEATURES: ${{ steps.features.outcome }}
        run: |
          {
            echo "## Manual full-test audit"
            echo
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Build validation | $BUILD |"
            echo "| Selector contract tests | $SELECTOR |"
            echo "| Standalone JavaScript test scripts | $SCRIPTS |"
            echo "| Python unittest suite | $PYTHON |"
            echo "| KJV corpus integrity | $CORPUS |"
            echo "| All Playwright browser specs | $BROWSER |"
            echo "| Regression package | $PACKAGE |"
            echo "| Regression resolver | $RESOLVER |"
            echo "| Regression selection | $SELECTION |"
            echo "| Regression features | $FEATURES |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$BUILD" "$SELECTOR" "$SCRIPTS" "$PYTHON" "$CORPUS" "$BROWSER" "$PACKAGE" "$RESOLVER" "$SELECTION" "$FEATURES"; do
            if [[ "$result" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more audit suites failed; see the individual step logs above."
            exit 1
          fi