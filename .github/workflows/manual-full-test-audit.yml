      - name: Validate all browser shard checkpoints
        id: browser
        if: ${{ success() && !cancelled() && steps.browser_prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNNER_TEMP + '/blb-browser-shard-checkpoints/browser-shards.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const bad = manifest.shards.filter(shard =>
            shard.status !== 'passed' || shard.exitCode !== 0 || shard.reportValid !== true ||
            shard.passedTests.length !== shard.tests.length
          );
          for (const shard of manifest.shards) {
            console.log(`Shard [${shard.index}/${manifest.shardCount}]: ${shard.status}, ${shard.passedTests.length}/${shard.tests.length} passed`);
          }
          if (bad.length) {
            console.error(`Browser audit incomplete: ${bad.length} shard(s) failed or remain unverified.`);
            process.exit(1);
          }
          console.log(`All ${manifest.shardCount} browser shards passed and were checkpointed.`);
          NODE
      - name: Upload reusable browser-audit checkpoint diagnostics
