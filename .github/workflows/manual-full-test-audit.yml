name: BLB Suite — Manual Full Test Audit
run-name: Full Test Audit — ${{ github.ref_name }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # Start the expensive full audit only when explicitly requested by
    # adding its label after all prerequisite checks have passed. A later
    # synchronize must not launch a full audit against an unqualified head.
    types: [labeled]

permissions:
  contents: read
  statuses: write

concurrency:
  group: full-test-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.action || 'dispatch' }}
  cancel-in-progress: true

jobs:
  full-test-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') }}
    name: Run every repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fingerprint committed audit inputs
        id: fingerprints
        run: node scripts/ci-checkpoint-fingerprints.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache npm download data
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install pinned AST audit dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts acorn@8.15.0 eslint-scope@8.4.0
      - name: Test reusable CI checkpoint and browser shard recovery
        run: |
          node --test scripts/ci-section-checkpoint.test.mjs scripts/ci-checkpoint-fingerprints.test.mjs scripts/run-checkpointed-playwright-audit.test.mjs

      - name: Verify repository-wide test inventory and ownership
        id: inventory
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: inventory
          cache_prefix: blb-ci-v1-full-audit-inventory-${{ steps.fingerprints.outputs.inventory }}
          restore_prefix: blb-ci-v1-full-audit-inventory-
          fingerprint: ${{ steps.fingerprints.outputs.inventory }}
          run: node scripts/test-suite-inventory.mjs
      - name: Run every AST reachability audit test and analysis
        id: ast
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: ast-audits
          cache_prefix: blb-ci-v1-full-audit-ast-audits-${{ steps.fingerprints.outputs.ast }}
          restore_prefix: blb-ci-v1-full-audit-ast-audits-
          fingerprint: ${{ steps.fingerprints.outputs.ast }}
          run: |
            set -euo pipefail
            for test_file in scripts/ast-*-audit.test.js; do
              echo "Running AST audit regression tests: $test_file"
              node --test "$test_file"
              audit_file="${test_file%.test.js}.js"
              if [[ -f "$audit_file" ]]; then
                echo "Running AST reachability analysis: $audit_file"
                node "$audit_file"
              fi
            done
            for audit_file in scripts/ast-*-audit.js; do
              [[ -f "$audit_file" ]] || continue
              test_file="${audit_file%.js}.test.js"
              if [[ ! -f "$test_file" ]]; then
                echo "Running analysis without a paired test file: $audit_file"
                node "$audit_file"
              fi
            done
            
                  # Compare the complete AST audit inventory, not only selected browser tests.
                  # The old serial loop remains the reference; bounded parallel execution must
                  # produce identical test outcomes and analysis reports on this same checkout.
      - name: Verify AST audit serial-parallel equivalence
        id: ast_concurrency
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: ast-concurrency
          cache_prefix: blb-ci-v1-full-audit-ast-concurrency-${{ steps.fingerprints.outputs.astConcurrency }}
          restore_prefix: blb-ci-v1-full-audit-ast-concurrency-
          fingerprint: ${{ steps.fingerprints.outputs.astConcurrency }}
          run: node scripts/verify-ast-audit-concurrency-equivalence.mjs --workers=4
      - name: Read manifest version
        id: version
        shell: bash
        run: echo "version=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Preserve production manifest for package checks
        run: cp extension/manifest.json "$RUNNER_TEMP/blb-manifest-original.json"

      - name: Grant test-only generic host access
        # Grant permissions only. Keep content_scripts.matches production-accurate
        # so the full audit exercises runtime registration and late injection.
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*','https://supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"

      - name: Validate extension build and module contracts
        id: build
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: build-validation
          cache_prefix: blb-ci-v1-full-audit-build-validation-${{ steps.fingerprints.outputs.build }}
          restore_prefix: blb-ci-v1-full-audit-build-validation-
          fingerprint: ${{ steps.fingerprints.outputs.build }}
          run: node scripts/validate-build.js
      - name: Run browser selector decision tests
        id: selector
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: selector-tests
          cache_prefix: blb-ci-v1-full-audit-selector-tests-${{ steps.fingerprints.outputs.selector }}
          restore_prefix: blb-ci-v1-full-audit-selector-tests-
          fingerprint: ${{ steps.fingerprints.outputs.selector }}
          run: node --test tests/selector/*.test.mjs
      - name: Run standalone JavaScript test scripts
        id: scripts
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: standalone-scripts
          cache_prefix: blb-ci-v1-full-audit-standalone-scripts-${{ steps.fingerprints.outputs.scripts }}
          restore_prefix: blb-ci-v1-full-audit-standalone-scripts-
          fingerprint: ${{ steps.fingerprints.outputs.scripts }}
          run: |
            set -euo pipefail
            # validate-build.js already executes the scripts in this manifest.
            node -e "for (const test of require('./scripts/validation-test-manifest.json')) console.log('scripts/' + test.script)" > "$RUNNER_TEMP/blb-build-validation-tests.txt"
            for test_file in scripts/test-*.js; do
              if grep -Fxq "$test_file" "$RUNNER_TEMP/blb-build-validation-tests.txt"; then
                echo "Already executed by build validation: $test_file"
                continue
              fi
              echo "Running $test_file"
              node "$test_file"
            done
      - name: Set up Python and install test dependency
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python test dependency
        run: python -m pip install Pillow

      - name: Run every Python unittest
        id: python
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: python-unittests
          cache_prefix: blb-ci-v1-full-audit-python-unittests-${{ steps.fingerprints.outputs.python }}
          restore_prefix: blb-ci-v1-full-audit-python-unittests-
          fingerprint: ${{ steps.fingerprints.outputs.python }}
          run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Recheck both historically failing cases in one Playwright invocation.
      # Separate workers retain per-test browser isolation while avoiding a second
      # Playwright startup. Assert the exact two-test inventory and full success.
      - name: Re-run prior full-audit failures independently
        id: isolated_browser_failures
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: isolated-browser-regressions
          cache_prefix: blb-ci-v1-full-audit-isolated-browser-regressions-${{ steps.fingerprints.outputs.isolatedBrowser }}
          restore_prefix: blb-ci-v1-full-audit-isolated-browser-regressions-
          fingerprint: ${{ steps.fingerprints.outputs.isolatedBrowser }}
          run: |
            set -euo pipefail
            rerun_log="$RUNNER_TEMP/blb-prior-audit-failures.log"
            rerun_status=0
            npx playwright test \
              tests/browser/extension-reference-actions.spec.js \
              tests/browser/service-worker-lifecycle.spec.js \
              --grep "Article verse cues resolve context outside Facebook|persistent registration failure keeps current and subsequent same-tab documents independently activatable" \
              --workers=2 --max-failures=1 --reporter=line 2>&1 | tee "$rerun_log" || rerun_status=$?
            
            # The line reporter emits concise output such as `2 passed (4.8s)`;
            # it omits zero-valued failed/skipped counts. Validate that summary
            # and confirm that each expected test title appeared exactly once.
            summary=$(grep -E '^[[:space:]]*2 passed([[:space:]]|$)' "$rerun_log" | tail -n 1 || true)
            article_count=$(grep -F -c 'Article verse cues resolve context outside Facebook' "$rerun_log" || true)
            lifecycle_count=$(grep -F -c 'persistent registration failure keeps current and subsequent same-tab documents independently activatable' "$rerun_log" || true)
            echo "Independent rerun summary: ${summary:-missing}"
            echo "Expected test title counts: article=$article_count lifecycle=$lifecycle_count"
            if [[ "$rerun_status" -ne 0 || -z "$summary" || "$article_count" -ne 1 || "$lifecycle_count" -ne 1 ]]; then
              echo "::error::Expected both prior failures to pass exactly once; Playwright exit=$rerun_status summary=${summary:-missing} titles=$article_count/$lifecycle_count."
              exit 1
            fi
      - name: Restore production manifest before package checks
        if: always()
        run: if [ -f "$RUNNER_TEMP/blb-manifest-original.json" ]; then cp "$RUNNER_TEMP/blb-manifest-original.json" extension/manifest.json; fi

      - name: Run KJV corpus and search-index integrity tests
        id: corpus
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: kjv-corpus-integrity
          cache_prefix: blb-ci-v1-full-audit-kjv-corpus-integrity-${{ steps.fingerprints.outputs.corpus }}
          restore_prefix: blb-ci-v1-full-audit-kjv-corpus-integrity-
          fingerprint: ${{ steps.fingerprints.outputs.corpus }}
          run: node regression-suite/tests/kjv-corpus-integrity.mjs extension
      - name: Run package regression group
        id: package
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: package-regression
          cache_prefix: blb-ci-v1-full-audit-package-regression-${{ steps.fingerprints.outputs.regression }}
          restore_prefix: blb-ci-v1-full-audit-package-regression-
          fingerprint: ${{ steps.fingerprints.outputs.regression }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=package
      - name: Run resolver regression group
        id: resolver
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: resolver-regression
          cache_prefix: blb-ci-v1-full-audit-resolver-regression-${{ steps.fingerprints.outputs.regression }}
          restore_prefix: blb-ci-v1-full-audit-resolver-regression-
          fingerprint: ${{ steps.fingerprints.outputs.regression }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=resolver
      - name: Run selection regression group
        id: selection
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: selection-regression
          cache_prefix: blb-ci-v1-full-audit-selection-regression-${{ steps.fingerprints.outputs.regression }}
          restore_prefix: blb-ci-v1-full-audit-selection-regression-
          fingerprint: ${{ steps.fingerprints.outputs.regression }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=selection
      - name: Run features regression group
        id: features
        uses: ./.github/actions/ci-section-checkpoint
        continue-on-error: true
        with:
          section: features-regression
          cache_prefix: blb-ci-v1-full-audit-features-regression-${{ steps.fingerprints.outputs.regression }}
          restore_prefix: blb-ci-v1-full-audit-features-regression-
          fingerprint: ${{ steps.fingerprints.outputs.regression }}
          run: BLB_EXPECTED_VERSION='${{ steps.version.outputs.version }}' node regression-suite/tests/run-regression.mjs extension --group=features
      - name: Gate full browser audit on all other suites
        id: browser_gate
        shell: bash
        env:
          INVENTORY: ${{ steps.inventory.outcome }}
          AST: ${{ steps.ast.outcome }}
          AST_CONCURRENCY: ${{ steps.ast_concurrency.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SELECTOR: ${{ steps.selector.outcome }}
          SCRIPTS: ${{ steps.scripts.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          ISOLATED_BROWSER_FAILURES: ${{ steps.isolated_browser_failures.outcome }}
          CORPUS: ${{ steps.corpus.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          RESOLVER: ${{ steps.resolver.outcome }}
          SELECTION: ${{ steps.selection.outcome }}
          FEATURES: ${{ steps.features.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for name in INVENTORY AST AST_CONCURRENCY BUILD SELECTOR SCRIPTS PYTHON ISOLATED_BROWSER_FAILURES CORPUS PACKAGE RESOLVER SELECTION FEATURES; do
            value="${!name}"
            echo "$name=$value"
            if [[ "$value" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Skipping the expensive full browser matrix because at least one other audit section failed or was skipped."
            exit 1
          fi
          echo "All non-browser audit sections passed; starting the full browser matrix."

      - name: Re-grant test-only generic host access for browser tests
        if: ${{ steps.browser_gate.outcome == 'success' }}
        run: node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*','https://www.supplyofgrace.com/*','https://supplyofgrace.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

      # Deliberately bypass select-browser-specs.mjs, changed-file routing,
      # group routing, and workflow-level spec filters. Collect Playwright's
      # complete test list, then execute it in eight resumable shards of four workers.
      # Each shard runs in its own step and is uploaded to an immutable cache key
      # immediately afterward. A later shard failure or job interruption therefore
      # leaves the newest cache containing every earlier shard checkpoint.
      - name: Prepare browser checkpoint directories
        if: ${{ steps.browser_gate.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/blb-ci-checkpoints/browser-matrix" "$RUNNER_TEMP/blb-browser-shard-checkpoints"
          touch "$RUNNER_TEMP/blb-ci-checkpoints/browser-matrix/blb-performance.jsonl"

      - name: Restore dedicated browser-shard checkpoint
        id: browser_shard_restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/blb-browser-shard-checkpoints
          key: blb-browser-shards-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ steps.fingerprints.outputs.browser }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-08
          restore-keys: |
            blb-browser-shards-v1-${{ runner.os }}-${{ runner.arch }}-node22-
      - name: Prepare complete browser test list and concurrency compatibility
        id: browser_prepare
        continue-on-error: true
        shell: bash
        run: |
            set -euo pipefail
            export BLB_CI_CHECKPOINT_DIR="$RUNNER_TEMP/blb-ci-checkpoints/browser-matrix"
            export BLB_CI_CHECKPOINT_SOURCE_SHA="${{ github.sha }}"
            export BLB_CI_CHECKPOINT_FINGERPRINT="${{ steps.fingerprints.outputs.browser }}"
            export BLB_EXPECTED_VERSION="${{ steps.version.outputs.version }}"
            export BLB_BROWSER_SHARD_CHECKPOINT_DIR="$RUNNER_TEMP/blb-browser-shard-checkpoints"
            export BLB_BROWSER_SHARD_DIAGNOSTICS_DIR="$RUNNER_TEMP/blb-browser-shard-diagnostics"
            export BLB_PERF_OUTPUT="$BLB_CI_CHECKPOINT_DIR/blb-performance.jsonl"
            export NO_COLOR=1 FORCE_COLOR=0
            mkdir -p "$BLB_CI_CHECKPOINT_DIR" "$(dirname "$BLB_PERF_OUTPUT")" "$BLB_BROWSER_SHARD_CHECKPOINT_DIR"
            touch "$BLB_PERF_OUTPUT"
            npm_version=$(npm --version 2>/dev/null || printf 'unavailable')
            python_version=$(python --version 2>/dev/null || printf 'unavailable')
            playwright_version=$(npx playwright --version 2>/dev/null || printf 'unavailable')
            image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
            environment_fingerprint=$(printf '%s' "${{ runner.os }}|${{ runner.arch }}|$image|$(node --version)|$npm_version|$python_version|$playwright_version" | sha256sum | cut -d' ' -f1)
            export BLB_CI_CHECKPOINT_ENVIRONMENT_FINGERPRINT="$environment_fingerprint"
            echo "environment_fingerprint=$environment_fingerprint" >> "$GITHUB_OUTPUT"
            list_output="$RUNNER_TEMP/blb-playwright-list.txt"
            test_list="$RUNNER_TEMP/blb-playwright-test-list.txt"
            if ! npx playwright test --list --reporter=list > "$list_output" 2>&1; then
              cat "$list_output"
              exit 1
            fi
            cat "$list_output"
            # --test-list expects the complete entry emitted by --list, including
            # project, spec location, suite path, and test title. A bare file:line:column
            # is not a test-list entry and silently selects zero tests.
            sed -nE 's/^[[:space:]]*(\[[^]]+\] › [^[:space:]]+\.spec\.js:[0-9]+:[0-9]+ › .*)$/\1/p' "$list_output" > "$test_list"
            expected_specs=$(find tests/browser -maxdepth 1 -type f -name '*.spec.js' | wc -l | tr -d ' ')
            listed_specs=$(sed -nE 's/^[[:space:]]*\[[^]]+\] › ([^[:space:]]+\.spec\.js):[0-9]+:[0-9]+ › .*/\1/p' "$test_list" | sort -u | wc -l | tr -d ' ')
            echo "Browser spec files expected before delegation: $expected_specs"
            echo "Browser spec files represented before delegation: $listed_specs"
            if [[ "$listed_specs" -ne "$expected_specs" ]]; then
              echo "Playwright's test list does not cover every browser spec file."
              exit 1
            fi
            
            # Physical Alt+B, both native prerender activation cases, and the
            # performance benchmark are delegated to their dedicated X11/benchmark workflows.
            alt_count=$(grep -F -c "› a real MV3 service-worker termination is recovered by the physical Alt+B browser shortcut" "$test_list" || true)
            prerender_self_count=$(grep -F -c "› native Chromium _self prerender activation initializes the activated document without tab replacement" "$test_list" || true)
            prerender_blank_count=$(grep -F -c "› native Chromium _blank prerender activation initializes the activated document without tab replacement" "$test_list" || true)
            performance_count=$(grep -F -c "› Show on BLB performance benchmark" "$test_list" || true)
            performance_batch_count=$(grep -F -c "› Interleaved baseline/candidate performance batch preserves isolated samples" "$test_list" || true)
            if [[ "$alt_count" -ne 1 || "$prerender_self_count" -ne 1 || "$prerender_blank_count" -ne 1 || "$performance_count" -ne 1 || "$performance_batch_count" -ne 1 ]]; then
              echo "::error::Expected one each of Alt+B, _self prerender, _blank prerender, original performance, and batched performance; found $alt_count/$prerender_self_count/$prerender_blank_count/$performance_count/$performance_batch_count."
              exit 1
            fi
            discovered_before_delegation=$(wc -l < "$test_list" | tr -d ' ')
            awk '
              index($0, "› a real MV3 service-worker termination is recovered by the physical Alt+B browser shortcut") == 0 &&
              index($0, "› native Chromium _self prerender activation initializes the activated document without tab replacement") == 0 &&
              index($0, "› native Chromium _blank prerender activation initializes the activated document without tab replacement") == 0 &&
              index($0, "› Show on BLB performance benchmark") == 0 &&
              index($0, "› Interleaved baseline/candidate performance batch preserves isolated samples") == 0
            ' "$test_list" > "$test_list.filtered"
            mv "$test_list.filtered" "$test_list"
            discovered_after_delegation=$(wc -l < "$test_list" | tr -d ' ')
            delegated=$((discovered_before_delegation - discovered_after_delegation))
            if [[ "$delegated" -ne 5 ]]; then
              echo "::error::Expected to delegate exactly 5 tests to dedicated workflows, found $delegated."
              exit 1
            fi
            total=$discovered_after_delegation
            echo "Delegated tests: $delegated (Alt+B + two prerender cases + original and batched performance benchmark cases)."
            echo "Browser test cases discovered after delegation: $total"
            if [[ "$total" -eq 0 ]]; then
              echo "No headless browser tests remain after delegation."
              exit 1
            fi
            
            # Compare the historical one-process-per-test serial mode with the new
            # one-process/four-worker mode on the same lifecycle-sensitive cases.
            # The complete browser matrix still runs afterward without exclusions.
            compatibility_list="$RUNNER_TEMP/blb-playwright-concurrency-compatibility.txt"
            : > "$compatibility_list"
            compatibility_titles=(
              "a real MV3 service-worker termination is recovered by the Alt+B command message"
              "Suite master opt-out removes both registered worlds for guarded source hosts and re-enable restores them"
              "repeated global master toggles disable and restore exactly one double-click listener"
              "reinjecting the current content bundle replaces a stale Show on BLB control and restores messaging"
            )
            compatibility_status=0
            for title in "${compatibility_titles[@]}"; do
              matches=$(grep -F "› $title" "$test_list" || true)
              match_count=$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')
              if [[ "$match_count" -ne 1 ]]; then
                echo "::error::Expected one concurrency compatibility test for '$title', found $match_count."
                compatibility_status=1
                continue
              fi
              printf '%s\n' "$matches" >> "$compatibility_list"
            done
            
            compatibility_count=$(wc -l < "$compatibility_list" | tr -d ' ')
            if [[ "$compatibility_count" -ne 4 ]]; then
              echo "::error::Expected exactly four concurrency compatibility tests, found $compatibility_count."
              compatibility_status=1
            else
              echo "Comparing legacy isolated and four-worker scheduling for $compatibility_count lifecycle-sensitive tests."
              legacy_status=0
              serial_index=0
              current_test="$RUNNER_TEMP/blb-concurrency-current-test.txt"
              current_log="$RUNNER_TEMP/blb-concurrency-legacy.log"
              while IFS= read -r test_id; do
                serial_index=$((serial_index + 1))
                echo "Legacy serial process [$serial_index/4]: $test_id"
                printf '%s\n' "$test_id" > "$current_test"
                command_status=0
                npx playwright test --test-list "$current_test" --max-failures=1 > "$current_log" 2>&1 || command_status=$?
                cat "$current_log"
                summary=$(grep 'Test summary:' "$current_log" | tail -n 1 || true)
                if [[ "$command_status" -ne 0 || "$summary" != *"1/1 completed"* || "$summary" != *"1 passed, 0 failed, 0 skipped"* ]]; then
                  echo "::error::Legacy isolated execution failed or did not complete exactly one test: $test_id"
                  legacy_status=1
                  break
                fi
              done < "$compatibility_list"
            
              parallel_status=0
              parallel_log="$RUNNER_TEMP/blb-concurrency-parallel.log"
              for parallel_round in 1 2 3; do
                echo "Four-worker compatibility repetition [$parallel_round/3]."
                round_status=0
                npx playwright test --test-list "$compatibility_list" --workers=4 --max-failures=1 > "$parallel_log" 2>&1 || round_status=$?
                cat "$parallel_log"
                parallel_summary=$(grep 'Test summary:' "$parallel_log" | tail -n 1 || true)
                if [[ "$round_status" -ne 0 || "$parallel_summary" != *"4/4 completed"* || "$parallel_summary" != *"4 passed, 0 failed, 0 skipped"* ]]; then
                  echo "::error::Four-worker compatibility repetition [$parallel_round/3] did not complete all four tests successfully."
                  parallel_status=1
                fi
              done
              if [[ "$legacy_status" -ne 0 || "$parallel_status" -ne 0 ]]; then
                compatibility_status=1
              else
                echo "Concurrency compatibility passed: 4/4 in legacy serial mode and 12/12 across three four-worker repetitions."
              fi
            fi
            
            # The prior known failures were rerun independently in the serial step above.
            # The focused-regressions workflow is suppressed when the full-audit label
            # is present, so this invocation owns every remaining browser test.
            # This avoids one Node/Playwright startup per browser test while keeping every
            # test case eligible to run even when another case fails.
            if [[ "$compatibility_status" -ne 0 ]]; then
