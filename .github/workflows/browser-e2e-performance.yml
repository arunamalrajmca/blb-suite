name: BLB Suite BROWSER E2E — PERFORMANCE
run-name: Performance — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
    # Run measured end-user performance qualification only when shipped
    # extension code or its production dependency manifest changes. Test,
    # CI, workflow, and developer-tooling changes alone are not performance
    # changes under the suite's end-user performance definition.
    paths:
      - 'extension/**'
      - '!extension/icons/**'
      - '!extension/store-assets/**'
      - '!extension/THIRD-PARTY-NOTICES.txt'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Measured performance qualification
    # The full audit delegates both performance specs to this measured benchmark.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-performance') || contains(github.event.pull_request.labels.*.name, 'ci-full-test-audit') || contains(github.event.pull_request.labels.*.name, 'ci-independent-fresh-performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
       
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache npm download data
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
       
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
       
        run: npx playwright install --with-deps chromium

      - name: Read manifest version
       
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fetch performance baseline
       
        env:
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
            # The range-resolver PR is based directly on current main.
            git fetch origin main --no-tags
            git worktree add "$RUNNER_TEMP/blb-baseline" origin/main
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Functional PRs are measured against the exact PR base commit.
            # This prevents unrelated drift since the approved release from
            # failing a PR that did not change those performance paths.
            git fetch origin "$PR_BASE_SHA" --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" "$PR_BASE_SHA"
          else
            # Pushes to main retain the approved release envelope comparison.
            git fetch origin tag v5.2.51.43 --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" v5.2.51.43
          fi

      - name: Grant test-only generic host access
       
        run: |
          node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
          node -e "const fs=require('fs'); const p='$RUNNER_TEMP/blb-baseline/extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"

      - name: Package main + 76 test ZIP
       
        run: |
          mkdir -p "$RUNNER_TEMP/blb-test-build"
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ZIP="$RUNNER_TEMP/blb-test-build/Blue-Letter-Bible-Suite-main-plus-76-${VERSION}.zip"
          cd extension
          zip -r "$ZIP" .
          cd ..
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
        
      - name: Benchmark baseline and candidate (interleaved, resumable)
        env:
          BLB_PERF_SCENARIOS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-independent-fresh-performance') && 'fresh' || '' }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: interleaved-performance-benchmark
          always_run: 'true'
          cache_prefix: blb-ci-v1-performance-interleaved-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            export BLB_EXPECTED_VERSION="${{ steps.version.outputs.version }}"
            export BLB_BASELINE_EXTENSION_PATH="$RUNNER_TEMP/blb-baseline/extension"
            export BLB_CANDIDATE_EXTENSION_PATH="$GITHUB_WORKSPACE/extension"
            export BLB_BASELINE_OUTPUT="$BLB_CI_CHECKPOINT_DIR/baseline-performance.jsonl"
            export BLB_CANDIDATE_OUTPUT="$BLB_CI_CHECKPOINT_DIR/candidate-performance.jsonl"
            export BLB_PERF_SAMPLES=11
            export BLB_PERF_TARGET="${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}"
            mkdir -p "$BLB_CI_CHECKPOINT_DIR"
            touch "$BLB_BASELINE_OUTPUT" "$BLB_CANDIDATE_OUTPUT"
            if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
              SCENARIOS="range-resolver selection fresh reuse"
              scenario_count=$(wc -w <<< "$SCENARIOS")
              total_samples=$((scenario_count * BLB_PERF_SAMPLES * 2))
              progress=0
              sample_exists() {
                local output_path="$1"
                local scenario_name="$2"
                local sample_number="$3"
                local variant_name="$4"
                node - "$output_path" "$scenario_name" "$sample_number" "$variant_name" <<'NODE'
            const fs = require('fs');
            const [file, scenario, sample, variant] = process.argv.slice(2);
            if (!fs.existsSync(file)) process.exit(1);
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            const records = lines.map((line, index) => {
              try { return JSON.parse(line); }
              catch { throw new Error('Malformed performance checkpoint at line ' + (index + 1)); }
            });
            const matches = records.filter(record => record.scenario === scenario &&
              String(record.sample) === sample && record.variant === variant);
            if (matches.length > 1) throw new Error('Duplicate performance checkpoint record');
            process.exit(matches.length === 1 ? 0 : 1);
            NODE
              }
              run_perf_sample() {
                local variant="$1"
                local extension_path="$2"
                local output_path="$3"
                progress=$((progress + 1))
                printf '\n[%d/%d] scenario=%s variant=%s sample=%d/%d\n' \
                  "$progress" "$total_samples" "$scenario" "$variant" "$sample" "$BLB_PERF_SAMPLES"
                local existing_status=0
                sample_exists "$output_path" "$scenario" "$sample" "$variant" || existing_status=$?
                if [[ "$existing_status" -eq 0 ]]; then
                  echo "Reusing passed performance sample: $scenario $variant $sample/$BLB_PERF_SAMPLES"
                  return
                fi
                if [[ "$existing_status" -ne 1 ]]; then
                  echo "::error::Performance sample checkpoint is malformed."
                  return "$existing_status"
                fi
                BLB_PERF_AGGREGATE_PROGRESS=1 \
                  BLB_EXTENSION_PATH="$extension_path" \
                  BLB_PERF_OUTPUT="$output_path" \
                  BLB_PERF_SCENARIO="$scenario" \
                  BLB_PERF_VARIANT="$variant" \
                  BLB_PERF_SAMPLE="$sample" \
                  npx playwright test tests/browser/performance.spec.js --workers=1
              }
              for scenario in $SCENARIOS; do
                for ((sample = 1; sample <= BLB_PERF_SAMPLES; sample++)); do
                  if (( sample % 2 == 1 )); then
                    run_perf_sample baseline "$BLB_BASELINE_EXTENSION_PATH" "$BLB_BASELINE_OUTPUT"
                    run_perf_sample candidate "$BLB_CANDIDATE_EXTENSION_PATH" "$BLB_CANDIDATE_OUTPUT"
                  else
                    run_perf_sample candidate "$BLB_CANDIDATE_EXTENSION_PATH" "$BLB_CANDIDATE_OUTPUT"
                    run_perf_sample baseline "$BLB_BASELINE_EXTENSION_PATH" "$BLB_BASELINE_OUTPUT"
                  fi
                done
              done
            else
              npx playwright test tests/browser/performance-batch.spec.js --workers=1
            fi


      - name: Run the original single-case Show on BLB performance benchmark
        if: ${{ !startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver') }}
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: original-show-on-blb-benchmark
          cache_prefix: blb-ci-v1-performance-original-show-on-blb-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            export BLB_PERF_OUTPUT="$BLB_CI_CHECKPOINT_DIR/original-performance-smoke.jsonl"
            touch "$BLB_PERF_OUTPUT"
            npx playwright test tests/browser/performance.spec.js --workers=1
            test -s "$BLB_PERF_OUTPUT"
      - name: Restore cached performance measurements for qualification
        run: |
          mkdir -p "$RUNNER_TEMP/blb-test-build"
          cp "$RUNNER_TEMP"/blb-ci-checkpoints/interleaved-performance-benchmark/baseline-performance.jsonl "$RUNNER_TEMP/baseline-performance.jsonl"
          cp "$RUNNER_TEMP"/blb-ci-checkpoints/interleaved-performance-benchmark/candidate-performance.jsonl "$RUNNER_TEMP/candidate-performance.jsonl"
          if [[ -f "$RUNNER_TEMP/blb-ci-checkpoints/original-show-on-blb-benchmark/original-performance-smoke.jsonl" ]]; then
            cp "$RUNNER_TEMP/blb-ci-checkpoints/original-show-on-blb-benchmark/original-performance-smoke.jsonl" "$RUNNER_TEMP/original-performance-smoke.jsonl"
          fi

      - name: Require measured performance qualification
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: performance-qualification
          cache_prefix: blb-ci-v1-performance-qualification-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            export BLB_PERF_MIN_TARGETED_IMPROVEMENT=0.03
            export BLB_PERF_MAX_SELECTION_REGRESSION=0.10
            export BLB_PERF_REQUIRE_IMPROVEMENT=${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')) && '1' || '0' }}
            export BLB_PERF_MIN_PARAGRAPH_TWO_TAB_IMPROVEMENT=0.50
            export BLB_PERF_MIN_PARAGRAPH_FIRST_TAB_IMPROVEMENT=0.50
            export BLB_PERF_MIN_PARAGRAPH_SECOND_TAB_IMPROVEMENT=0.50
            export BLB_PERF_MAX_PARAGRAPH_REGRESSION=0.10
            export BLB_PERF_MAX_PARAGRAPH_FIRST_TAB_REGRESSION=0.10
            export BLB_PERF_MAX_PARAGRAPH_SECOND_TAB_REGRESSION=0.10
            export BLB_PERF_MAX_FRESH_REGRESSION=0.10
            export BLB_PERF_MIN_RANGE_RESOLVER_IMPROVEMENT=0.50
            export BLB_PERF_TARGET=${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
            export BLB_PERF_FRESH_ONLY=${{ contains(github.event.pull_request.labels.*.name, 'ci-independent-fresh-performance') && '1' || '0' }}
            node scripts/compare-performance.mjs "$RUNNER_TEMP/baseline-performance.jsonl" "$RUNNER_TEMP/candidate-performance.jsonl" | tee "$RUNNER_TEMP/performance-report.md"
      - name: Upload resumable performance sample checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-performance-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blb-ci-checkpoints/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-browser-e2e-performance
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/baseline-performance.jsonl
            ${{ runner.temp }}/candidate-performance.jsonl
            ${{ runner.temp }}/original-performance-smoke.jsonl
            ${{ runner.temp }}/performance-report.md
            ${{ runner.temp }}/blb-test-build/*.zip
            ${{ runner.temp }}/blb-test-build/*.sha256
          if-no-files-found: ignore
          retention-days: 14


  corpus-lazy-load-ab:
    name: KJV corpus lazy-load A/B qualification
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache npm download data
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify delegated browser test ownership inventory
        run: node scripts/test-suite-inventory.mjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run resumable 15-pair corpus cold-start A/B benchmark
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: corpus-lazy-load-ab
          always_run: 'true'
          cache_prefix: blb-ci-v1-performance-corpus-ab-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/kjv-corpus-lazy-loading.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/kjv-corpus-lazy-loading.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            export BLB_PERF_OUTPUT="$BLB_CI_CHECKPOINT_DIR/blb-corpus-ab-results.jsonl"
            npx playwright test tests/browser/kjv-corpus-lazy-loading.spec.js --grep "interleaved 15-pair cold-start and first-corpus-use A/B against current main" --workers=1 --reporter=line
            test -s "$BLB_PERF_OUTPUT"
            echo "## KJV corpus lazy-load A/B results" >> "$GITHUB_STEP_SUMMARY"
            printf '\x60\x60\x60json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$BLB_PERF_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\x60\x60\x60\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Run focused lazy-loading regression tests
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: corpus-lazy-load-regressions
          cache_prefix: blb-ci-v1-performance-corpus-regressions-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/kjv-corpus-lazy-loading.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/kjv-corpus-lazy-loading.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: npx playwright test tests/browser/kjv-corpus-lazy-loading.spec.js --grep-invert "interleaved 15-pair cold-start and first-corpus-use A/B against current main" --workers=1 --reporter=line
      - name: Upload corpus A/B measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blb-kjv-corpus-lazy-load-ab
          path: ${{ runner.temp }}/blb-ci-checkpoints/corpus-lazy-load-ab/blb-corpus-ab-results.jsonl
          if-no-files-found: warn
          retention-days: 14

  observer-ab:
    name: Interleaved selection handoff with observer on/off
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 234 }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare matched observer-on and observer-off builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observer-on" "$RUNNER_TEMP/observer-off"
          cp -a extension/. "$RUNNER_TEMP/observer-on/"
          cp -a extension/. "$RUNNER_TEMP/observer-off/"
          node <<'NODE'
          const fs = require('fs');
          for (const dir of [process.env.RUNNER_TEMP + '/observer-on', process.env.RUNNER_TEMP + '/observer-off']) {
            const path = dir + '/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.host_permissions = [...new Set([...(manifest.host_permissions || []), 'https://example.com/*'])];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          }
          const path = process.env.RUNNER_TEMP + '/observer-off/content.js';
          const source = fs.readFileSync(path, 'utf8');
          const needle = 'if (!pageButtonDomObserver) {';
          if (source.split(needle).length !== 2) throw new Error('Expected exactly one observer construction guard');
          fs.writeFileSync(path, source.replace(needle, 'if (false && !pageButtonDomObserver) {'));
          NODE
          grep -n "false && !pageButtonDomObserver" "$RUNNER_TEMP/observer-off/content.js"
      - name: Interleaved A/B benchmark with per-sample recovery
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: observer-ab-benchmark
          always_run: 'true'
          cache_prefix: blb-ci-v1-performance-observer-ab-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/performance.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/performance.spec.js', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/browser-e2e-performance.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: |
            set -euo pipefail
            ON="$BLB_CI_CHECKPOINT_DIR/observer-on.jsonl"
            OFF="$BLB_CI_CHECKPOINT_DIR/observer-off.jsonl"
            mkdir -p "$BLB_CI_CHECKPOINT_DIR"
            touch "$ON" "$OFF"
            sample_exists() {
              local output_path="$1"
              local variant="$2"
              local sample="$3"
              node - "$output_path" "$variant" "$sample" <<'NODE'
            const fs = require('fs');
            const [file, variant, sample] = process.argv.slice(2);
            if (!fs.existsSync(file)) process.exit(1);
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            let records;
            try { records = lines.map(line => JSON.parse(line)); }
            catch (error) { console.error('Malformed observer A/B checkpoint: ' + error.message); process.exit(2); }
            const matches = records.filter(record => record.scenario === 'selection' &&
              record.variant === variant && String(record.sample) === sample);
            if (matches.length > 1) { console.error('Duplicate observer A/B sample'); process.exit(2); }
            process.exit(matches.length === 1 ? 0 : 1);
            NODE
            }
            run_sample() {
              local variant="$1"
              local extension_path="$2"
              local output_path="$3"
              local status=0
              sample_exists "$output_path" "$variant" "$sample" || status=$?
              if [[ "$status" -eq 0 ]]; then
                echo "Reusing observer A/B sample [$sample/15] $variant."
                return
              fi
              if [[ "$status" -ne 1 ]]; then
                echo "::error::Observer A/B checkpoint is malformed."
                return "$status"
              fi
              BLB_EXTENSION_PATH="$extension_path" \
                BLB_PERF_OUTPUT="$output_path" \
                BLB_PERF_SCENARIO=selection \
                BLB_PERF_VARIANT="$variant" \
                BLB_PERF_SAMPLE="$sample" \
                npx playwright test tests/browser/performance.spec.js --workers=1
            }
            for ((sample=1; sample<=15; sample++)); do
              printf '\n[%d/30] observer A/B pair sample=%d/15\n' "$((sample * 2 - 1))" "$sample"
              if (( sample % 2 == 1 )); then
                run_sample observer-on "$RUNNER_TEMP/observer-on" "$ON"
                run_sample observer-off "$RUNNER_TEMP/observer-off" "$OFF"
              else
                run_sample observer-off "$RUNNER_TEMP/observer-off" "$OFF"
                run_sample observer-on "$RUNNER_TEMP/observer-on" "$ON"
              fi
            done
            node - "$ON" "$OFF" <<'NODE'
            const fs = require('fs');
            const median = values => [...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
            const read = (file, variant) => {
              const records = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
              records.sort((a,b)=>a.sample-b.sample);
              if (records.length !== 15 || records.some((record,index) =>
                record.variant !== variant || record.scenario !== 'selection' ||
                record.sample !== index + 1 || !Number.isFinite(record.handoffMs))) {
                throw new Error('Invalid or incomplete observer A/B samples for ' + variant);
              }
              return records;
            };
            const on = read(process.argv[2], 'observer-on');
            const off = read(process.argv[3], 'observer-off');
            const paired = on.map((record,index)=>(record.handoffMs-off[index].handoffMs)/off[index].handoffMs*100);
            console.log('Observer enabled samples (ms): ' + on.map(record=>record.handoffMs).join(', '));
            console.log('Observer disabled samples (ms): ' + off.map(record=>record.handoffMs).join(', '));
            console.log('Observer enabled median: ' + median(on.map(record=>record.handoffMs)) + ' ms');
            console.log('Observer disabled median: ' + median(off.map(record=>record.handoffMs)) + ' ms');
            console.log('Paired median change with observer enabled: ' + median(paired.map(value=>Math.round(value*10)/10)).toFixed(1) + '%');
            NODE

      - name: Upload A/B samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dom-observer-ab-samples
          path: |
            ${{ runner.temp }}/blb-ci-checkpoints/observer-ab-benchmark/observer-on.jsonl
            ${{ runner.temp }}/blb-ci-checkpoints/observer-ab-benchmark/observer-off.jsonl
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
