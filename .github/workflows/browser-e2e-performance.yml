name: BLB Suite BROWSER E2E — PERFORMANCE
run-name: Performance — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  performance:
    name: Measured performance qualification
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
       
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
       
        run: npm install

      - name: Install Playwright Chromium
       
        run: npx playwright install --with-deps chromium

      - name: Read manifest version
       
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fetch performance baseline
       
        env:
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
            # The range-resolver PR is based directly on current main.
            git fetch origin main --no-tags
            git worktree add "$RUNNER_TEMP/blb-baseline" origin/main
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Functional PRs are measured against the exact PR base commit.
            # This prevents unrelated drift since the approved release from
            # failing a PR that did not change those performance paths.
            git fetch origin "$PR_BASE_SHA" --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" "$PR_BASE_SHA"
          else
            # Pushes to main retain the approved release envelope comparison.
            git fetch origin tag v5.2.51.43 --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" v5.2.51.43
          fi

      - name: Grant test-only generic host access
       
        run: |
          node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
          node -e "const fs=require('fs'); const p='$RUNNER_TEMP/blb-baseline/extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

      - name: Package main + 76 test ZIP
       
        run: |
          mkdir -p "$RUNNER_TEMP/blb-test-build"
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ZIP="$RUNNER_TEMP/blb-test-build/Blue-Letter-Bible-Suite-main-plus-76-${VERSION}.zip"
          cd extension
          zip -r "$ZIP" .
          cd ..
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
        
      - name: Benchmark baseline and candidate (interleaved)
       
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          BLB_BASELINE_EXTENSION_PATH: ${{ runner.temp }}/blb-baseline/extension
          BLB_CANDIDATE_EXTENSION_PATH: ${{ github.workspace }}/extension
          BLB_BASELINE_OUTPUT: ${{ runner.temp }}/baseline-performance.jsonl
          BLB_CANDIDATE_OUTPUT: ${{ runner.temp }}/candidate-performance.jsonl
          BLB_PERF_SAMPLES: 11
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
        run: |
          : > "$BLB_BASELINE_OUTPUT"
          : > "$BLB_CANDIDATE_OUTPUT"
          if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
            SCENARIOS="range-resolver selection fresh reuse"
          else
            SCENARIOS="paragraph-classify paragraph-two-tab selection fresh reuse"
          fi
          # Reuse the Playwright process/browser across all samples for each
          # scenario. Each --repeat-each repetition still gets a fresh test
          # context, so the measured sample isolation is unchanged. This reduces
          # 110 separate CLI launches (5 scenarios x 11 samples x 2 variants)
          # to 10 launches (5 scenarios x 2 variants) without changing the
          # scenarios, sample count, timing boundaries, or comparison gate.
          for scenario in $SCENARIOS; do
            BLB_EXTENSION_PATH="$BLB_BASELINE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_BASELINE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=baseline npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each="$BLB_PERF_SAMPLES"
            BLB_EXTENSION_PATH="$BLB_CANDIDATE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_CANDIDATE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=candidate npx playwright test tests/browser/performance.spec.js --workers=1 --repeat-each="$BLB_PERF_SAMPLES"
          done

      - name: Require measured performance qualification
       
        env:
          BLB_PERF_MIN_TARGETED_IMPROVEMENT: 0.03
          BLB_PERF_MAX_SELECTION_REGRESSION: 0.10
          BLB_PERF_REQUIRE_IMPROVEMENT: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')) && '1' || '0' }}
          BLB_PERF_MIN_PARAGRAPH_TWO_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_FIRST_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_SECOND_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MAX_PARAGRAPH_REGRESSION: 0.10
          BLB_PERF_MAX_PARAGRAPH_FIRST_TAB_REGRESSION: 0.10
          BLB_PERF_MAX_PARAGRAPH_SECOND_TAB_REGRESSION: 0.10
          BLB_PERF_MAX_FRESH_REGRESSION: 0.10
          BLB_PERF_MIN_RANGE_RESOLVER_IMPROVEMENT: 0.50
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
        run: |
          set -o pipefail
          node scripts/compare-performance.mjs "$RUNNER_TEMP/baseline-performance.jsonl" "$RUNNER_TEMP/candidate-performance.jsonl" | tee "$RUNNER_TEMP/performance-report.md"

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-browser-e2e-performance
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/baseline-performance.jsonl
            ${{ runner.temp }}/candidate-performance.jsonl
            ${{ runner.temp }}/performance-report.md
            ${{ runner.temp }}/blb-test-build/*.zip
            ${{ runner.temp }}/blb-test-build/*.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish