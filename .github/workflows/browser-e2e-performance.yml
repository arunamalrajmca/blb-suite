name: BLB Suite BROWSER E2E — PERFORMANCE
run-name: Performance — PR #${{ github.event.pull_request.number || 'main' }} — Run ${{ github.run_number }} — Attempt ${{ github.run_attempt }}

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Measured performance qualification
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-run-all') || contains(github.event.pull_request.labels.*.name, 'ci-run-performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ⏱ Workflow ETA — start
        uses: $/.github/actions/workflow-eta
        with:
          phase: start
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
       
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
       
        run: npm install

      - name: Install Playwright Chromium
       
        run: npx playwright install --with-deps chromium

      - name: Read manifest version
       
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fetch performance baseline
       
        env:
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
            # The range-resolver PR is based directly on current main.
            git fetch origin main --no-tags
            git worktree add "$RUNNER_TEMP/blb-baseline" origin/main
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Functional PRs are measured against the exact PR base commit.
            # This prevents unrelated drift since the approved release from
            # failing a PR that did not change those performance paths.
            git fetch origin "$PR_BASE_SHA" --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" "$PR_BASE_SHA"
          else
            # Pushes to main retain the approved release envelope comparison.
            git fetch origin tag v5.2.51.43 --depth=1
            git worktree add "$RUNNER_TEMP/blb-baseline" v5.2.51.43
          fi

      - name: Grant test-only generic host access
       
        run: |
          node -e "const fs=require('fs'); const p='extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
          node -e "const fs=require('fs'); const p='$RUNNER_TEMP/blb-baseline/extension/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=[...(m.host_permissions||[]),'https://example.com/*']; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"

      - name: Package main + 76 test ZIP
       
        run: |
          mkdir -p "$RUNNER_TEMP/blb-test-build"
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ZIP="$RUNNER_TEMP/blb-test-build/Blue-Letter-Bible-Suite-main-plus-76-${VERSION}.zip"
          cd extension
          zip -r "$ZIP" .
          cd ..
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
        
      - name: Benchmark baseline and candidate (interleaved)
       
        env:
          BLB_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          BLB_BASELINE_EXTENSION_PATH: ${{ runner.temp }}/blb-baseline/extension
          BLB_CANDIDATE_EXTENSION_PATH: ${{ github.workspace }}/extension
          BLB_BASELINE_OUTPUT: ${{ runner.temp }}/baseline-performance.jsonl
          BLB_CANDIDATE_OUTPUT: ${{ runner.temp }}/candidate-performance.jsonl
          BLB_PERF_SAMPLES: 11
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
        run: |
          : > "$BLB_BASELINE_OUTPUT"
          : > "$BLB_CANDIDATE_OUTPUT"
          if [[ "$BLB_PERF_TARGET" == "kjv-range-resolver" ]]; then
            SCENARIOS="range-resolver selection fresh reuse"
          else
            SCENARIOS="paragraph-classify paragraph-two-tab selection fresh reuse"
          fi
          # Alternate baseline/candidate for each individual sample so runner
          # load, thermal drift, and browser warm-up cannot affect one entire
          # variant block. Reverse the order on even samples to counterbalance
          # first-run/startup effects. Each invocation runs one fresh test
          # context; JSONL files preserve each variant's sample order for paired
          # comparison. This intentionally uses 110 small invocations rather
          # than batching all 11 baseline samples before all 11 candidate ones.
          for scenario in $SCENARIOS; do
            for ((sample = 1; sample <= BLB_PERF_SAMPLES; sample++)); do
              if (( sample % 2 == 1 )); then
                BLB_EXTENSION_PATH="$BLB_BASELINE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_BASELINE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=baseline npx playwright test tests/browser/performance.spec.js --workers=1
                BLB_EXTENSION_PATH="$BLB_CANDIDATE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_CANDIDATE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=candidate npx playwright test tests/browser/performance.spec.js --workers=1
              else
                BLB_EXTENSION_PATH="$BLB_CANDIDATE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_CANDIDATE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=candidate npx playwright test tests/browser/performance.spec.js --workers=1
                BLB_EXTENSION_PATH="$BLB_BASELINE_EXTENSION_PATH" BLB_PERF_OUTPUT="$BLB_BASELINE_OUTPUT" BLB_PERF_SCENARIO="$scenario" BLB_PERF_VARIANT=baseline npx playwright test tests/browser/performance.spec.js --workers=1
              fi
            done
          done

      - name: Require measured performance qualification
       
        env:
          BLB_PERF_MIN_TARGETED_IMPROVEMENT: 0.03
          BLB_PERF_MAX_SELECTION_REGRESSION: 0.10
          BLB_PERF_REQUIRE_IMPROVEMENT: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Performance')) && '1' || '0' }}
          BLB_PERF_MIN_PARAGRAPH_TWO_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_FIRST_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MIN_PARAGRAPH_SECOND_TAB_IMPROVEMENT: 0.50
          BLB_PERF_MAX_PARAGRAPH_REGRESSION: 0.10
          BLB_PERF_MAX_PARAGRAPH_FIRST_TAB_REGRESSION: 0.10
          BLB_PERF_MAX_PARAGRAPH_SECOND_TAB_REGRESSION: 0.10
          BLB_PERF_MAX_FRESH_REGRESSION: 0.10
          BLB_PERF_MIN_RANGE_RESOLVER_IMPROVEMENT: 0.50
          BLB_PERF_TARGET: ${{ (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Optimize KJV verse-range resolver')) && 'kjv-range-resolver' || '' }}
        run: |
          set -o pipefail
          node scripts/compare-performance.mjs "$RUNNER_TEMP/baseline-performance.jsonl" "$RUNNER_TEMP/candidate-performance.jsonl" | tee "$RUNNER_TEMP/performance-report.md"

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blb-browser-e2e-performance
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/baseline-performance.jsonl
            ${{ runner.temp }}/candidate-performance.jsonl
            ${{ runner.temp }}/performance-report.md
            ${{ runner.temp }}/blb-test-build/*.zip
            ${{ runner.temp }}/blb-test-build/*.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: ⏱ Workflow ETA — finish
        if: ${{ always() }}
        uses: $/.github/actions/workflow-eta
        with:
          phase: finish

  observer-ab:
    name: Interleaved selection handoff with observer on/off
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 234 }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare matched observer-on and observer-off builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observer-on" "$RUNNER_TEMP/observer-off"
          cp -a extension/. "$RUNNER_TEMP/observer-on/"
          cp -a extension/. "$RUNNER_TEMP/observer-off/"
          node <<'NODE'
          const fs = require('fs');
          for (const dir of [process.env.RUNNER_TEMP + '/observer-on', process.env.RUNNER_TEMP + '/observer-off']) {
            const path = dir + '/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.host_permissions = [...new Set([...(manifest.host_permissions || []), 'https://example.com/*'])];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          }
          const path = process.env.RUNNER_TEMP + '/observer-off/content.js';
          const source = fs.readFileSync(path, 'utf8');
          const needle = 'if (!pageButtonDomObserver) {';
          if (source.split(needle).length !== 2) throw new Error('Expected exactly one observer construction guard');
          fs.writeFileSync(path, source.replace(needle, 'if (false && !pageButtonDomObserver) {'));
          NODE
          grep -n "false && !pageButtonDomObserver" "$RUNNER_TEMP/observer-off/content.js"
      - name: Interleaved A/B benchmark
        shell: bash
        env:
          BLB_PERF_SAMPLES: 15
        run: |
          set -euo pipefail
          ON="$RUNNER_TEMP/observer-on"
          OFF="$RUNNER_TEMP/observer-off"
          ON_OUT="$RUNNER_TEMP/observer-on.jsonl"
          OFF_OUT="$RUNNER_TEMP/observer-off.jsonl"
          : > "$ON_OUT"
          : > "$OFF_OUT"
          for ((sample=1; sample<=BLB_PERF_SAMPLES; sample++)); do
            if (( sample % 2 == 1 )); then
              BLB_EXTENSION_PATH="$ON" BLB_PERF_OUTPUT="$ON_OUT" BLB_PERF_SCENARIO=selection npx playwright test tests/browser/performance.spec.js --workers=1
              BLB_EXTENSION_PATH="$OFF" BLB_PERF_OUTPUT="$OFF_OUT" BLB_PERF_SCENARIO=selection npx playwright test tests/browser/performance.spec.js --workers=1
            else
              BLB_EXTENSION_PATH="$OFF" BLB_PERF_OUTPUT="$OFF_OUT" BLB_PERF_SCENARIO=selection npx playwright test tests/browser/performance.spec.js --workers=1
              BLB_EXTENSION_PATH="$ON" BLB_PERF_OUTPUT="$ON_OUT" BLB_PERF_SCENARIO=selection npx playwright test tests/browser/performance.spec.js --workers=1
            fi
          done
          node <<'NODE'
          const fs = require('fs');
          const median = values => [...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
          const read = path => fs.readFileSync(path,'utf8').trim().split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line).handoffMs);
          const on = read(process.env.RUNNER_TEMP + '/observer-on.jsonl');
          const off = read(process.env.RUNNER_TEMP + '/observer-off.jsonl');
          if (on.length !== off.length || on.length < 10) throw new Error('Missing or mismatched A/B samples');
          const paired = on.map((v,i)=>(v-off[i])/off[i]*100);
          console.log('Observer enabled samples (ms): ' + on.join(', '));
          console.log('Observer disabled samples (ms): ' + off.join(', '));
          console.log('Observer enabled median: ' + median(on) + ' ms');
          console.log('Observer disabled median: ' + median(off) + ' ms');
          console.log('Paired median change with observer enabled: ' + median(paired.map(v=>Math.round(v*10)/10)).toFixed(1) + '%');
          NODE
      - name: Upload A/B samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-observer-ab-samples
          path: |
            ${{ runner.temp }}/observer-on.jsonl
            ${{ runner.temp }}/observer-off.jsonl
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
