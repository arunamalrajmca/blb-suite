name: Experimental Master-Toggle Registration Diagnostics
run-name: Master-Toggle Registration Diagnostics — ${{ github.ref_name }} — Run ${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: master-toggle-registration-diagnostics-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.action || 'dispatch' }}
  cancel-in-progress: true

jobs:
  reproduce-registration-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci-master-toggle-registration-diagnostics') && (github.event.action != 'labeled' || github.event.label.name == 'ci-master-toggle-registration-diagnostics')) }}
    name: Reproduce master OFF-to-ON registration recovery with four workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Test resumable concurrent Playwright repeat-batch runner
        run: node --test scripts/run-checkpointed-playwright-repeats.test.mjs


      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic stale-activation regression
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: deterministic-stale-activation
          always_run: 'true'
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cache_prefix: blb-ci-v1-registration-diagnostics-deterministic-stale-activation-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/run-checkpointed-playwright-repeats.mjs 'tests/browser/site-registration-opt-out-race.spec.js' 'master OFF-to-ON recovery repairs registrations' 3 1 1 1
      - name: Run repeated OFF-to-ON registration recovery under four-worker contention
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: four-worker-registration-contention
          always_run: 'true'
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cache_prefix: blb-ci-v1-registration-diagnostics-four-worker-registration-contention-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/run-checkpointed-playwright-repeats.mjs 'tests/browser/source-page-button-redirect-separation.spec.js' 'Suite master opt-out removes both registered worlds' 24 4 4 1
      - name: Stress the persistent-registration failure fallback exposed by the full concurrency comparison
        uses: ./.github/actions/ci-section-checkpoint
        with:
          section: persistent-registration-fallback
          always_run: 'true'
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cache_prefix: blb-ci-v1-registration-diagnostics-persistent-registration-fallback-${{ github.sha }}-${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          fingerprint: ${{ hashFiles('extension/**', 'tests/browser/site-registration-opt-out-race.spec.js', 'tests/browser/source-page-button-redirect-separation.spec.js', 'tests/browser/optional-host-permission-lifecycle.spec.js', 'scripts/run-checkpointed-playwright-repeats.mjs', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/experimental-master-toggle-registration-diagnostics.yml', '.github/actions/ci-section-checkpoint/action.yml') }}
          run: node scripts/run-checkpointed-playwright-repeats.mjs 'tests/browser/optional-host-permission-lifecycle.spec.js' 'current-tab activation falls back when persistent content-script registration fails' 24 4 4 1
      - name: Upload resumable registration diagnostic checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: master-toggle-repeat-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blb-ci-checkpoints/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload registration traces and Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: master-toggle-registration-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/master-toggle-diagnostics
          if-no-files-found: warn
          retention-days: 30
