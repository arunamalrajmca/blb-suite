name: Post-685 browser startup profile

on:
  push:
    branches: [perf/profile-startup-after-685]
    paths:
      - '.github/workflows/post-685-browser-startup-profile.yml'
      - 'tests/browser/fixtures.js'
      - 'tests/browser/extension.spec.js'

permissions:
  contents: read

concurrency:
  group: post-685-browser-startup-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile merged-main browser startup and reference coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLB_PROFILE_BROWSER_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run three profiled repetitions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/browser-profile"
          echo "Profile commit: $GITHUB_SHA" | tee "$RUNNER_TEMP/browser-profile/profile.log"
          START_MS="$(node -p 'Date.now()')"
          npx playwright test tests/browser/extension.spec.js \
            --grep 'Double-click generic reference grammar — exhaustive token coverage — NT' \
            --workers=1 --repeat-each=3 --reporter=line 2>&1 | tee -a "$RUNNER_TEMP/browser-profile/profile.log"
          END_MS="$(node -p 'Date.now()')"
          echo "Profile process wall time: $((END_MS - START_MS))ms" | tee -a "$RUNNER_TEMP/browser-profile/profile.log"
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: post-685-browser-startup-profile
          path: ${{ runner.temp }}/browser-profile/profile.log
          if-no-files-found: warn
          retention-days: 14
