name: Reusable CI section checkpoint
description: Restore a fingerprinted section checkpoint, skip only a fully validated pass, and preserve partial state after failures.
inputs:
  section:
    description: Stable unique section identifier within the workflow.
    required: true
  cache_prefix:
    description: Fingerprint-scoped cache prefix; include the workflow and all relevant source/test inputs.
    required: true
  restore_prefix:
    description: Stable legacy-compatible prefix used to restore checkpoints from earlier commits.
    required: false
    default: ''
  fingerprint:
    description: Exact source/test-input fingerprint; the action records the runner and toolchain environment separately.
    required: true
  run:
    description: Shell command to execute when no compatible completed checkpoint exists.
    required: true
  source_sha:
    description: Exact checked-out source commit; defaults to the workflow SHA.
    required: false
  always_run:
    description: Execute the section runner even after restoring a complete marker so it can validate and reuse internal partial checkpoints.
    required: false
    default: 'false'
  recovery:
    description: Enable cross-run checkpoint restore/save. Disable for workflows or sections that should always execute directly.
    required: false
    default: 'true'
outputs:
  reused:
    description: True when a compatible completed section checkpoint was restored.
    value: ${{ steps.check.outputs.complete }}
runs:
  using: composite
  steps:
    - name: Prepare section checkpoint directory
      if: ${{ inputs.recovery == 'true' }}
      shell: bash
      env:
        SECTION: ${{ inputs.section }}
      run: |
        set -euo pipefail
        if [[ ! "$SECTION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
          echo "::error::Invalid checkpoint section identifier."
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/blb-ci-checkpoints/$SECTION"
    - name: Fingerprint the current runner environment
      if: ${{ inputs.recovery == 'true' }}
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
    - name: Fingerprint the test environment
      if: ${{ inputs.recovery == 'true' }}
      id: environment
      shell: bash
      env:
        IMAGE: ${{ steps.runtime.outputs.image }}
        NODE_VERSION: ${{ steps.runtime.outputs.node }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        npm_version=$(npm --version 2>/dev/null || printf 'unavailable')
        python_version=$(python --version 2>/dev/null || printf 'unavailable')
        playwright_version=$(npx playwright --version 2>/dev/null || printf 'unavailable')
        value=$(printf '%s' "$RUNNER_OS|$RUNNER_ARCH|$IMAGE|$NODE_VERSION|$npm_version|$python_version|$playwright_version" | sha256sum | cut -d' ' -f1)
        echo "value=$value" >> "$GITHUB_OUTPUT"
    - name: Restore the newest compatible section checkpoint
      if: ${{ inputs.recovery == 'true' }}
      id: restore
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/blb-ci-checkpoints/${{ inputs.section }}
        key: ${{ inputs.cache_prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-${{ steps.runtime.outputs.node }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.cache_prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-${{ steps.runtime.outputs.node }}-
          ${{ inputs.restore_prefix }}
    - name: Validate the restored completion marker
      if: ${{ inputs.recovery == 'true' }}
      id: check
      shell: bash
      env:
        SECTION: ${{ inputs.section }}
        SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        FINGERPRINT: ${{ inputs.fingerprint }}
        ENVIRONMENT_FINGERPRINT: ${{ steps.environment.outputs.value }}
      run: |
        set -euo pipefail
        node scripts/ci-section-checkpoint.mjs check \
          "$RUNNER_TEMP/blb-ci-checkpoints/$SECTION" \
          "$SECTION" "$SOURCE_SHA" "$FINGERPRINT" "$ENVIRONMENT_FINGERPRINT" >> "$GITHUB_OUTPUT"
    - name: Report checkpoint reuse decision
      if: ${{ inputs.recovery == 'true' }}
      shell: bash
      env:
        SECTION: ${{ inputs.section }}
        COMPLETE: ${{ steps.check.outputs.complete }}
        REASON: ${{ steps.check.outputs.reason }}
        ALWAYS_RUN: ${{ inputs.always_run }}
      run: |
        if [[ "$COMPLETE" == "true" ]]; then
          if [[ "$ALWAYS_RUN" == "true" ]]; then
            echo "::notice::Checkpoint accepted for $SECTION; the section runner will validate and reuse its internal saved results."
          else
            echo "::notice::Checkpoint accepted for $SECTION; skipping the section execution."
          fi
        else
          echo "::notice::Checkpoint not reusable for $SECTION (reason: ${REASON:-unknown}); executing the section."
        fi
    - name: Remove completion marker before validating resumable internal state
      if: ${{ inputs.recovery == 'true' && inputs.always_run == 'true' && steps.check.outputs.complete == 'true' }}
      shell: bash
      env:
        SECTION: ${{ inputs.section }}
      run: rm -f "$RUNNER_TEMP/blb-ci-checkpoints/$SECTION/complete.json"
    - name: Execute section when no compatible pass exists or internal recovery is enabled
      id: execute
      if: ${{ inputs.recovery != 'true' || steps.check.outputs.complete != 'true' || inputs.always_run == 'true' }}
      shell: bash
      env:
        BLB_CI_CHECKPOINT_DIR: ${{ runner.temp }}/blb-ci-checkpoints/${{ inputs.section }}
        BLB_CI_CHECKPOINT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        BLB_CI_CHECKPOINT_FINGERPRINT: ${{ inputs.fingerprint }}
        BLB_CI_CHECKPOINT_ENVIRONMENT_FINGERPRINT: ${{ steps.environment.outputs.value }}
      run: ${{ inputs.run }}
    - name: Record successful section completion
      if: ${{ inputs.recovery == 'true' && success() && (steps.check.outputs.complete != 'true' || inputs.always_run == 'true') }}
      shell: bash
      env:
        SECTION: ${{ inputs.section }}
        SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        FINGERPRINT: ${{ inputs.fingerprint }}
        ENVIRONMENT_FINGERPRINT: ${{ steps.environment.outputs.value }}
      run: |
        set -euo pipefail
        node scripts/ci-section-checkpoint.mjs write \
          "$RUNNER_TEMP/blb-ci-checkpoints/$SECTION" \
          "$SECTION" "$SOURCE_SHA" "$FINGERPRINT" "$ENVIRONMENT_FINGERPRINT"
    - name: Preserve completed or partial checkpoint after this attempt
      if: ${{ inputs.recovery == 'true' && always() && (steps.check.outputs.complete != 'true' || inputs.always_run == 'true') }}
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/blb-ci-checkpoints/${{ inputs.section }}
        key: ${{ inputs.cache_prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-${{ steps.runtime.outputs.node }}-${{ github.run_id }}-${{ github.run_attempt }}
